        const AppStorage = {
            save: (key, value) => {
                const strVal = typeof value === 'string' ? value : JSON.stringify(value);
                try { localStorage.setItem(key, strVal); } catch (e) {}
                try {
                    if (tg.isVersionAtLeast('6.9') && tg.CloudStorage) {
                        if (key === 'jazuch_topics') {
                            const chunkSize = 2500;
                            const chunks = Math.ceil(strVal.length / chunkSize);
                            tg.CloudStorage.setItem('jazuch_topics_chunks', String(chunks));
                            for (let i = 0; i < chunks; i++) {
                                tg.CloudStorage.setItem(`jazuch_topics_${i}`, strVal.slice(i * chunkSize, (i + 1) * chunkSize));
                            }
                            if (strVal.length < 3500) tg.CloudStorage.setItem(key, strVal);
                        } else {
                            tg.CloudStorage.setItem(key, strVal);
                        }
                    }
                } catch (e) {}
            },
            loadAll: (callback) => {
                const baseKeys = ['jazuch_userData', 'jazuch_myLanguages', 'jazuch_topics', 'jazuch_theme', 'jazuch_isRegistered', 'jazuch_goals', 'jazuch_studyTime', 'jazuch_streakData', 'jazuch_notifications', 'jazuch_topics_chunks'];
                const chunkKeys = Array.from({length: 15}, (_, i) => `jazuch_topics_${i}`);
                const allKeys = [...baseKeys, ...chunkKeys];
                
                const localFallback = () => {
                    const values = {};
                    baseKeys.forEach(k => { values[k] = localStorage.getItem(k); });
                    callback(values);
                };
                try {
                    if (tg.isVersionAtLeast('6.9') && tg.CloudStorage) {
                        tg.CloudStorage.getItems(allKeys, (error, values) => {
                            if (error || !values) localFallback();
                            else {
                                const numChunks = parseInt(values['jazuch_topics_chunks'] || '0', 10);
                                if (numChunks > 0) {
                                    let fullTopics = '';
                                    for (let i = 0; i < numChunks; i++) {
                                        fullTopics += (values[`jazuch_topics_${i}`] || '');
                                    }
                                    if (fullTopics) {
                                        try {
                                            JSON.parse(fullTopics);
                                            values['jazuch_topics'] = fullTopics;
                                        } catch (e) {}
                                    }
                                }
                                baseKeys.forEach(k => {
                                    const localVal = localStorage.getItem(k);
                                    if (k === 'jazuch_topics' && localVal) {
                                        if (!values[k] || localVal.length > values[k].length) {
                                            try { JSON.parse(localVal); values[k] = localVal; } catch(e){}
                                        }
                                    } else if (!values[k] && localVal) {
                                        values[k] = localVal;
                                        tg.CloudStorage.setItem(k, values[k]);
                                    }
                                });
                                callback(values);
                            }
                        });
                    } else localFallback();
                } catch(e) { localFallback(); }
            },
            clear: (callback) => {
                try {
                    localStorage.clear();
                    if (tg.isVersionAtLeast('6.9') && tg.CloudStorage) {

                    } else callback();
                } catch(e) { callback(); }
            }

            if (typeof val === 'number') return { study: val, cards: 0, total: val };
            if (val && typeof val === 'object') {
                const st = Number(val.study) || 0;
                const cd = Number(val.cards) || 0;
                return { study: st, cards: cd, total: st + cd };
            }
            return { study: 0, cards: 0, total: 0 };

                    } catch(e) {}
                }
                setOnlineCount(botOnlineCount);

                AppStorage.loadAll((values) => {
                    const isReg = values.jazuch_isRegistered === 'true';
                    setIsRegistered(isReg);
                    if (values.jazuch_theme) setTheme(values.jazuch_theme);
                    
                    let localGoals = {};
                    if (values.jazuch_goals) { try { localGoals = JSON.parse(values.jazuch_goals); } catch(e){} }
                    let loadedGoals = (botGoals && Object.keys(botGoals).length > 0) ? { ...botGoals, ...localGoals } : localGoals;
                    setGoals(loadedGoals);
                    
                    if (values.jazuch_myLanguages) { try { setMyLanguages(JSON.parse(values.jazuch_myLanguages)); } catch(e){} }
                    
                    let loadedTopics = [];
                    if (values.jazuch_topics) { 
                        try { 
                            const parsedTopics = JSON.parse(values.jazuch_topics); 
                            const now = Date.now();
                            loadedTopics = parsedTopics.filter(tp => !tp.deletedAt || (now - tp.deletedAt) < 30 * 24 * 60 * 60 * 1000);
                            setTopics(loadedTopics);
                        } catch(e){} 
                    }

                    if (values.jazuch_studyTime) { try { setStudyTime(JSON.parse(values.jazuch_studyTime)); } catch(e){} }
                    if (values.jazuch_streakData) { try { setStreakData(JSON.parse(values.jazuch_streakData)); } catch(e){} }
                    
                    // Объединяем локальные уведомления и уведомления от бота без дублей
                    let localNotifs = [];
                    if (values.jazuch_notifications) { try { localNotifs = JSON.parse(values.jazuch_notifications); } catch(e){} }
                    const notifMap = new Map();
                    localNotifs.forEach(n => notifMap.set(String(n.id), n));
                    botNotifications.forEach(n => {
                        if (!notifMap.has(String(n.id))) {
                            notifMap.set(String(n.id), { ...n, read: false });
                        }
                    });
                    const mergedNotifs = Array.from(notifMap.values()).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)).slice(0, 50);
                    setNotifications(mergedNotifs);

                    let earliestTs = Date.now();
                    loadedTopics.forEach(tp => {
                        if (tp.id && tp.id > 1600000000000 && tp.id < earliestTs) earliestTs = tp.id;
                        (tp.words || []).forEach(w => {
                            if (w.createdAt && w.createdAt > 1600000000000 && w.createdAt < earliestTs) earliestTs = w.createdAt;
                        });
                    });
                    const fallbackRegDate = botRegDate || getDateStr(new Date(earliestTs));

                    if (values.jazuch_userData) {
                        try {
                            const savedUser = JSON.parse(values.jazuch_userData);
                            setUserData({ 
                                ...savedUser, 
                                uiLanguage: savedUser.uiLanguage || 'ru',
                                botReminders: savedUser.botReminders !== false,
                                regDate: savedUser.regDate || fallbackRegDate,
                                preferredStudyTime: savedUser.preferredStudyTime || '18:00',
                                lastReviewTime: savedUser.lastReviewTime || ''
                            });
                        } catch(e){}
                    } else {
                        setUserData({ name: tg.initDataUnsafe?.user?.first_name || '', uiLanguage: 'ru', botReminders: true, regDate: fallbackRegDate, preferredStudyTime: '18:00', lastReviewTime: '' });
                    }
                    
                    setTimeout(() => {
                        stateLoaded.current = true;
                        setIsLoading(false);
                        if (isReg) setStep('dashboard');
                        else setStep('register');
                    }, 500);
                });
            }, []);

            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            const markActivityToday = () => {
                const todayStr = getDateStr();
                const nowTimeStr = getTimeStr();
                setUserData(prev => ({ ...prev, preferredStudyTime: nowTimeStr, lastReviewTime: nowTimeStr }));
                setStreakData(prev => {
                    if ((prev.activeDays || []).includes(todayStr)) return prev;
                    return { ...prev, activeDays: [...(prev.activeDays || []), todayStr] };
                });
            };

            // Запись времени учёбы: mode = 'study' (по списку) или 'cards' (прохождение карточек)
            const recordStudySeconds = (lang, secs, mode = 'study') => {
                if (!secs || secs <= 0) return;
                const todayStr = getDateStr();
                setStudyTime(prev => {
                    const langData = prev[lang] || {};
                    const currentEntry = parseDayTimeEntry(langData[todayStr]);
                    const updatedEntry = {
                        study: currentEntry.study + (mode === 'study' ? secs : 0),
                        cards: currentEntry.cards + (mode === 'cards' ? secs : 0)
                    };
                    return { ...prev, [lang]: { ...langData, [todayStr]: updatedEntry } };
                });
                markActivityToday();
            };

            const calculateStreak = () => {
                const activeSet = new Set(streakData.activeDays || []);
                const frozenSet = new Set(streakData.frozenDays || []);
                let count = 0;
                let d = new Date();
                const todayStr = getDateStr(d);
                
                if (!activeSet.has(todayStr) && !frozenSet.has(todayStr)) {
                    d.setDate(d.getDate() - 1);
                }
                while (true) {
                    const s = getDateStr(d);
                    if (activeSet.has(s) || frozenSet.has(s)) {
                        count++;
                        d.setDate(d.getDate() - 1);
                    } else {
                        break;
                    }
                }
                return count;
            };

            const handleShare = () => {
                const text = t('shareText');
                const copyFallback = () => {
                    const showToast = () => {
                        setToastMsg(t('shareCopied'));
                        setTimeout(() => setToastMsg(''), 3000);
                    };
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).then(showToast).catch(() => {
                            const ta = document.createElement('textarea');
                            ta.value = text;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand('copy');
                            document.body.removeChild(ta);
                            showToast();
                        });
                    } else {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                        showToast();
                    }
                };

                try {
                    if (tg && tg.openTelegramLink && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        const shareUrl = "https://t.me/share/url?url=" + encodeURIComponent("https://t.me/jazuchbot") + "&text=" + encodeURIComponent("Привет! Мне тут одно приложение понравилось, с помощью которого языки можно учить. Вот ссылка, тоже попробуй");
                        tg.openTelegramLink(shareUrl);
                    } else {
                        copyFallback();
                    }
                } catch (e) {
                    copyFallback();
                }
            };

            // Компактная синхронизация с ботом (защита от лимита 4096 байт в Telegram WebApp.sendData)
            const syncAllData = (overrideGoals = null) => {
                const goalsToSync = overrideGoals || goals;
                const activeTopicsForBot = topics.filter(tp => !tp.deletedAt).map(tp => ({
                    id: tp.id,
                    name: (tp.name || '').slice(0, 35),
                    createdAt: tp.createdAt || tp.id,
                    lastReviewedAt: tp.lastReviewedAt || null,
                    lastReviewTimeStr: tp.lastReviewTimeStr || userData.lastReviewTime || '18:00',
                    words: (tp.words || []).slice(0, 35).map(w => ({
                        q: (w.q || '').slice(0, 30),
                        a: (w.a || '').slice(0, 30),
                        createdAt: w.createdAt || tp.createdAt || tp.id,
                        lastReviewedAt: w.lastReviewedAt || null,
                        studyTimeStr: w.studyTimeStr || userData.preferredStudyTime || '18:00',
                        wrong: w.stats?.wrong || 0,
                        correct: w.stats?.correct || 0
                    }))
                }));

                let payloadObj = { 
                    action: 'sync_all', 
                    goals: goalsToSync, 
                    uiLanguage: userData.uiLanguage, 
                    botReminders: userData.botReminders,
                    regDate: userData.regDate,
                    preferredStudyTime: userData.preferredStudyTime || '18:00',
                    lastReviewTime: userData.lastReviewTime || userData.preferredStudyTime || '18:00',
                    topics: activeTopicsForBot
                };

                // Если пользователь создал очень много карточек и размер JSON превышает 3800 байт, ужимаем список слов для бота, чтобы календарь целей гарантированно сохранился!
                let jsonStr = JSON.stringify(payloadObj);
                if (jsonStr.length > 3800) {
                    payloadObj.topics = activeTopicsForBot.slice(0, 12).map(tp => ({
                        ...tp,
                        words: tp.words.slice(0, 10)
                    }));
                    jsonStr = JSON.stringify(payloadObj);
                }
                if (jsonStr.length > 3950) {
                    payloadObj.topics = [];
                }

                sendToBot(payloadObj, t);
            };

            const formatDuration = (sec) => {
                if (!sec) return `0 ${t('sec')}`;
                const h = Math.floor(sec / 3600);
                const m = Math.floor((sec % 3600) / 60);
                const s = sec % 60;
                let res = [];
                if (h > 0) res.push(`${h} ${t('hrs')}`);
                if (m > 0) res.push(`${m} ${t('min')}`);
                if (s > 0 && h === 0) res.push(`${s} ${t('sec')}`);
                return res.join(' ');
            };

                        {t('shareBtn')}

                return (
                    <div className="h-screen w-screen bg-mint flex flex-col items-center justify-center">

                    </div>
                );

            if (step === 'register') {
                return (

                            </div>

                                    <option value="ru">🇷🇺 Русский</option><option value="en">🇬🇧 English</option>

                                {t('faqText')}
                            </div>
                            <button onClick={() => { setIsRegistered(true); setStep('dashboard'); }} className="w-full py-4 bg-teal-500 hover:bg-teal-600 transition text-white rounded-xl font-bold shadow-lg">
                                {t('onboardingBtn')}
                            </button>
                        </div>
                    </div>
                );
            }

            if (step === 'dashboard') {
                const today = new Date();
                const todayStr = getDateStr(today);
                const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
                const unreadTicketsCount = adminData.tickets.filter(tk => tk.status === 'open').length;
                const unreadNotifsCount = notifications.filter(n => !n.read).length;
                const totalBadgeCount = unreadNotifsCount + (isAdminUser ? unreadTicketsCount : 0);

                const regParts = (userData.regDate || todayStr).split('-');
                const minYear = parseInt(regParts[0], 10) || today.getFullYear();
                const minMonth = (parseInt(regParts[1], 10) || (today.getMonth() + 1)) - 1;
                
                const maxDate = new Date(today.getFullYear(), today.getMonth() + 24, 1);
                const maxYear = maxDate.getFullYear();
                const maxMonth = maxDate.getMonth();

                const canGoPrev = calYear > minYear || (calYear === minYear && calMonth > minMonth);
                const canGoNext = calYear < maxYear || (calYear === maxYear && calMonth < maxMonth);

                const handlePrevMonth = () => {
                    if (!canGoPrev) return;
                    if (calMonth === 0) { setCalMonth(11); setCalYear(y => y - 1); }
                    else setCalMonth(m => m - 1);
                };
                const handleNextMonth = () => {
                    if (!canGoNext) return;
                    if (calMonth === 11) { setCalMonth(0); setCalYear(y => y + 1); }
                    else setCalMonth(m => m + 1);
                };

                const streakCount = calculateStreak();
                const isTodayActiveOrFrozen = (streakData.activeDays || []).includes(todayStr) || (streakData.frozenDays || []).includes(todayStr);

                const currentDayOfWeek = (today.getDay() + 6) % 7; 
                const monday = new Date(today);
                monday.setDate(today.getDate() - currentDayOfWeek);
                const weekDays = Array.from({length: 7}, (_, i) => {
                    const d = new Date(monday);
                    d.setDate(monday.getDate() + i);
                    const s = getDateStr(d);
                    return {
                        label: t('daysShort')[i],
                        dateStr: s,
                        dayNum: d.getDate(),
                        isActive: (streakData.activeDays || []).includes(s),
                        isFrozen: (streakData.frozenDays || []).includes(s),
                        isToday: s === todayStr
                    };
                });

                const currentMonthKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2, '0')}`;
                const usedFreezesThisMonth = streakData.freezesUsedMonth === currentMonthKey ? (streakData.freezesCount || 0) : 0;
                const freezesRemaining = Math.max(0, 3 - usedFreezesThisMonth);
                const isTodayFrozen = (streakData.frozenDays || []).includes(todayStr);

                const isSelectedDatePast = selectedDate && selectedDate < todayStr;

                return (

                                <div

                                    </span>

                                <div className="flex justify-between items-center mb-1">

                                    <span>🔥</span><span>{streakCount}</span>

                                    🔔

                                <button onClick={() => setStep('settings')} className="w-9 h-9 flex items-center justify-center bg-white dark:bg-gray-800 rounded-full shadow-md text-base transition hover:scale-105">⚙️</button>

                                    <button onClick={handleNextMonth} disabled={!canGoNext} className={`font-extrabold px-1.5 transition ${canGoNext ? 'text-teal-600 dark:text-teal-400 hover:scale-110' : 'text-gray-300 dark:text-gray-600 cursor-not-allowed'}`}>›</button>

                            <div className="grid grid-cols-7 gap-1">
                                {Array.from({length: daysInMonth}, (_, i) => i + 1).map(day => {

                const accuracy = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0;

                const langTimeObj = studyTime[activeLanguage] || {};
                const timeEntries = Object.entries(langTimeObj).sort((a, b) => b[0].localeCompare(a[0]));
                const totalSecondsLearned = timeEntries.reduce((acc, [_, val]) => acc + parseDayTimeEntry(val).total, 0);

                // Классификация слов для рекомендаций и плана бота
                const criticalWords = [];
                const reviewWords = [];
                const masteredWords = [];
                const newWords = [];

                allWords.forEach(w => {
                    const att = w.stats?.attempts || 0;
                    const corr = w.stats?.correct || 0;
                    const wrg = w.stats?.wrong || 0;
                    const acc = att > 0 ? Math.round((corr / att) * 100) : null;
                    const item = { ...w, acc, att, corr, wrg };

                    if (att === 0) {
                        newWords.push(item);
                    } else if (acc < 60 || wrg >= 2) {
                        criticalWords.push(item);
                    } else if (acc < 85 || att < 3) {
                        reviewWords.push(item);
                    } else {
                        masteredWords.push(item);
                    }
                });

                criticalWords.sort((a, b) => (a.acc ?? 0) - (b.acc ?? 0));

                return (
                    <div className="min-h-screen p-5 flex flex-col bg-gray-50 dark:bg-gray-900 fade-in">
                        <header className="flex justify-between items-center mb-5 pt-2">
                            <button onClick={() => setStep('dashboard')} className="text-teal-600 dark:text-teal-400 font-bold hover:underline">{t('back')}</button>
                            <h2 className="text-xl font-bold flex items-center gap-2">{getFlag(activeLanguage)} {t('statsBtn')}</h2>
                            <div className="w-10"></div>
                        </header>

                        {/* Верхняя сводная панель */}
                        <div className="grid grid-cols-3 gap-2.5 mb-4">
                            <div className="bg-white dark:bg-gray-800 p-3.5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 text-center">
                                <p className="text-xl font-extrabold text-teal-500">{accuracy}%</p>
                                <p className="text-[11px] font-bold text-gray-400 mt-0.5">{t('accuracy')}</p>
                            </div>
                            <div className="bg-white dark:bg-gray-800 p-3.5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 text-center">
                                <p className="text-xl font-extrabold text-blue-500">{totalAttempts}</p>
                                <p className="text-[11px] font-bold text-gray-400 mt-0.5">{t('attempts')}</p>
                            </div>
                            <div className="bg-white dark:bg-gray-800 p-3.5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 text-center">
                                <p className="text-sm font-extrabold text-purple-500 mt-1">{formatDuration(totalSecondsLearned)}</p>
                                <p className="text-[11px] font-bold text-gray-400 mt-1">{t('totalTime')}</p>
                            </div>
                        </div>

                        {/* Переключатель вкладок статистики */}
                        <div className="flex gap-1.5 mb-4 bg-white dark:bg-gray-800 p-1.5 rounded-2xl border border-gray-100 dark:border-gray-700">
                            <button onClick={() => setStatsTab('recs')} className={`flex-1 py-2 px-1 rounded-xl font-bold text-xs transition ${statsTab === 'recs' ? 'bg-teal-500 text-white shadow' : 'text-gray-500'}`}>{t('recsTab')}</button>
                            <button onClick={() => setStatsTab('words')} className={`flex-1 py-2 px-1 rounded-xl font-bold text-xs transition ${statsTab === 'words' ? 'bg-teal-500 text-white shadow' : 'text-gray-500'}`}>{t('wordsTab')}</button>
                            <button onClick={() => setStatsTab('time')} className={`flex-1 py-2 px-1 rounded-xl font-bold text-xs transition ${statsTab === 'time' ? 'bg-teal-500 text-white shadow' : 'text-gray-500'}`}>{t('timeTab')}</button>
                        </div>

                        {/* Вкладка 6.1: Сводка, таблица приоритетов и рекомендации бота */}
                        {statsTab === 'recs' && (
                            <div className="flex-1 overflow-y-auto space-y-4 mb-6">
                                <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                                    <h3 className="font-extrabold text-base text-teal-600 dark:text-teal-400 mb-1">🤖 {t('recsTitle')}</h3>
                                    <p className="text-xs text-gray-500 dark:text-gray-400 leading-relaxed mb-3">{t('recsSubtitle')}</p>
                                    
                                    <div className="grid grid-cols-2 gap-2 text-xs font-bold">
                                        <div className="p-2.5 rounded-xl bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 flex justify-between">
                                            <span>🔴 Сложные:</span><span>{criticalWords.length}</span>
                                        </div>
                                        <div className="p-2.5 rounded-xl bg-amber-50 dark:bg-amber-900/20 text-amber-600 dark:text-amber-400 flex justify-between">
                                            <span>🟡 На закреплении:</span><span>{reviewWords.length}</span>
                                        </div>
                                        <div className="p-2.5 rounded-xl bg-green-50 dark:bg-green-900/20 text-green-600 dark:text-green-400 flex justify-between">
                                            <span>🟢 Усвоены:</span><span>{masteredWords.length}</span>
                                        </div>
                                        <div className="p-2.5 rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 flex justify-between">
                                            <span>⚪ Новые:</span><span>{newWords.length}</span>
                                        </div>
                                    </div>
                                </div>

                                {allWords.length === 0 ? (
                                    <p className="text-center text-gray-400 text-sm py-8">{t('recsEmpty')}</p>
                                ) : (
                                    <div className="space-y-3">
                                        {criticalWords.length > 0 && (
                                            <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border-l-4 border-red-500 space-y-2.5">
                                                <h4 className="font-extrabold text-xs text-red-500 uppercase tracking-wider">{t('statusCritical')}</h4>
                                                <div className="divide-y divide-gray-100 dark:divide-gray-700">
                                                    {criticalWords.map((w, i) => (
                                                        <div key={i} className="py-2 flex justify-between items-center text-sm">
                                                            <div>
                                                                <span className="font-extrabold">{w.q}</span> — <span className="text-teal-600 dark:text-teal-400 font-semibold">{w.a}</span>
                                                                <p className="text-[10px] text-gray-400">{w.topicName} • Ошибок: {w.wrg}</p>
                                                            </div>
                                                            <span className="px-2 py-1 rounded-lg bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-300 font-extrabold text-xs">{w.acc}%</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {reviewWords.length > 0 && (
                                            <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border-l-4 border-amber-400 space-y-2.5">
                                                <h4 className="font-extrabold text-xs text-amber-500 uppercase tracking-wider">{t('statusReview')}</h4>
                                                <div className="divide-y divide-gray-100 dark:divide-gray-700">
                                                    {reviewWords.map((w, i) => (
                                                        <div key={i} className="py-2 flex justify-between items-center text-sm">
                                                            <div>
                                                                <span className="font-bold">{w.q}</span> — <span className="text-teal-600 dark:text-teal-400">{w.a}</span>
                                                                <p className="text-[10px] text-gray-400">{w.topicName}</p>
                                                            </div>
                                                            <span className="px-2 py-1 rounded-lg bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-300 font-bold text-xs">{w.acc}%</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {masteredWords.length > 0 && (
                                            <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border-l-4 border-green-500 space-y-2">
                                                <h4 className="font-extrabold text-xs text-green-500 uppercase tracking-wider">{t('statusMastered')} ({masteredWords.length})</h4>
                                                <div className="flex flex-wrap gap-1.5 pt-1">
                                                    {masteredWords.map((w, i) => (
                                                        <span key={i} className="px-2.5 py-1 bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-300 rounded-xl text-xs font-bold">
                                                            {w.q} ({w.acc}%)
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Вкладка всех слов по темам */}
                        {statsTab === 'words' && (
                            <div className="flex-1 overflow-y-auto space-y-3 mb-6">
                                {allWords.map((w, idx) => {
                                    const acc = w.stats?.attempts ? Math.round((w.stats.correct / w.stats.attempts) * 100) : 0;
                                    const createdDate = new Date(w.createdAt || Date.now()).toLocaleDateString();
                                    return (
                                        <div key={idx} className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex justify-between items-center">
                                            <div>
                                                <p className="font-bold">{w.q} - <span className="text-teal-600 dark:text-teal-400">{w.a}</span></p>
                                                <p className="text-xs text-gray-400">{w.topicName} • {t('created')}: {createdDate} | {t('attempts')}: {w.stats?.attempts || 0}</p>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <span className={`font-bold text-sm ${acc >= 75 ? 'text-green-500' : acc > 0 ? 'text-orange-500' : 'text-gray-400'}`}>{w.stats?.attempts ? acc+'%' : '-'}</span>
                                                <button onClick={() => {
                                                    setTopics(prev => prev.map(tp => tp.id !== w.topicId ? tp : { ...tp, words: tp.words.map(cw => cw.id !== w.id ? cw : { ...cw, stats: {attempts:0, correct:0, wrong:0} }) }))
                                                }} className="text-red-400 text-xs underline hover:text-red-500">{t('resetStats')}</button>
                                            </div>
                                        </div>
                                    )
                                })}
                                {allWords.length === 0 && <p className="text-center text-gray-400 mt-10">{t('empty')}</p>}
                            </div>
                        )}

                        {/* Вкладка 2 и 6: Время учёбы (список + прохождение карточек) */}
                        {statsTab === 'time' && (
                            <div className="flex-1 overflow-y-auto space-y-3 mb-6">
                                <h3 className="text-xs font-extrabold uppercase tracking-wider text-gray-400 px-1">{t('studyTimeStats')}</h3>
                                {timeEntries.map(([dateKey, rawVal]) => {
                                    const parsed = parseDayTimeEntry(rawVal);
                                    return (
                                        <div key={dateKey} className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 space-y-2">
                                            <div className="flex justify-between items-center border-b border-gray-50 dark:border-gray-700 pb-2">
                                                <span className="font-extrabold text-sm">📅 {dateKey}</span>
                                                <span className="font-extrabold text-teal-600 dark:text-teal-400 text-sm">⏱️ {t('totalDayTime')}: {formatDuration(parsed.total)}</span>
                                            </div>
                                            <div className="flex justify-between text-xs text-gray-500 dark:text-gray-400 font-semibold pt-0.5">
                                                <span>📖 {t('studyListTime')}: <b className="text-gray-700 dark:text-gray-200">{formatDuration(parsed.study)}</b></span>
                                                <span>🗂️ {t('flashcardsTime')}: <b className="text-gray-700 dark:text-gray-200">{formatDuration(parsed.cards)}</b></span>
                                            </div>
                                        </div>
                                    );
                                })}
                                {timeEntries.length === 0 && <p className="text-center text-gray-400 mt-10">{t('empty')}</p>}
                            </div>
                        )}
                        
                        <button onClick={() => {
                            if(confirm(t('resetConfirm'))) {
                                setTopics(prev => prev.map(tp => tp.language !== activeLanguage ? tp : { ...tp, words: tp.words.map(cw => ({...cw, stats: {attempts:0, correct:0, wrong:0}})) }));
                                setStudyTime(prev => ({ ...prev, [activeLanguage]: {} }));
                            }
                        }} className="w-full py-4 text-red-500 font-bold bg-red-50 dark:bg-red-900/20 rounded-2xl hover:bg-red-100 transition">{t('resetAllStats')}</button>
                    </div>
                )
            }

            if (step === 'trash') {
                const deletedTopics = topics.filter(tp => tp.language === activeLanguage && tp.deletedAt);
                return (
                    <div className="min-h-screen p-5 flex flex-col bg-gray-50 dark:bg-gray-900 fade-in">
                        <header className="flex justify-between items-center mb-4 pt-2">
                            <button onClick={() => setStep('app')} className="text-teal-600 dark:text-teal-400 font-bold hover:underline">{t('back')}</button>
                            <h1 className="text-xl font-bold flex items-center gap-2">{t('trashBin')}</h1>
                            <div className="w-10"></div>
                        </header>
                        <p className="text-xs text-center text-gray-400 mb-6">{t('trashInfo')}</p>
                        <div className="flex-1 space-y-4">
                            {deletedTopics.map(topic => {
                                const daysPassed = Math.floor((Date.now() - topic.deletedAt) / (1000 * 60 * 60 * 24));
                                const daysLeft = Math.max(1, 30 - daysPassed);
                                return (
                                    <div key={topic.id} className="bg-white dark:bg-gray-800 p-5 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 flex justify-between items-center">
                                        <div>
                                            <h3 className="font-bold text-lg text-gray-700 dark:text-gray-300">{topic.name}</h3>
                                            <p className="text-xs text-gray-400">{topic.words.length} {t('cards')} • ⏳ {daysLeft} {t('daysLeft')}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => {
                                                setTopics(prev => prev.map(tp => tp.id === topic.id ? { ...tp, deletedAt: null } : tp));
                                            }} className="bg-teal-50 dark:bg-teal-900/40 text-teal-600 dark:text-teal-400 px-3 py-2 rounded-xl text-xs font-bold hover:bg-teal-100 transition">
                                                {t('restore')}
                                            </button>
                                            <button onClick={() => {
                                                setTopics(prev => prev.filter(tp => tp.id !== topic.id));
                                            }} className="bg-red-50 dark:bg-red-900/30 text-red-500 px-3 py-2 rounded-xl text-xs font-bold hover:bg-red-100 transition">
                                                ✕
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                            {deletedTopics.length === 0 && <p className="text-center text-gray-400 mt-10">{t('trashEmpty')}</p>}
                        </div>
                    </div>
                );
            }

            if (step === 'study_mode' && activeTopic) {
                const latestTopicObj = topics.find(tp => tp.id === activeTopic.id) || activeTopic;
                return (
                    <StudyListMode 
                        t={t} 
                        topic={latestTopicObj} 
                        onExit={(elapsedSecs) => {
                            recordStudySeconds(activeLanguage, elapsedSecs, 'study');
                            const nowTimeStr = getTimeStr();
                            setTopics(prev => prev.map(tp => tp.id !== activeTopic.id ? tp : {
                                ...tp,
                                words: (tp.words || []).map(w => ({ ...w, studyTimeStr: nowTimeStr }))
                            }));
                            setActiveTopic(null);
                            setStep('app');
                        }} 
                    />
                );
            }

            // 5. Перетаскивание тем пальцем (Touch & Mouse Drag-and-Drop)
            if (step === 'app' && !activeTopic) {
                const currentTopics = topics.filter(tp => tp.language === activeLanguage && !tp.deletedAt);
                const trashCount = topics.filter(tp => tp.language === activeLanguage && tp.deletedAt).length;

                const swapTopicsOrder = (draggedId, targetId) => {
                    if (!draggedId || !targetId || draggedId === targetId) return;
                    setTopics(prev => {
                        const fromIdx = prev.findIndex(tp => tp.id === draggedId);
                        const toIdx = prev.findIndex(tp => tp.id === targetId);
                        if (fromIdx === -1 || toIdx === -1) return prev;
                        const next = [...prev];
                        const [moved] = next.splice(fromIdx, 1);
                        next.splice(toIdx, 0, moved);
                        return next;
                    });
                };

                const handleTouchMoveTopic = (e) => {
                    if (!draggingTopicId) return;
                    const touch = e.touches[0];
                    const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                    const card = elem?.closest('[data-topic-id]');
                    if (card) {
                        const targetId = Number(card.getAttribute('data-topic-id'));
                        if (targetId && targetId !== draggingTopicId) {
                            swapTopicsOrder(draggingTopicId, targetId);
                        }
                    }
                };

                return (
                    <div 
                        className="min-h-screen p-5 flex flex-col bg-gray-50 dark:bg-gray-900 fade-in"
                        onTouchMove={handleTouchMoveTopic}
                        onTouchEnd={() => setDraggingTopicId(null)}
                        onMouseUp={() => setDraggingTopicId(null)}
                    >
                        <header className="flex justify-between items-center mb-4 pt-2">
                            <button onClick={() => setStep('dashboard')} className="text-teal-600 dark:text-teal-400 font-bold hover:underline">{t('back')}</button>
                            <h1 className="text-xl font-bold flex items-center gap-2">{getFlag(activeLanguage)} {activeLanguage}</h1>
                            <button onClick={() => setStep('trash')} className="relative bg-white dark:bg-gray-800 px-3 py-1.5 rounded-full shadow-sm text-sm font-bold border border-gray-100 dark:border-gray-700 hover:scale-105 transition">
                                🗑️{trashCount > 0 && <span className="ml-1 text-xs text-teal-600 dark:text-teal-400 font-extrabold">({trashCount})</span>}
                            </button>
                        </header>

                        {currentTopics.length > 1 && (
                            <p className="text-[11px] text-center text-gray-400 mb-3">{t('dragHint')}</p>
                        )}
                        
                        <div className="flex-1 space-y-4">
                            {currentTopics.map(topic => (
                                <div 
                                    key={topic.id} 
                                    data-topic-id={topic.id}
                                    draggable={true}
                                    onDragStart={() => setDraggingTopicId(topic.id)}
                                    onDragOver={(e) => { e.preventDefault(); swapTopicsOrder(draggingTopicId, topic.id); }}
                                    onDragEnd={() => setDraggingTopicId(null)}
                                    className={`bg-white dark:bg-gray-800 p-5 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col gap-3 transition ${draggingTopicId === topic.id ? 'dragging-topic ring-2 ring-teal-400 z-20' : 'hover:shadow-md'}`}
                                >
                                    <div className="flex justify-between items-start w-full gap-2">
                                        {/* Иконка перетаскивания пальцем */}
                                        <div 
                                            onTouchStart={(e) => { e.stopPropagation(); setDraggingTopicId(topic.id); }}
                                            onMouseDown={(e) => { e.stopPropagation(); setDraggingTopicId(topic.id); }}
                                            className="text-gray-300 dark:text-gray-600 hover:text-teal-500 cursor-grab active:cursor-grabbing px-1 py-1 text-xl leading-none select-none touch-none"
                                            title="Переместить тему"
                                        >
                                            ☰
                                        </div>
                                        <div onClick={() => setActiveTopic(topic)} className="flex-1 cursor-pointer">
                                            <h3 className="font-bold text-lg leading-snug">{topic.name}</h3>
                                            <p className="text-xs text-gray-400 mt-0.5">{topic.words.length} {t('cards')}</p>
                                        </div>
                                        <button onClick={() => {
                                            if (confirm(t('deleteTopicConfirm'))) {
                                                setTopics(prev => prev.map(tp => tp.id === topic.id ? { ...tp, deletedAt: Date.now() } : tp));
                                            }
                                        }} className="text-gray-300 hover:text-red-500 transition px-1.5 text-lg" title="Удалить тему">🗑️</button>
                                    </div>
                                    <div className="flex gap-2 justify-end pt-1 border-t border-gray-50 dark:border-gray-700/50">
                                        <button onClick={() => {setActiveTopic(topic); setStep('edit_topic');}} className="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-3 py-2 rounded-xl text-xs font-bold hover:bg-gray-200 transition">{t('editTopic')}</button>
                                        <button onClick={() => {setActiveTopic(topic); setStep('study_mode');}} className="bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 px-3.5 py-2 rounded-xl text-xs font-bold hover:bg-blue-100 transition">{t('learnWords')}</button>
                                        <button onClick={() => setActiveTopic(topic)} className="bg-teal-50 dark:bg-teal-900/40 text-teal-600 dark:text-teal-400 px-4 py-1.5 rounded-xl font-bold text-lg hover:bg-teal-100 transition">▶</button>
                                    </div>
                                </div>
                            ))}
                            {currentTopics.length === 0 && <p className="text-center text-gray-400 mt-10">{t('empty')}</p>}
                            <button onClick={() => {setActiveTopic(null); setStep('edit_topic');}} className="w-full mt-4 py-4 text-teal-600 dark:text-teal-400 font-bold border-2 border-dashed border-teal-300 dark:border-teal-700 rounded-3xl hover:bg-teal-50 dark:hover:bg-teal-900/20 transition">+ {t('newTopic')}</button>
                        </div>
                    </div>
                );
            }

            if (step === 'edit_topic') {
                return (
                    <CreateTopicMode t={t} language={activeLanguage} initialTopic={activeTopic} onSave={(updatedTopic) => { 
                        const now = Date.now();
                        const nowTimeStr = getTimeStr();
                        if (activeTopic && updatedTopic.id) {
                            setTopics(prev => prev.map(tp => tp.id === updatedTopic.id ? { ...tp, ...updatedTopic, language: activeLanguage } : tp));
                        } else {
                            const wordsWithTime = (updatedTopic.words || []).map(w => ({ ...w, studyTimeStr: w.studyTimeStr || nowTimeStr }));
                            setTopics(prev => [...prev, { ...updatedTopic, words: wordsWithTime, id: now, createdAt: now, language: activeLanguage }]); 
                        }
                        setStep('app'); setActiveTopic(null);
                    }} onCancel={() => {setStep('app'); setActiveTopic(null);}} />
                );
            }

            // 2 и 3: Засекается время прохождения карточек + сохраняется время повторения для умных напоминаний бота
            if (activeTopic) {
                const latestTopicObj = topics.find(tp => tp.id === activeTopic.id) || activeTopic;
                return (
                    <FlashcardMode 
                        t={t} 
                        topic={latestTopicObj} 
                        onRecordAnswer={(tId, wId, corr) => {
                            markActivityToday();
                            const nowTs = Date.now();
                            const nowTimeStr = getTimeStr();
                            setTopics(prev => prev.map(tp => tp.id !== tId ? tp : { 
                                ...tp, 
                                lastReviewedAt: nowTs,
                                lastReviewTimeStr: nowTimeStr,
                                words: tp.words.map(w => {
                                    if(w.id !== wId) return w;
                                    const st = w.stats || {attempts:0, correct:0, wrong:0};
                                    return { 
                                        ...w, 
                                        lastReviewedAt: nowTs,
                                        lastReviewTimeStr: nowTimeStr,
                                        stats: { attempts: st.attempts+1, correct: st.correct+(corr?1:0), wrong: st.wrong+(corr?0:1) } 
                                    };
                                })
                            }));
                        }} 
                        onBack={(elapsedCardSecs) => {
                            recordStudySeconds(activeLanguage, elapsedCardSecs, 'cards');
                            setActiveTopic(null);
                        }} 
                    />
                );
            }
        }

        function StudyListMode({ t, topic, onExit }) {
            const [seconds, setSeconds] = useState(0);
            useEffect(() => {
                const interval = setInterval(() => {
                    setSeconds(s => s + 1);
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');

            return (
                <div className="min-h-screen p-5 flex flex-col bg-gray-50 dark:bg-gray-900 fade-in">
                    <header className="flex justify-between items-center mb-6 bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 sticky top-2 z-20">
                        <button onClick={() => onExit(seconds)} className="text-teal-600 dark:text-teal-400 font-bold hover:underline">{t('exit')}</button>
                        <div className="text-center">
                            <h2 className="font-bold text-sm">{topic.name}</h2>
                            <p className="text-[11px] text-gray-400">{t('studyModeTitle')}</p>
                        </div>
                        <div className="bg-teal-50 dark:bg-teal-900/40 text-teal-600 dark:text-teal-400 px-3 py-1.5 rounded-xl font-extrabold text-sm flex items-center gap-1">
                            <span>⏱️</span><span>{mins}:{secs}</span>
                        </div>
                    </header>

                    <div className="flex-1 space-y-3 pb-10">
                        {(topic.words || []).map((w, i) => (
                            <div key={w.id || i} className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex justify-between items-center gap-4">
                                <div className="flex items-center gap-3 flex-1">
                                    <span className="w-6 h-6 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-400 text-xs font-bold flex items-center justify-center shrink-0">{i + 1}</span>
                                    <span className="font-extrabold text-base break-words">{w.q}</span>
                                </div>
                                <div className="text-right font-bold text-teal-600 dark:text-teal-400 text-base break-words flex-1">
                                    {w.a}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // 1.1 и 1.2 Умный переход по строкам и создание новой карточки при нажатии на Enter
        function CreateTopicMode({ t, language, initialTopic, onSave, onCancel }) {
            const [topicName, setTopicName] = useState(initialTopic ? initialTopic.name : '');
            const [words, setWords] = useState(initialTopic && initialTopic.words.length ? initialTopic.words : [{id: Date.now()+'_0', q: '', a: '', createdAt: Date.now()}]);
            const inputRefs = useRef({});

            const focusInput = (idx, field) => {
                setTimeout(() => {
                    const el = inputRefs.current[`${idx}_${field}`];
                    if (el) {
                        el.focus();
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 40);
            };

            const handleInputKeyDown = (e, idx, field) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (field === 'q') {
                        // Переход со строки «Слово» на строку «Перевод» этой же карточки
                        focusInput(idx, 'a');
                    } else if (field === 'a') {
                        if (idx < words.length - 1) {
                            // 1.1 Если после текущей карточки уже есть следующая — переносим фокус на неё
                            focusInput(idx + 1, 'q');
                        } else {
                            // 1.2 Если после ввода нет карточки — создаём новую карточку и переносим фокус туда
                            const newCard = {
                                id: Date.now() + '_' + words.length + '_' + Math.random().toString(36).slice(2, 6),
                                q: '',
                                a: '',
                                createdAt: Date.now()
                            };
                            const nextIdx = words.length;
                            setWords(prev => [...prev, newCard]);
                            focusInput(nextIdx, 'q');
                        }
                    }
                }
            };

            return (
                <div className="min-h-screen p-5 flex flex-col bg-gray-50 dark:bg-gray-900">
                    <header className="flex justify-between items-center mb-4 bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                        <button onClick={onCancel} className="text-red-500 font-bold hover:underline">{t('cancel')}</button>
                        <h2 className="font-bold">{initialTopic ? t('editTopic') : t('newTopic')}</h2>
                        <button onClick={() => onSave({id: initialTopic?.id, createdAt: initialTopic?.createdAt, name: topicName || 'Без названия', words: words.filter(w=>w.q.trim()&&w.a.trim())})} className="text-teal-600 dark:text-teal-400 font-bold hover:underline">{t('done')}</button>
                    </header>
                    <input 
                        type="text" 
                        value={topicName} 
                        onChange={e=>setTopicName(e.target.value)} 
                        onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); focusInput(0, 'q'); } }}
                        placeholder={t('topicName')} 
                        className="w-full p-4 text-lg font-bold bg-white dark:bg-gray-800 dark:text-white rounded-2xl mb-2 shadow-sm outline-none border border-gray-100 dark:border-gray-700 focus:border-teal-300 transition" 
                    />
                    <p className="text-[11px] text-gray-400 mb-3 px-1">{t('enterKeyHint')}</p>
                    <div className="space-y-3 mb-4">
                        {words.map((w, idx) => (
                            <div key={w.id} className="flex bg-white dark:bg-gray-800 p-3 rounded-2xl gap-2 shadow-sm border border-gray-100 dark:border-gray-700">
                                <div className="flex-1 space-y-2">
                                    <input 
                                        ref={el => inputRefs.current[`${idx}_q`] = el}
                                        value={w.q} 
                                        onChange={e=>{const nw=words.map((item, i) => i === idx ? {...item, q: e.target.value} : item); setWords(nw);}} 
                                        onKeyDown={(e) => handleInputKeyDown(e, idx, 'q')}
                                        enterKeyHint="next"
                                        className="w-full p-2 bg-gray-50 dark:bg-gray-700 dark:text-white rounded-lg outline-none focus:bg-white dark:focus:bg-gray-600 transition" 
                                        placeholder={t('word')}
                                    />
                                    <input 
                                        ref={el => inputRefs.current[`${idx}_a`] = el}
                                        value={w.a} 
                                        onChange={e=>{const nw=words.map((item, i) => i === idx ? {...item, a: e.target.value} : item); setWords(nw);}} 
                                        onKeyDown={(e) => handleInputKeyDown(e, idx, 'a')}
                                        enterKeyHint="next"
                                        className="w-full p-2 bg-teal-50 dark:bg-teal-900/30 text-teal-700 dark:text-teal-200 rounded-lg outline-none focus:bg-teal-100 dark:focus:bg-teal-800 transition" 
                                        placeholder={t('translation')}
                                    />
                                </div>
                                <button onClick={() => setWords(words.filter(x => x.id !== w.id))} className="text-red-300 hover:text-red-500 font-bold px-2 text-xl transition">✕</button>
                            </div>
                        ))}
                    </div>
                    <button onClick={() => {
                        const nextIdx = words.length;
                        setWords([...words, {id: Date.now()+'_'+words.length+'_'+Math.random().toString(36).slice(2,6), q:'', a:'', createdAt: Date.now()}]);
                        focusInput(nextIdx, 'q');
                    }} className="w-full py-4 text-teal-600 dark:text-teal-400 font-bold border-2 border-dashed border-teal-300 dark:border-teal-700 rounded-2xl bg-teal-50/50 dark:bg-teal-900/20 hover:bg-teal-100 dark:hover:bg-teal-900/40 transition">{t('addCard')}</button>
                </div>
            );
        }

        // 2. Режим карточек с секундомером, идущим в статистику
        function FlashcardMode({ t, topic, onRecordAnswer, onBack }) {
            const [idx, setIdx] = useState(0); 
            const [flipped, setFlipped] = useState(false);
            const [seconds, setSeconds] = useState(0);
            const secondsRef = useRef(0);
            const [words] = useState(() => [...topic.words].sort(() => Math.random() - 0.5));

            useEffect(() => {
                const timer = setInterval(() => {
                    setSeconds(s => {
                        secondsRef.current = s + 1;
                        return s + 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            if (!words[idx]) { onBack(secondsRef.current); return null; }

            const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');

            return (
                <div className="min-h-screen p-6 flex flex-col items-center justify-center bg-gray-50 dark:bg-gray-900 relative">
                    <div className="absolute top-6 left-6 right-6 flex justify-between items-center">
                        <button onClick={() => onBack(secondsRef.current)} className="text-gray-500 font-bold bg-white dark:bg-gray-800 px-4 py-2 rounded-full shadow hover:bg-gray-100 transition">{t('exit')}</button>
                        <div className="bg-teal-50 dark:bg-teal-900/40 text-teal-600 dark:text-teal-400 px-3.5 py-1.5 rounded-full font-extrabold text-sm shadow-sm flex items-center gap-1.5">
                            <span>⏱️</span><span>{mins}:{secs}</span>
                        </div>
                    </div>

                    <h2 className="text-xl font-bold mb-8 mt-12 text-center">{topic.name} <br/><span className="text-teal-500 text-sm">({idx + 1}/{words.length})</span></h2>
                    <div onClick={() => setFlipped(!flipped)} className="w-full max-w-sm aspect-[4/5] bg-white dark:bg-gray-800 rounded-[2.5rem] shadow-xl flex items-center justify-center p-8 border border-gray-100 dark:border-gray-700 cursor-pointer text-center relative hover:scale-[1.02] transition-transform" style={{ perspective: '1500px' }}>
                        <div className="w-full h-full flex flex-col justify-center items-center transition-transform duration-500" style={{ transform: flipped ? 'rotateY(180deg)' : 'rotateY(0)', transformStyle: 'preserve-3d' }}>
                            <p className="absolute top-8 text-teal-400 text-xs font-bold uppercase tracking-widest" style={{ transform: flipped ? 'rotateY(180deg)' : 'rotateY(0)' }}>{flipped ? t('translation') : t('word')}</p>
                            <h3 className="text-4xl font-extrabold break-words w-full" style={{ transform: flipped ? 'rotateY(180deg)' : 'rotateY(0)' }}>{flipped ? words[idx].a : words[idx].q}</h3>
                        </div>
                    </div>
                    <div className="flex gap-4 mt-12 w-full max-w-sm">
                        <button onClick={() => { onRecordAnswer(topic.id, words[idx].id, false); setFlipped(false); setTimeout(() => {if(idx+1>=words.length){alert(t('completed')); onBack(secondsRef.current);}else setIdx(i=>i+1);}, 150); }} className="flex-1 py-4 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-2xl font-bold shadow-sm hover:bg-red-200 transition">{t('dontRemember')}</button>
                        <button onClick={() => { onRecordAnswer(topic.id, words[idx].id, true); setFlipped(false); setTimeout(() => {if(idx+1>=words.length){alert(t('completed')); onBack(secondsRef.current);}else setIdx(i=>i+1);}, 150); }} className="flex-1 py-4 bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded-2xl font-bold shadow-sm hover:bg-green-200 transition">{t('remember')}</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
