<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ЯзУч - Приложение</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        .mint-bg { background-color: #98FF98; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        /* Скрываем скроллбар для красоты */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Приветствия на разных языках
        const greetings = [
            "Здравствуйте!", "Hello!", "Исәнмесез!", "Hola!", 
            "Bonjour!", "Salve!", "Ciao!", "Χαίρετε!"
        ];

        // Основной компонент приложения
        function App() {
            const [step, setStep] = useState('intro'); // intro, register, app, settings, create_topic
            const [theme, setTheme] = useState('light');
            const [userData, setUserData] = useState({ name: '', goal: 'Свободное общение' });
            const [activeLanguage, setActiveLanguage] = useState('');
            const [topics, setTopics] = useState([]); // Формат: {id, name, language, words: []}
            const [activeTopic, setActiveTopic] = useState(null);
            const [randomGreeting, setRandomGreeting] = useState('');
            
            const tg = window.Telegram.WebApp;

            useEffect(() => {
                tg.expand();
                const tgName = tg.initDataUnsafe?.user?.first_name || 'Пользователь';
                setUserData(prev => ({ ...prev, name: tgName }));

                // Выбираем одно случайное приветствие
                setRandomGreeting(greetings[Math.floor(Math.random() * greetings.length)]);

                const timer = setTimeout(() => {
                    setStep('register');
                }, 2000);

                return () => clearTimeout(timer);
            }, []);

            // Переключение темы
            useEffect(() => {
                if (theme === 'dark') document.body.classList.add('dark');
                else document.body.classList.remove('dark');
            }, [theme]);

            // Экран 1: Приветствие
            if (step === 'intro') {
                return (
                    <div className="h-screen w-screen mint-bg flex flex-col items-center justify-center overflow-hidden">
                        <div className="text-center space-y-6 fade-in">
                            <h1 className="text-5xl font-extrabold text-teal-900 drop-shadow-xl tracking-wide">ЯзУч</h1>
                            <p className="text-3xl font-bold text-teal-800 opacity-90 animate-pulse shadow-sm">
                                {randomGreeting}
                            </p>
                        </div>
                    </div>
                );
            }

            // Экран 2: Регистрация / Первый запуск
            if (step === 'register') {
                return (
                    <div className="min-h-screen p-6 flex flex-col items-center justify-center fade-in bg-gradient-to-br from-teal-50 to-mint-bg dark:from-gray-900 dark:to-teal-900">
                        <div className="w-full max-w-md bg-white/80 dark:bg-gray-800/80 backdrop-blur-lg rounded-3xl shadow-2xl p-8 space-y-6 border border-white/20 dark:border-gray-700">
                            <h2 className="text-2xl font-bold text-center bg-clip-text text-transparent bg-gradient-to-r from-teal-600 to-green-500">Настройка профиля</h2>
                            
                            <div className="space-y-2">
                                <label className="block text-sm font-semibold text-gray-600 dark:text-gray-300">Ваше имя</label>
                                <input type="text" value={userData.name} 
                                    onChange={(e) => setUserData({...userData, name: e.target.value})}
                                    className="w-full p-3 bg-white dark:bg-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-teal-400 shadow-inner" />
                            </div>

                            <div className="space-y-2">
                                <label className="block text-sm font-semibold text-gray-600 dark:text-gray-300">Основной язык изучения</label>
                                <select 
                                    value={activeLanguage}
                                    onChange={(e) => setActiveLanguage(e.target.value)}
                                    className="w-full p-3 bg-white dark:bg-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-teal-400 shadow-inner">
                                    <option value="">Выберите язык...</option>
                                    <option value="Кряшенский" className="font-bold text-teal-600">⭐️ Кряшенский (Эксклюзив)</option>
                                    <option value="Английский">Английский</option>
                                    <option value="Татарский">Татарский</option>
                                    <option value="Испанский">Испанский</option>
                                    <option value="Французский">Французский</option>
                                    <option value="Латынь">Латынь</option>
                                    <option value="Итальянский">Итальянский</option>
                                    <option value="Греческий">Греческий</option>
                                </select>
                            </div>

                            <button 
                                onClick={() => activeLanguage ? setStep('app') : alert('Пожалуйста, выберите язык')}
                                className="w-full py-4 bg-gradient-to-r from-teal-400 to-teal-500 hover:from-teal-500 hover:to-teal-600 text-white rounded-xl font-bold text-lg transition-all active:scale-95 shadow-lg shadow-teal-200 dark:shadow-none">
                                Начать обучение
                            </button>
                        </div>
                    </div>
                );
            }

            // Экран Настроек (Личный кабинет)
            if (step === 'settings') {
                return (
                    <div className="min-h-screen p-6 fade-in bg-gray-50 dark:bg-gray-900">
                        <button onClick={() => setStep('app')} className="mb-6 text-teal-600 dark:text-teal-400 font-bold flex items-center gap-2">
                            ← В кабинет
                        </button>
                        <h2 className="text-3xl font-extrabold mb-8 text-gray-800 dark:text-white">⚙️ Настройки</h2>
                        
                        <div className="bg-white dark:bg-gray-800 p-6 rounded-3xl shadow-lg border border-gray-100 dark:border-gray-700 space-y-6">
                            <div className="space-y-2">
                                <label className="block text-sm font-semibold text-gray-500">Имя профиля</label>
                                <input type="text" value={userData.name} 
                                    onChange={(e) => setUserData({...userData, name: e.target.value})}
                                    className="w-full p-3 bg-gray-100 dark:bg-gray-700 rounded-xl outline-none" />
                            </div>
                            
                            <div className="space-y-2">
                                <label className="block text-sm font-semibold text-gray-500">Ваша цель</label>
                                <select 
                                    value={userData.goal}
                                    onChange={(e) => setUserData({...userData, goal: e.target.value})}
                                    className="w-full p-3 bg-gray-100 dark:bg-gray-700 rounded-xl outline-none">
                                    <option>Свободное общение</option>
                                    <option>Чтение литературы</option>
                                    <option>Для путешествий</option>
                                    <option>Для работы/учебы</option>
                                </select>
                            </div>

                            <div className="space-y-2">
                                <label className="block text-sm font-semibold text-gray-500">Переключить активный язык</label>
                                <select 
                                    value={activeLanguage}
                                    onChange={(e) => setActiveLanguage(e.target.value)}
                                    className="w-full p-3 bg-teal-50 text-teal-800 dark:bg-teal-900/30 dark:text-teal-200 rounded-xl outline-none font-bold border-2 border-teal-200 dark:border-teal-700">
                                    <option value="Кряшенский">⭐️ Кряшенский</option>
                                    <option value="Английский">Английский</option>
                                    <option value="Татарский">Татарский</option>
                                    <option value="Испанский">Испанский</option>
                                    <option value="Французский">Французский</option>
                                    <option value="Латынь">Латынь</option>
                                    <option value="Итальянский">Итальянский</option>
                                    <option value="Греческий">Греческий</option>
                                </select>
                            </div>
                        </div>
                    </div>
                );
            }

            // Экран Создания темы
            if (step === 'create_topic') {
                return <CreateTopicMode 
                            language={activeLanguage} 
                            onSave={(newTopic) => {
                                setTopics([...topics, { ...newTopic, id: Date.now(), language: activeLanguage }]);
                                setStep('app');
                            }} 
                            onCancel={() => setStep('app')} 
                        />
            }

            // Экран 3: Основное приложение (Дэшборд)
            if (step === 'app' && !activeTopic) {
                const currentTopics = topics.filter(t => t.language === activeLanguage);

                return (
                    <div className="min-h-screen p-5 pb-20 fade-in bg-gray-50 dark:bg-gray-900">
                        <header className="flex justify-between items-center mb-8 pt-2">
                            <div>
                                <h1 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-500 to-green-500">ЯзУч</h1>
                                <p className="text-gray-500 font-medium text-sm">Привет, {userData.name}! Цель: {userData.goal.toLowerCase()}</p>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')}
                                        className="p-3 bg-white dark:bg-gray-800 rounded-full shadow-md text-xl">
                                    {theme === 'light' ? '🌙' : '☀️'}
                                </button>
                                <button onClick={() => setStep('settings')}
                                        className="p-3 bg-white dark:bg-gray-800 rounded-full shadow-md text-xl">
                                    ⚙️
                                </button>
                            </div>
                        </header>

                        <div className="mb-6">
                            <div className="flex justify-between items-end mb-4">
                                <h2 className="text-2xl font-bold text-gray-800 dark:text-gray-100">
                                    Язык: <span className="text-teal-600">{activeLanguage}</span>
                                </h2>
                            </div>

                            {currentTopics.length === 0 ? (
                                <div className="text-center p-10 bg-gradient-to-br from-white to-teal-50 dark:from-gray-800 dark:to-gray-800 rounded-3xl border border-teal-100 dark:border-gray-700 shadow-sm mt-4">
                                    <div className="text-4xl mb-4">🗂️</div>
                                    <p className="text-gray-500 dark:text-gray-400 mb-6 text-lg">В языке «{activeLanguage}» пока нет тем.</p>
                                    <button onClick={() => setStep('create_topic')} 
                                            className="px-8 py-3 bg-teal-500 hover:bg-teal-600 text-white font-bold rounded-xl shadow-lg transition-transform active:scale-95">
                                        + Создать первую тему
                                    </button>
                                </div>
                            ) : (
                                <div className="grid grid-cols-2 gap-4 mt-4">
                                    {currentTopics.map(topic => (
                                        <div key={topic.id} onClick={() => setActiveTopic(topic)}
                                             className="bg-white dark:bg-gray-800 p-5 rounded-3xl shadow-sm hover:shadow-lg transition-all cursor-pointer border border-gray-100 dark:border-gray-700 relative overflow-hidden group">
                                            <div className="absolute top-0 right-0 w-16 h-16 bg-teal-100 dark:bg-teal-900/30 rounded-bl-full -mr-8 -mt-8 transition-transform group-hover:scale-110"></div>
                                            <h3 className="font-bold text-lg mb-1 relative z-10">{topic.name}</h3>
                                            <p className="text-sm text-gray-400 relative z-10">{topic.words.length} карточек</p>
                                        </div>
                                    ))}
                                    <div onClick={() => setStep('create_topic')} className="bg-teal-50/50 dark:bg-gray-800 p-5 rounded-3xl flex flex-col items-center justify-center border-2 border-dashed border-teal-300 dark:border-teal-700 cursor-pointer hover:bg-teal-50 dark:hover:bg-gray-700 transition-colors">
                                        <span className="text-3xl mb-1 text-teal-400">+</span>
                                        <span className="text-teal-600 dark:text-teal-400 font-bold text-sm">Новая тема</span>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // Экран 4: Карточки (Тренировка)
            if (activeTopic) {
                return <FlashcardMode topic={activeTopic} onBack={() => setActiveTopic(null)} />
            }
        }

        // Компонент Конструктора тем
        function CreateTopicMode({ language, onSave, onCancel }) {
            const [topicName, setTopicName] = useState('');
            const [words, setWords] = useState([{q: '', a: ''}]);

            const handleWordChange = (index, field, value) => {
                const newWords = [...words];
                newWords[index][field] = value;
                setWords(newWords);
            };

            const addWordField = () => setWords([...words, {q: '', a: ''}]);

            const handleSave = () => {
                if (!topicName.trim()) return alert("Введите название темы!");
                const validWords = words.filter(w => w.q.trim() && w.a.trim());
                if (validWords.length === 0) return alert("Добавьте хотя бы одно слово!");
                onSave({ name: topicName, words: validWords });
            };

            return (
                <div className="min-h-screen p-5 fade-in bg-gray-50 dark:bg-gray-900">
                    <header className="flex justify-between items-center mb-6">
                        <button onClick={onCancel} className="text-gray-500 font-bold">Отмена</button>
                        <h2 className="font-bold text-lg text-gray-800 dark:text-white">Новая тема</h2>
                        <button onClick={handleSave} className="text-teal-600 font-bold">Сохранить</button>
                    </header>

                    <div className="space-y-6">
                        <input 
                            type="text" 
                            placeholder="Название темы (например, Глаголы)" 
                            value={topicName}
                            onChange={(e) => setTopicName(e.target.value)}
                            className="w-full p-4 text-xl font-bold bg-white dark:bg-gray-800 border-b-2 border-teal-400 outline-none rounded-t-xl shadow-sm dark:text-white"
                        />
                        
                        <div className="space-y-4">
                            <h3 className="font-bold text-gray-500">Слова ({language}):</h3>
                            {words.map((word, index) => (
                                <div key={index} className="flex gap-2 bg-white dark:bg-gray-800 p-3 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                                    <input type="text" placeholder="Слово" value={word.q} onChange={e => handleWordChange(index, 'q', e.target.value)} className="flex-1 p-2 bg-transparent outline-none dark:text-white" />
                                    <div className="w-px bg-gray-200 dark:bg-gray-600"></div>
                                    <input type="text" placeholder="Перевод" value={word.a} onChange={e => handleWordChange(index, 'a', e.target.value)} className="flex-1 p-2 bg-transparent outline-none dark:text-white" />
                                </div>
                            ))}
                        </div>

                        <button onClick={addWordField} className="w-full py-4 bg-teal-100 text-teal-700 dark:bg-teal-900/30 dark:text-teal-300 rounded-xl font-bold border border-dashed border-teal-300">
                            + Добавить слово
                        </button>
                    </div>
                </div>
            );
        }

        // Компонент режима Карточек
        function FlashcardMode({ topic, onBack }) {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            
            // Перемешиваем слова при загрузке
            const [words, setWords] = useState(() => [...topic.words].sort(() => Math.random() - 0.5));

            const handleNext = () => {
                setIsFlipped(false);
                setTimeout(() => {
                    if (currentIndex + 1 >= words.length) {
                        alert("Тема пройдена! Отличная работа.");
                        onBack();
                    } else {
                        setCurrentIndex((prev) => prev + 1);
                    }
                }, 150);
            };

            const word = words[currentIndex];

            return (
                <div className="min-h-screen p-6 flex flex-col items-center justify-center fade-in bg-gradient-to-b from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800">
                    <button onClick={onBack} className="absolute top-6 left-6 text-gray-500 font-bold bg-white/50 dark:bg-gray-800/50 backdrop-blur px-4 py-2 rounded-full">
                        ← Назад
                    </button>
                    
                    <h2 className="text-xl font-bold mb-8 text-gray-700 dark:text-gray-300 tracking-wide">{topic.name} <span className="text-teal-500">({currentIndex + 1}/{words.length})</span></h2>

                    {/* Карточка */}
                    <div 
                        onClick={() => setIsFlipped(!isFlipped)}
                        className="w-full max-w-sm aspect-[4/5] bg-white dark:bg-gray-800 rounded-[2.5rem] shadow-2xl flex items-center justify-center cursor-pointer p-8 relative border border-gray-50 dark:border-gray-700"
                        style={{ perspective: '1500px' }}
                    >
                        <div className="text-center transition-all duration-500 w-full h-full flex flex-col items-center justify-center" 
                             style={{ transform: isFlipped ? 'rotateY(180deg)' : 'rotateY(0)', transformStyle: 'preserve-3d' }}>
                            <p className="text-teal-400 text-sm mb-4 font-bold uppercase tracking-widest absolute top-8"
                               style={{ transform: isFlipped ? 'rotateY(180deg)' : 'rotateY(0)' }}>
                                {isFlipped ? 'Перевод' : 'Слово'}
                            </p>
                            <h3 className="text-5xl font-extrabold text-gray-800 dark:text-white break-words w-full"
                                style={{ transform: isFlipped ? 'rotateY(180deg)' : 'rotateY(0)' }}>
                                {isFlipped ? word.a : word.q}
                            </h3>
                        </div>
                    </div>

                    <div className="flex gap-4 mt-12 w-full max-w-sm">
                        <button onClick={handleNext} className="flex-1 py-4 bg-red-100 hover:bg-red-200 text-red-600 dark:bg-red-900/40 dark:hover:bg-red-900/60 dark:text-red-400 rounded-2xl font-bold text-lg shadow-sm transition-colors">Не помню ❌</button>
                        <button onClick={handleNext} className="flex-1 py-4 bg-green-100 hover:bg-green-200 text-green-600 dark:bg-green-900/40 dark:hover:bg-green-900/60 dark:text-green-400 rounded-2xl font-bold text-lg shadow-sm transition-colors">Помню ✅</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
