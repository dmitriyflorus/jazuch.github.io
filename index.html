<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ЯзУч - Приложение</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { mint: '#98FF98' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const greetings = ["Здравствуйте!", "Hello!", "Исәнмесез!", "Hola!", "Bonjour!", "Salve!", "Ciao!", "Χαίρετε!"];
        const ALL_LANGUAGES = ["Кряшенский", "Английский", "Татарский", "Испанский", "Французский", "Латынь", "Итальянский", "Греческий"];

        // Универсальная обёртка над Telegram CloudStorage и localStorage
        const storage = {
            set: (key, value) => {
                const str = JSON.stringify(value);
                if (window.Telegram?.WebApp?.CloudStorage) {
                    window.Telegram.WebApp.CloudStorage.setItem(key, str, (err) => {
                        if (err) console.error("CloudStorage set error:", err);
                    });
                }
                localStorage.setItem(key, str);
            },
            get: (key, callback) => {
                if (window.Telegram?.WebApp?.CloudStorage) {
                    window.Telegram.WebApp.CloudStorage.getItem(key, (err, val) => {
                        if (!err && val) {
                            try { callback(JSON.parse(val)); return; } catch(e) {}
                        }
                        const localVal = localStorage.getItem(key);
                        callback(localVal ? JSON.parse(localVal) : null);
                    });
                } else {
                    const localVal = localStorage.getItem(key);
                    callback(localVal ? JSON.parse(localVal) : null);
                }
            },
            clear: () => {
                if (window.Telegram?.WebApp?.CloudStorage) {
                    window.Telegram.WebApp.CloudStorage.getKeys((err, keys) => {
                        if (!err && keys && keys.length > 0) {
                            window.Telegram.WebApp.CloudStorage.removeItems(keys);
                        }
                    });
                }
                localStorage.clear();
            }
        };

        function App() {
            const [step, setStep] = useState('intro');
            const [isLoaded, setIsLoaded] = useState(false);
            const [theme, setTheme] = useState('light');
            const [userData, setUserData] = useState({ name: '', goal: 'Свободное общение' });
            const [myLanguages, setMyLanguages] = useState([]);
            const [topics, setTopics] = useState([]);
            const [activeLanguage, setActiveLanguage] = useState('');
            const [activeTopic, setActiveTopic] = useState(null);
            const [randomGreeting, setRandomGreeting] = useState('');
            
            const tg = window.Telegram?.WebApp;

            // Загрузка данных из CloudStorage при инициализации
            useEffect(() => {
                if (tg) {
                    tg.expand();
                    tg.ready();
                }

                setRandomGreeting(greetings[Math.floor(Math.random() * greetings.length)]);

                storage.get('jazuch_profile', (loadedProfile) => {
                    if (loadedProfile) {
                        setUserData(loadedProfile.userData || { name: '', goal: 'Свободное общение' });
                        setMyLanguages(loadedProfile.myLanguages || []);
                        setTheme(loadedProfile.theme || 'light');
                    } else if (tg?.initDataUnsafe?.user?.first_name) {
                        setUserData(prev => ({ ...prev, name: tg.initDataUnsafe.user.first_name }));
                    }

                    storage.get('jazuch_topics', (loadedTopics) => {
                        if (loadedTopics && Array.isArray(loadedTopics)) {
                            setTopics(loadedTopics);
                        }
                        setIsLoaded(true);
                    });
                });
            }, []);

            // Переход с заставки после загрузки данных
            useEffect(() => {
                if (!isLoaded) return;
                const timer = setTimeout(() => {
                    if (myLanguages.length > 0) {
                        setStep('dashboard');
                    } else {
                        setStep('register');
                    }
                }, 1500);
                return () => clearTimeout(timer);
            }, [isLoaded]);

            // Синхронизация профиля в CloudStorage
            useEffect(() => {
                if (!isLoaded) return;
                storage.set('jazuch_profile', { userData, myLanguages, theme });
            }, [userData, myLanguages, theme, isLoaded]);

            // Синхронизация тем в CloudStorage
            useEffect(() => {
                if (!isLoaded) return;
                storage.set('jazuch_topics', topics);
            }, [topics, isLoaded]);

            // Применение темной/светлой темы
            useEffect(() => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [theme]);

            const handleSetGoal = (date) => {
                alert(`Цель на ${date} зафиксирована.`);
            };

            const Footer = () => (
                <div className="mt-8 text-center pb-6 opacity-70">
                    <p className="font-bold text-xs">«Телляргя сӧйӧӱ белян»</p>
                    <p className="text-xs italic">«С любовью к языкам»</p>
                </div>
            );

            if (step === 'intro' || !isLoaded) {
                return (
                    <div className="h-screen w-screen bg-mint flex flex-col items-center justify-center overflow-hidden">
                        <div className="text-center space-y-6 fade-in">
                            <h1 className="text-5xl font-extrabold text-teal-900 drop-shadow-xl tracking-wide">ЯзУч</h1>
                            <p className="text-3xl font-bold text-teal-800 opacity-90 animate-pulse shadow-sm">
                                {randomGreeting}
                            </p>
                            <p className="text-xs text-teal-900 font-semibold tracking-wider uppercase opacity-75">Синхронизация CloudStorage...</p>
                        </div>
                        <div className="absolute bottom-10 text-teal-900">
                            <Footer />
                        </div>
                    </div>
                );
            }

            if (step === 'register') {
                return (
                    <div className="min-h-screen p-6 flex flex-col items-center justify-center fade-in bg-gradient-to-br from-teal-50 to-mint dark:from-gray-900 dark:to-teal-900">
                        <div className="w-full max-w-md bg-white/80 dark:bg-gray-800/80 backdrop-blur-lg rounded-3xl shadow-2xl p-8 space-y-6 border border-white/20 dark:border-gray-700">
                            <h2 className="text-2xl font-bold text-center bg-clip-text text-transparent bg-gradient-to-r from-teal-600 to-green-500">Добро пожаловать</h2>
                            
                            <div className="space-y-2">
                                <label className="block text-sm font-semibold text-gray-600 dark:text-gray-300">Ваше имя</label>
                                <input type="text" value={userData.name} onChange={(e) => setUserData({...userData, name: e.target.value})} className="w-full p-3 bg-white dark:bg-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-teal-400" />
                            </div>

                            <div className="space-y-2">
                                <label className="block text-sm font-semibold text-gray-600 dark:text-gray-300">Какой язык будем изучать?</label>
                                <select 
                                    value={activeLanguage}
                                    onChange={(e) => setActiveLanguage(e.target.value)}
                                    className="w-full p-3 bg-white dark:bg-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-teal-400">
                                    <option value="">Выберите язык...</option>
                                    {ALL_LANGUAGES.map(l => <option key={l} value={l}>{l}</option>)}
                                </select>
                            </div>

                            <button 
                                onClick={() => {
                                    if(activeLanguage) {
                                        setMyLanguages([activeLanguage]);
                                        setStep('dashboard');
                                    } else {
                                        alert("Пожалуйста, выберите язык");
                                    }
                                }} 
                                className="w-full py-4 bg-gradient-to-r from-teal-400 to-teal-500 hover:from-teal-500 text-white rounded-xl font-bold text-lg shadow-lg active:scale-95">
                                Войти в систему
                            </button>
                        </div>
                        <Footer />
                    </div>
                );
            }

            if (step === 'dashboard') {
                const today = new Date();
                const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
                const daysArray = Array.from({length: daysInMonth}, (_, i) => i + 1);

                return (
                    <div className="min-h-screen p-5 pb-20 fade-in bg-gray-50 dark:bg-gray-900 flex flex-col">
                        <header className="flex justify-between items-center mb-6 pt-2">
                            <div>
                                <h1 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-500 to-green-500">ЯзУч</h1>
                                <p className="text-gray-500 font-medium text-sm">С возвращением, {userData.name}!</p>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')} className="p-3 bg-white dark:bg-gray-800 rounded-full shadow-md text-xl">{theme === 'light' ? '🌙' : '☀️'}</button>
                                <button onClick={() => setStep('settings')} className="p-3 bg-white dark:bg-gray-800 rounded-full shadow-md text-xl">⚙️</button>
                            </div>
                        </header>

                        <div className="bg-white dark:bg-gray-800 p-5 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 mb-6">
                            <h2 className="font-bold text-lg mb-3 flex items-center gap-2">📅 Календарь целей <span className="text-xs font-normal text-gray-400">(Нажми на день)</span></h2>
                            <div className="grid grid-cols-7 gap-1">
                                {daysArray.map(day => {
                                    const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                    const isToday = day === today.getDate();
                                    return (
                                        <div key={day} onClick={() => handleSetGoal(dateStr)} 
                                             className={`aspect-square flex items-center justify-center rounded-lg text-sm font-semibold cursor-pointer transition-colors
                                             ${isToday ? 'bg-teal-500 text-white shadow-md' : 'bg-gray-50 dark:bg-gray-700 hover:bg-teal-100 dark:hover:bg-teal-900'}`}>
                                            {day}
                                        </div>
                                    )
                                })}
                            </div>
                        </div>

                        <div className="flex-1">
                            <h2 className="text-xl font-bold mb-4">Мои языки</h2>
                            <div className="grid grid-cols-2 gap-4">
                                {myLanguages.length === 0 && (
                                    <p className="col-span-2 text-gray-500 text-sm">У вас пока нет добавленных языков.</p>
                                )}
                                {myLanguages.map(lang => (
                                    <div key={lang} onClick={() => { setActiveLanguage(lang); setStep('app'); }} 
                                         className="bg-white dark:bg-gray-800 p-5 rounded-3xl shadow-sm hover:shadow-md cursor-pointer border border-gray-100 dark:border-gray-700 relative overflow-hidden">
                                        <div className="text-3xl mb-2">🌍</div>
                                        <h3 className="font-bold text-lg">{lang}</h3>
                                        <p className="text-xs text-gray-500">{topics.filter(t => t.language === lang).length} тем</p>
                                    </div>
                                ))}
                                <div onClick={() => setStep('settings')} className="bg-teal-50/50 dark:bg-gray-800 p-5 rounded-3xl flex flex-col items-center justify-center border-2 border-dashed border-teal-300 dark:border-teal-700 cursor-pointer">
                                    <span className="text-2xl mb-1 text-teal-400">+</span>
                                    <span className="text-teal-600 dark:text-teal-400 font-bold text-xs text-center">Добавить язык</span>
                                </div>
                            </div>
                        </div>
                        <Footer />
                    </div>
                );
            }

            if (step === 'settings') {
                return (
                    <div className="min-h-screen p-6 fade-in flex flex-col bg-gray-50 dark:bg-gray-900">
                        <button onClick={() => setStep('dashboard')} className="mb-6 text-teal-600 dark:text-teal-400 font-bold flex items-center gap-2">← На рабочий стол</button>
                        <h2 className="text-3xl font-extrabold mb-8 text-gray-800 dark:text-white">⚙️ Настройки</h2>
                        <div className="bg-white dark:bg-gray-800 p-6 rounded-3xl shadow-lg border border-gray-100 dark:border-gray-700 space-y-6 flex-1">
                            <div className="space-y-2">
                                <label className="block text-sm font-semibold text-gray-500">Имя профиля</label>
                                <input type="text" value={userData.name} onChange={(e) => setUserData({...userData, name: e.target.value})} className="w-full p-3 bg-gray-100 dark:bg-gray-700 rounded-xl outline-none" />
                            </div>
                            
                            <div className="space-y-2">
                                <label className="block text-sm font-semibold text-gray-500">Добавить новый язык</label>
                                <select 
                                    value={''} 
                                    onChange={(e) => { 
                                        const newLang = e.target.value;
                                        if (newLang && !myLanguages.includes(newLang)) {
                                            setMyLanguages([...myLanguages, newLang]);
                                        }
                                        setActiveLanguage(newLang); 
                                        setStep('app'); 
                                    }} 
                                    className="w-full p-3 bg-teal-50 text-teal-800 dark:bg-teal-900/30 dark:text-teal-200 rounded-xl outline-none font-bold border-2 border-teal-200 dark:border-teal-700">
                                    <option value="">Выберите язык для добавления...</option>
                                    {ALL_LANGUAGES.map(l => <option key={l} value={l} disabled={myLanguages.includes(l)}>{l}</option>)}
                                </select>
                            </div>

                            <button onClick={() => {
                                if(confirm("Стереть все данные из CloudStorage и кэша?")) {
                                    storage.clear();
                                    window.location.reload();
                                }
                            }} className="w-full mt-4 py-3 bg-red-50 text-red-500 dark:bg-red-900/20 dark:text-red-400 rounded-xl font-bold">Сбросить данные приложения</button>
                        </div>
                        <Footer />
                    </div>
                );
            }

            if (step === 'create_topic') {
                return <CreateTopicMode language={activeLanguage} onSave={(newTopic) => { setTopics([...topics, { ...newTopic, id: Date.now(), language: activeLanguage }]); setStep('app'); }} onCancel={() => setStep('app')} Footer={Footer}/>
            }

            if (step === 'app' && !activeTopic) {
                const currentTopics = topics.filter(t => t.language === activeLanguage);
                return (
                    <div className="min-h-screen p-5 pb-20 fade-in bg-gray-50 dark:bg-gray-900 flex flex-col">
                        <header className="flex justify-between items-center mb-6 pt-2">
                            <button onClick={() => setStep('dashboard')} className="text-teal-600 font-bold">← Рабочий стол</button>
                            <h1 className="text-xl font-bold">{activeLanguage}</h1>
                        </header>

                        <div className="flex-1">
                            {currentTopics.length === 0 ? (
                                <div className="text-center p-8 bg-white dark:bg-gray-800 rounded-3xl border border-teal-100 dark:border-gray-700 shadow-sm mt-4">
                                    <div className="text-4xl mb-4">🗂️</div>
                                    <p className="text-gray-500 dark:text-gray-400 mb-6">Здесь пока пусто.</p>
                                    <button onClick={() => setStep('create_topic')} className="px-6 py-3 bg-teal-500 text-white font-bold rounded-xl shadow-lg">Создать тему</button>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 gap-4 mt-4">
                                    {currentTopi</html>
