<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ЯзУч - Приложение</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { mint: '#98FF98' } } }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const tg = window.Telegram.WebApp;
        const ADMIN_ID = 1311119781;

        const AppStorage = {
            save: (key, value) => {
                const strVal = typeof value === 'string' ? value : JSON.stringify(value);
                try {
                    if (tg.isVersionAtLeast('6.9') && tg.CloudStorage) tg.CloudStorage.setItem(key, strVal);
                    localStorage.setItem(key, strVal); 
                } catch (e) {}
            },
            loadAll: (callback) => {
                const keys = ['jazuch_userData', 'jazuch_myLanguages', 'jazuch_topics', 'jazuch_theme', 'jazuch_isRegistered', 'jazuch_goals'];
                const localFallback = () => {
                    const values = {};
                    keys.forEach(k => { values[k] = localStorage.getItem(k); });
                    callback(values);
                };
                try {
                    if (tg.isVersionAtLeast('6.9') && tg.CloudStorage) {
                        tg.CloudStorage.getItems(keys, (error, values) => {
                            if (error || !values) localFallback();
                            else {
                                keys.forEach(k => {
                                    if (!values[k] && localStorage.getItem(k)) {
                                        values[k] = localStorage.getItem(k);
                                        tg.CloudStorage.setItem(k, values[k]);
                                    }
                                });
                                callback(values);
                            }
                        });
                    } else localFallback();
                } catch(e) { localFallback(); }
            },
            clear: (callback) => {
                try {
                    localStorage.clear();
                    if (tg.isVersionAtLeast('6.9') && tg.CloudStorage) {
                        tg.CloudStorage.removeItems(['jazuch_userData', 'jazuch_myLanguages', 'jazuch_topics', 'jazuch_theme', 'jazuch_isRegistered', 'jazuch_goals'], callback);
                    } else callback();
                } catch(e) { callback(); }
            }
        };

        const translations = {
            ru: {
                welcome: "Добро пожаловать", yourName: "Ваше имя", login: "Войти в систему", goalCalendar: "Календарь целей", clickDay: "Нажми на день для создания цели", myLangs: "Мои языки", addLang: "Добавить язык", settings: "Настройки", uiLang: "Язык интерфейса", resetData: "Сбросить данные приложения", resetConfirm: "Удалить все данные? Вам придётся заново ввести /start в боте.", empty: "Здесь пока пусто.", createTopic: "Создать тему", editTopic: "✏️ Редактировать", newTopic: "Новая тема", cards: "карточек", cancel: "Отмена", done: "Готово", topicName: "Название темы", word: "Слово", translation: "Перевод", addCard: "+ Добавить карточку", exit: "← Выйти", dontRemember: "Не помню ❌", remember: "Помню ✅", completed: "Тема пройдена! Отличная работа.", back: "← Назад", support: "Написать в поддержку", sendClose: "Отправить", goalSet: "Добавить", goalText: "Текст цели", saveGoal: "Сохранить", syncBot: "💾 Сохранить изменения", adminPanel: "Панель Администратора", adminTickets: "Обращения", reply: "Ответить", markRead: "Прочитано ✓", faqBtn: "ЧаВо (Инструкция)",
                sendDataError: "Для отправки данных откройте ЯзУч через кнопку меню внизу чата.",
                faqText: "🧠 Как учить эффективно? (Плюшки ЯзУча)\n\nМы используем методику интервального повторения Эббингауза!\n\n1. Откладывайте те слова, которые вы уже запомнили (кнопка 'Помню').\n2. Делайте упор на те, что даются сложно (кнопка 'Не помню').\n3. Наш умный бот сам вычислит слова, в которых вы чаще ошибаетесь, и пришлёт вам напоминания для их повторения в самый нужный момент, чтобы они закрепились в долгосрочной памяти!\n\nИспользуйте календарь для установки целей, а статистику — для отслеживания прогресса!",
                statsBtn: "Статистика", deleteLangConfirm: "Вы уверены, что хотите убрать этот язык с рабочего стола?", accuracy: "Точность", attempts: "Раз пройдено", resetStats: "Сбросить", resetAllStats: "Сбросить статистику языка", created: "Создано", botReminders: "🤖 Умные напоминания от бота (Интервальное повторение)", saveChanges: "Сохранить изменения", onboardingBtn: "Всё понятно, начать! 🚀"
            },
            en: {
                welcome: "Welcome", yourName: "Your Name", login: "Login", goalCalendar: "Goals Calendar", clickDay: "Click a day to add a goal", myLangs: "My Languages", addLang: "Add Language", settings: "Settings", uiLang: "UI Language", resetData: "Reset App Data", resetConfirm: "Delete all data? You will need to type /start in the bot again.", empty: "It's empty here.", createTopic: "Create Topic", editTopic: "✏️ Edit Topic", newTopic: "New Topic", cards: "cards", cancel: "Cancel", done: "Done", topicName: "Topic Name", word: "Word", translation: "Translation", addCard: "+ Add Card", exit: "← Exit", dontRemember: "Don't Remember ❌", remember: "Remember ✅", completed: "Topic completed! Great job.", back: "← Back", support: "Contact Support", sendClose: "Send", goalSet: "Add", goalText: "Goal text", saveGoal: "Save", syncBot: "💾 Save Changes", adminPanel: "Admin Panel", adminTickets: "Tickets", reply: "Reply", markRead: "Read ✓", faqBtn: "FAQ (How-to)",
                sendDataError: "Please open the app via the main keyboard button to send data.",
                faqText: "🧠 How to learn effectively? (JazUch Features)\n\nWe use the Ebbinghaus spaced repetition method!\n\n1. Skip the words you already know ('Remember' button).\n2. Focus on hard words ('Don't Remember' button).\n3. Our smart bot will calculate the words you struggle with and send you reminders at the perfect time so they stick in your long-term memory!\n\nUse the calendar to set goals and statistics to track your progress!",
                statsBtn: "Statistics", deleteLangConfirm: "Are you sure you want to remove this language?", accuracy: "Accuracy", attempts: "Attempts", resetStats: "Reset", resetAllStats: "Reset Language Stats", created: "Created", botReminders: "🤖 Smart Bot Reminders (Spaced Repetition)", saveChanges: "Save Changes", onboardingBtn: "Got it, let's start! 🚀"
            }
        };

        const DEFAULT_LANG_FLAGS = {
            "Английский": "🇬🇧", "Арабский": "🇸🇦", "Испанский": "🇪🇸", "Итальянский": "🇮🇹", "Китайский": "🇨🇳", "Корейский": "🇰🇷", "Кряшенский": "🇷🇺", "Латынь": "🏛️", "Немецкий": "🇩🇪", "Русский": "🇷🇺", "Татарский": "🇷🇺", "Турецкий": "🇹🇷", "Французский": "🇫🇷", "Хинди": "🇮🇳", "Японский": "🇯🇵"
        };
        
        const ALL_LANGUAGES = Object.keys(DEFAULT_LANG_FLAGS).sort((a, b) => a.localeCompare(b, 'ru'));
        
        const sendToBot = (dataObj, t) => {
            try { 
                tg.sendData(JSON.stringify(dataObj)); 
            } catch (e) { 
                alert(t('sendDataError')); 
            }
        };

        function App() {
            const [step, setStep] = useState('intro');
            const [isLoading, setIsLoading] = useState(true);
            const stateLoaded = useRef(false);
            
            const [isRegistered, setIsRegistered] = useState(false);
            const [theme, setTheme] = useState('light');
            const [userData, setUserData] = useState({ name: '', uiLanguage: 'ru', botReminders: true });
            const [myLanguages, setMyLanguages] = useState([]);
            const [topics, setTopics] = useState([]);
            const [goals, setGoals] = useState({});
            
            const [activeLanguage, setActiveLanguage] = useState('');
            const [activeTopic, setActiveTopic] = useState(null);
            
            const [selectedDate, setSelectedDate] = useState(null);
            const [goalText, setGoalText] = useState('');
            const [goalTime, setGoalTime] = useState('14:00');
            
            const [supportModal, setSupportModal] = useState(false);
            const [supportText, setSupportText] = useState('');
            const [addLangModal, setAddLangModal] = useState(false);

            const [isAdminUser, setIsAdminUser] = useState(false);
            const [adminData, setAdminData] = useState({ tickets: [] });
            const [adminModal, setAdminModal] = useState(false);
            const [selectedTicket, setSelectedTicket] = useState(null);
            const [ticketReplyText, setTicketReplyText] = useState('');

            const t = (key) => translations[userData?.uiLanguage || 'ru']?.[key] || translations['ru'][key] || key;
            const getFlag = (lang) => DEFAULT_LANG_FLAGS[lang] || '🌍';

            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_userData', userData); }, [userData]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_myLanguages', myLanguages); }, [myLanguages]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_topics', topics); }, [topics]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_theme', theme); }, [theme]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_isRegistered', isRegistered); }, [isRegistered]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_goals', goals); }, [goals]);

            useEffect(() => {
                tg.expand();
                const tgUserId = tg.initDataUnsafe?.user?.id;
                if (Number(tgUserId) === ADMIN_ID) setIsAdminUser(true);

                const urlParams = new URLSearchParams(window.location.search);
                const dataParam = urlParams.get('data');
                let botGoals = null;

                if (dataParam) {
                    try {
                        const parsed = JSON.parse(decodeURIComponent(dataParam));
                        if (parsed.goals) botGoals = parsed.goals;
                        if (parsed.tickets) setAdminData({ tickets: parsed.tickets });
                        if (parsed.is_admin && (!tgUserId || Number(tgUserId) === ADMIN_ID)) setIsAdminUser(true);
                    } catch(e) {}
                }

                AppStorage.loadAll((values) => {
                    const isReg = values.jazuch_isRegistered === 'true';
                    setIsRegistered(isReg);
                    if (values.jazuch_theme) setTheme(values.jazuch_theme);
                    
                    let localGoals = {};
                    if (values.jazuch_goals) { try { localGoals = JSON.parse(values.jazuch_goals); } catch(e){} }
                    
                    // Решение бага с перезаписью целей: приоритет отдается боту, но локальные не стираются, если от бота пришло пусто
                    let loadedGoals = (botGoals && Object.keys(botGoals).length > 0) ? botGoals : localGoals;
                    setGoals(loadedGoals);
                    
                    if (values.jazuch_myLanguages) { try { setMyLanguages(JSON.parse(values.jazuch_myLanguages)); } catch(e){} }
                    if (values.jazuch_topics) { try { setTopics(JSON.parse(values.jazuch_topics)); } catch(e){} }
                    
                    if (values.jazuch_userData) {
                        try {
                            const savedUser = JSON.parse(values.jazuch_userData);
                            setUserData({ 
                                ...savedUser, 
                                uiLanguage: savedUser.uiLanguage || 'ru',
                                botReminders: savedUser.botReminders !== false // default true
                            });
                        } catch(e){}
                    } else {
                        setUserData({ name: tg.initDataUnsafe?.user?.first_name || '', uiLanguage: 'ru', botReminders: true });
                    }
                    
                    setTimeout(() => {
                        stateLoaded.current = true;
                        setIsLoading(false);
                        if (isReg) setStep('dashboard');
                        else setStep('register');
                    }, 500);
                });
            }, []);

            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            const syncAllData = () => {
                sendToBot({ 
                    action: 'sync_all', 
                    goals: goals, 
                    uiLanguage: userData.uiLanguage, 
                    botReminders: userData.botReminders,
                    topics: topics // Отправляем топики боту для аналитики интервального повторения
                }, t);
            };

            const Footer = () => (
                <div className="mt-8 text-center pb-6 opacity-70">
                    <p className="font-bold text-xs">«Телляргя сӧйӧӱ белян»</p>
                    <p className="text-xs italic">«С любовью к языкам»</p>
                </div>
            );

            if (step === 'intro') {
                return (
                    <div className="h-screen w-screen bg-mint flex flex-col items-center justify-center">
                        <h1 className="text-5xl font-extrabold text-teal-900 drop-shadow-xl tracking-wide fade-in">ЯзУч</h1>
                    </div>
                );
            }

            if (step === 'register') {
                return (
                    <div className="min-h-screen p-6 flex flex-col items-center justify-center fade-in bg-gradient-to-br from-teal-50 to-mint dark:from-gray-900 dark:to-teal-900">
                        <div className="w-full max-w-md bg-white/80 dark:bg-gray-800/80 backdrop-blur-lg rounded-3xl p-8 space-y-6">
                            <h2 className="text-2xl font-bold text-center text-teal-600 dark:text-teal-400">{t('welcome')}</h2>
                            <div className="space-y-2">
                                <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300">{t('yourName')}</label>
                                <input type="text" value={userData.name} onChange={e => setUserData({...userData, name: e.target.value})} className="w-full p-3 bg-white dark:bg-gray-700 rounded-xl outline-none font-semibold text-gray-900 dark:text-white" placeholder="Ваше имя..." />
                            </div>
                            <div className="space-y-2">
                                <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300">{t('uiLang')}</label>
                                <select value={userData.uiLanguage} onChange={(e) => setUserData({...userData, uiLanguage: e.target.value})} className="w-full p-3 bg-white dark:bg-gray-700 rounded-xl outline-none font-semibold text-gray-900 dark:text-white">
                                    <option value="ru">🇷🇺 Русский</option><option value="en">🇬🇧 English</option>
                                </select>
                            </div>
                            <button onClick={() => { setMyLanguages(['Английский']); setStep('onboarding'); }} className="w-full py-4 bg-teal-500 hover:bg-teal-600 transition text-white rounded-xl font-bold shadow-lg">{t('login')}</button>
                        </div>
                    </div>
                );
            }

            if (step === 'onboarding') {
                return (
                    <div className="min-h-screen p-6 flex flex-col items-center justify-center fade-in bg-gradient-to-br from-teal-50 to-blue-50 dark:from-gray-900 dark:to-gray-800">
                        <div className="w-full max-w-md bg-white dark:bg-gray-800 rounded-3xl p-8 shadow-xl">
                            <h2 className="text-2xl font-extrabold mb-4 text-teal-600 dark:text-teal-400">🎉 {t('welcome')}, {userData.name || 'друг'}!</h2>
                            <div className="whitespace-pre-line leading-relaxed text-sm text-gray-700 dark:text-gray-300 mb-8 font-medium">
                                {t('faqText')}
                            </div>
                            <button onClick={() => { setIsRegistered(true); setStep('dashboard'); }} className="w-full py-4 bg-teal-500 hover:bg-teal-600 transition text-white rounded-xl font-bold shadow-lg">
                                {t('onboardingBtn')}
                            </button>
                        </div>
                    </div>
                );
            }

            if (step === 'dashboard') {
                const today = new Date();
                const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
                const unreadTicketsCount = adminData.tickets.filter(tk => tk.status === 'open').length;

                return (
                    <div className="min-h-screen p-5 pb-20 fade-in bg-gray-50 dark:bg-gray-900 flex flex-col">
                        <header className="flex justify-between items-center mb-6 pt-2">
                            <h1 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-500 to-green-500">ЯзУч</h1>
                            <div className="flex gap-2 items-center">
                                <button onClick={() => setStep('faq')} className="w-10 h-10 flex items-center justify-center bg-white dark:bg-gray-800 rounded-full shadow-md text-lg transition hover:scale-105">❓</button>
                                {isAdminUser ? (
                                    <button onClick={() => setAdminModal(true)} className="relative w-10 h-10 flex items-center justify-center bg-white dark:bg-gray-800 rounded-full shadow-md text-lg transition hover:scale-105">
                                        🔔{unreadTicketsCount > 0 && <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full">{unreadTicketsCount}</span>}
                                    </button>
                                ) : (
                                    <button onClick={() => setSupportModal(true)} className="w-10 h-10 flex items-center justify-center bg-white dark:bg-gray-800 rounded-full shadow-md text-lg transition hover:scale-105">🎧</button>
                                )}
                                <button onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')} className="w-10 h-10 flex items-center justify-center bg-white dark:bg-gray-800 rounded-full shadow-md text-lg transition hover:scale-105">{theme === 'light' ? '🌙' : '☀️'}</button>
                                <button onClick={() => setStep('settings')} className="w-10 h-10 flex items-center justify-center bg-white dark:bg-gray-800 rounded-full shadow-md text-lg transition hover:scale-105">⚙️</button>
                            </div>
                        </header>

                        <div className="bg-white dark:bg-gray-800 p-5 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 mb-6">
                            <h2 className="font-bold text-lg mb-1">📅 {t('goalCalendar')}</h2>
                            <p className="text-xs text-gray-400 mb-3">{t('clickDay')}</p>
                            <div className="grid grid-cols-7 gap-1">
                                {Array.from({length: daysInMonth}, (_, i) => i + 1).map(day => {
                                    const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                    const isToday = day === today.getDate();
                                    const hasGoal = goals[dateStr] && goals[dateStr].text;
                                    return (
                                        <div key={day} onClick={() => { setSelectedDate(dateStr); setGoalText(hasGoal ? goals[dateStr].text : ''); setGoalTime(hasGoal ? goals[dateStr].time : '14:00'); }} 
                                             className={`relative aspect-square flex flex-col items-center justify-center rounded-lg text-sm font-semibold cursor-pointer transition hover:opacity-80 ${isToday ? 'bg-teal-500 text-white shadow-md' : hasGoal ? 'bg-teal-50 text-teal-700 border border-teal-200 dark:bg-teal-900/40 dark:text-teal-300 dark:border-teal-700' : 'bg-gray-50 dark:bg-gray-700'}`}>
                                            <span>{day}</span>
                                        </div>
                                    )
                                })}
                            </div>
                            <button onClick={syncAllData} className="w-full mt-4 py-3 bg-teal-50 dark:bg-teal-900/30 text-teal-600 dark:text-teal-400 font-bold rounded-xl text-sm border border-teal-200 dark:border-teal-800 transition hover:bg-teal-100 dark:hover:bg-teal-900/50">
                                {t('syncBot')}
                            </button>
                        </div>

                        <div className="flex-1">
                            <h2 className="text-xl font-bold mb-4">{t('myLangs')}</h2>
                            <div className="grid grid-cols-2 gap-4">
                                {myLanguages.map(lang => (
                                    <div key={lang} className="bg-white dark:bg-gray-800 p-4 rounded-3xl cursor-pointer border border-gray-100 dark:border-gray-700 shadow-sm flex flex-col relative group hover:shadow-md transition">
                                        <div className="absolute top-3 right-3 flex gap-2">
                                            <button onClick={(e) => { e.stopPropagation(); setActiveLanguage(lang); setStep('lang_stats'); }} className="text-gray-400 hover:text-blue-500 transition text-sm">📊</button>
                                            <button onClick={(e) => { e.stopPropagation(); if(confirm(t('deleteLangConfirm'))) setMyLanguages(prev => prev.filter(l => l !== lang)); }} className="text-gray-400 hover:text-red-500 transition text-sm">✕</button>
                                        </div>
                                        <div onClick={() => { setActiveLanguage(lang); setStep('app'); }} className="flex flex-col items-center justify-center flex-1 mt-4">
                                            <div className="text-4xl mb-2 drop-shadow-sm">{getFlag(lang)}</div>
                                            <h3 className="font-bold text-lg text-gray-800 dark:text-gray-200">{lang}</h3>
                                        </div>
                                    </div>
                                ))}
                                <div onClick={() => setAddLangModal(true)} className="bg-teal-50/50 dark:bg-gray-800/50 p-5 rounded-3xl flex flex-col items-center justify-center border-2 border-dashed border-teal-300 dark:border-teal-700 cursor-pointer transition hover:bg-teal-50 dark:hover:bg-gray-800">
                                    <span className="text-3xl text-teal-500 opacity-70">+</span>
                                </div>
                            </div>
                        </div>
                        
                        {/* Календарь Модалка */}
                        {selectedDate && (
                            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 fade-in">
                                <div className="bg-white dark:bg-gray-800 rounded-3xl p-6 w-full max-w-sm">
                                    <h3 className="text-lg font-bold mb-4 text-teal-600 dark:text-teal-400">{selectedDate}</h3>
                                    <div className="space-y-3 mb-4">
                                        <input type="text" value={goalText} onChange={e => setGoalText(e.target.value)} placeholder={t('goalText')} className="w-full p-3 bg-gray-50 dark:bg-gray-700 dark:text-white rounded-xl outline-none" />
                                        <input type="time" value={goalTime} onChange={e => setGoalTime(e.target.value)} className="w-full p-3 bg-gray-50 dark:bg-gray-700 dark:text-white rounded-xl outline-none font-bold" />
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => {
                                            const newGoals = {...goals};
                                            delete newGoals[selectedDate];
                                            setGoals(newGoals);
                                            setSelectedDate(null);
                                        }} className="flex-1 py-3 bg-red-50 dark:bg-red-900/30 text-red-500 font-bold rounded-xl">Удалить</button>
                                        <button onClick={() => {
                                            if (goalText.trim()) setGoals({ ...goals, [selectedDate]: { text: goalText.trim(), time: goalTime, notified: false } });
                                            setSelectedDate(null);
                                        }} className="flex-1 py-3 bg-teal-500 hover:bg-teal-600 text-white font-bold rounded-xl">{t('saveGoal')}</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Добавить Язык */}
                        {addLangModal && (
                            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 fade-in">
                                <div className="bg-white dark:bg-gray-800 rounded-3xl p-6 w-full max-w-sm max-h-[85vh] flex flex-col">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-xl font-bold text-teal-600 dark:text-teal-400">{t('addLang')}</h3>
                                        <button onClick={() => setAddLangModal(false)} className="text-red-500 font-bold px-2 text-xl">✕</button>
                                    </div>
                                    <div className="overflow-y-auto flex-1 space-y-2 pr-2">
                                        {ALL_LANGUAGES.filter(l => !myLanguages.includes(l)).map(lang => (
                                            <div key={lang} onClick={() => { setMyLanguages([...myLanguages, lang]); setAddLangModal(false); }} className="p-3 bg-gray-50 dark:bg-gray-700 border border-gray-100 dark:border-gray-600 rounded-xl flex items-center gap-3 cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                                                <span className="text-2xl">{getFlag(lang)}</span>
                                                <span className="font-bold">{lang}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Поддержка */}
                        {supportModal && (
                            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 fade-in">
                                <div className="bg-white dark:bg-gray-800 rounded-3xl p-6 w-full max-w-sm space-y-4">
                                    <h3 className="text-xl font-bold">{t('support')}</h3>
                                    <textarea value={supportText} onChange={e => setSupportText(e.target.value)} rows="4" className="w-full p-3 bg-gray-50 dark:bg-gray-700 dark:text-white rounded-xl outline-none resize-none"></textarea>
                                    <div className="flex gap-2">
                                        <button onClick={() => setSupportModal(false)} className="flex-1 py-3 bg-gray-100 dark:bg-gray-700 font-bold rounded-xl">{t('cancel')}</button>
                                        <button onClick={() => { if(supportText.trim()) sendToBot({action: 'support', text: supportText}, t); }} className="flex-1 py-3 bg-teal-500 hover:bg-teal-600 text-white font-bold rounded-xl text-sm">{t('sendClose')}</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Панель Админа */}
                        {adminModal && isAdminUser && (
                            <div className="fixed inset-0 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 z-50 flex flex-col p-5 overflow-y-auto fade-in">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-extrabold text-teal-600 dark:text-teal-400">{t('adminPanel')} 🛡️</h2>
                                    <button onClick={() => setAdminModal(false)} className="text-red-500 hover:text-red-600 font-bold px-2 text-xl">✕</button>
                                </div>

                                {!selectedTicket && (
                                    <div className="space-y-3">
                                        {adminData.tickets.map(ticket => (
                                            <div key={ticket.id} onClick={() => setSelectedTicket(ticket)} className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border cursor-pointer border-teal-200 dark:border-teal-800 hover:shadow-md transition">
                                                <span className="font-bold text-sm text-teal-600 dark:text-teal-400">#{ticket.id} от {ticket.name}</span>
                                                <p className="text-sm mt-1">{ticket.text}</p>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                {selectedTicket && (
                                    <div className="bg-white dark:bg-gray-800 p-5 rounded-3xl shadow-md space-y-4">
                                        <button onClick={() => setSelectedTicket(null)} className="text-teal-600 dark:text-teal-400 text-sm font-bold hover:underline">← Назад</button>
                                        <div>
                                            <h3 className="text-lg font-bold">Тикет #{selectedTicket.id}</h3>
                                        </div>
                                        <div className="bg-gray-50 dark:bg-gray-700 dark:text-white p-3 rounded-xl text-sm border dark:border-gray-600">{selectedTicket.text}</div>
                                        <textarea value={ticketReplyText} onChange={e => setTicketReplyText(e.target.value)} placeholder="Ответ..." rows="3" className="w-full p-3 bg-gray-50 dark:bg-gray-700 dark:text-white rounded-xl text-sm border dark:border-gray-600"></textarea>
                                        <div className="flex gap-2">
                                            <button onClick={() => sendToBot({action: 'admin_mark_read', ticket_id: parseInt(selectedTicket.id)}, t)} className="flex-1 py-3 bg-gray-200 dark:bg-gray-700 font-bold rounded-xl text-sm hover:bg-gray-300 dark:hover:bg-gray-600 transition">{t('markRead')}</button>
                                            <button onClick={() => { if(ticketReplyText) sendToBot({action: 'admin_reply', ticket_id: parseInt(selectedTicket.id), user_id: selectedTicket.user_id, text: ticketReplyText}, t); }} className="flex-1 py-3 bg-teal-500 hover:bg-teal-600 text-white font-bold rounded-xl text-sm transition">{t('reply')}</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                        <Footer />
                    </div>
                );
            }

            if (step === 'faq') {
                return (
                    <div className="min-h-screen p-6 flex flex-col bg-gray-50 dark:bg-gray-900">
                        <button onClick={() => setStep('dashboard')} className="mb-6 text-teal-600 dark:text-teal-400 font-bold text-left hover:underline">{t('back')}</button>
                        <h2 className="text-2xl font-extrabold mb-6 text-gray-800 dark:text-white">❓ {t('faqBtn')}</h2>
                        <div className="bg-white dark:bg-gray-800 p-6 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 whitespace-pre-line leading-relaxed text-sm font-medium">
                            {t('faqText')}
                        </div>
                    </div>
                );
            }
            
            if (step === 'settings') {
                return (
                    <div className="min-h-screen p-6 flex flex-col bg-gray-50 dark:bg-gray-900">
                        <button onClick={() => setStep('dashboard')} className="mb-6 text-teal-600 dark:text-teal-400 font-bold text-left hover:underline">{t('back')}</button>
                        <h2 className="text-3xl font-extrabold mb-6">⚙️ {t('settings')}</h2>
                        <div className="bg-white dark:bg-gray-800 p-6 rounded-3xl shadow-sm space-y-5">
                            <div className="space-y-2">
                                <label className="block text-sm font-semibold">{t('yourName')}</label>
                                <input type="text" value={userData.name} onChange={e => setUserData({...userData, name: e.target.value})} className="w-full p-3 bg-gray-50 dark:bg-gray-700 dark:text-white rounded-xl outline-none" />
                            </div>
                            <div className="space-y-2">
                                <label className="block text-sm font-semibold">{t('uiLang')}</label>
                                <select value={userData.uiLanguage} onChange={(e) => setUserData({...userData, uiLanguage: e.target.value})} className="w-full p-3 bg-gray-50 dark:bg-gray-700 dark:text-white rounded-xl font-bold outline-none">
                                    <option value="ru">🇷🇺 Русский</option><option value="en">🇬🇧 English</option>
                                </select>
                            </div>
                            
                            <label className="flex items-center gap-3 cursor-pointer p-3 bg-gray-50 dark:bg-gray-700 rounded-xl border border-gray-100 dark:border-gray-600">
                                <input type="checkbox" checked={userData.botReminders} onChange={e => setUserData({...userData, botReminders: e.target.checked})} className="w-5 h-5 accent-teal-500" />
                                <span className="text-sm font-semibold leading-tight">{t('botReminders')}</span>
                            </label>

                            <button onClick={syncAllData} className="w-full py-3 mt-4 text-white font-bold bg-teal-500 hover:bg-teal-600 transition rounded-xl shadow-md">
                                {t('syncBot')}
                            </button>
                            
                            <div className="pt-4 border-t border-gray-100 dark:border-gray-700 mt-6">
                                <button onClick={() => { 
                                    if(confirm(t('resetConfirm'))) { 
                                        AppStorage.clear(() => {
                                            sendToBot({action: 'reset_data'}, t);
                                        }); 
                                    } 
                                }} className="w-full py-3 text-red-500 font-bold bg-red-50 dark:bg-red-900/20 rounded-xl hover:bg-red-100 transition">{t('resetData')}</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (step === 'lang_stats') {
                const currentTopics = topics.filter(t => t.language === activeLanguage);
                const allWords = currentTopics.flatMap(t => t.words.map(w => ({...w, topicId: t.id})));
                const totalAttempts = allWords.reduce((sum, w) => sum + (w.stats?.attempts || 0), 0);
                const totalCorrect = allWords.reduce((sum, w) => sum + (w.stats?.correct || 0), 0);
                const accuracy = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0;

                return (
                    <div className="min-h-screen p-6 flex flex-col bg-gray-50 dark:bg-gray-900">
                        <header className="flex justify-between items-center mb-6 pt-2">
                            <button onClick={() => setStep('dashboard')} className="text-teal-600 dark:text-teal-400 font-bold hover:underline">{t('back')}</button>
                            <h2 className="text-xl font-bold flex items-center gap-2">{getFlag(activeLanguage)} {t('statsBtn')}</h2>
                            <div className="w-10"></div>
                        </header>
                        <div className="bg-white dark:bg-gray-800 p-6 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 mb-6 flex justify-around text-center">
                            <div>
                                <p className="text-3xl font-extrabold text-teal-500">{accuracy}%</p>
                                <p className="text-xs text-gray-500 dark:text-gray-400">{t('accuracy')}</p>
                            </div>
                            <div>
                                <p className="text-3xl font-extrabold text-blue-500">{totalAttempts}</p>
                                <p className="text-xs text-gray-500 dark:text-gray-400">{t('attempts')}</p>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto space-y-3 mb-6">
                            {allWords.map((w, idx) => {
                                const acc = w.stats?.attempts ? Math.round((w.stats.correct / w.stats.attempts) * 100) : 0;
                                const createdDate = new Date(w.createdAt || Date.now()).toLocaleDateString();
                                return (
                                    <div key={idx} className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex justify-between items-center">
                                        <div>
                                            <p className="font-bold">{w.q} - <span className="text-teal-600 dark:text-teal-400">{w.a}</span></p>
                                            <p className="text-xs text-gray-400">{t('created')}: {createdDate} | {t('attempts')}: {w.stats?.attempts || 0}</p>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <span className={`font-bold text-sm ${acc >= 70 ? 'text-green-500' : acc > 0 ? 'text-orange-500' : 'text-gray-400'}`}>{w.stats?.attempts ? acc+'%' : '-'}</span>
                                            <button onClick={() => {
                                                setTopics(prev => prev.map(tp => tp.id !== w.topicId ? tp : { ...tp, words: tp.words.map(cw => cw.id !== w.id ? cw : { ...cw, stats: {attempts:0, correct:0, wrong:0} }) }))
                                            }} className="text-red-400 text-xs underline hover:text-red-500">{t('resetStats')}</button>
                                        </div>
                                    </div>
                                )
                            })}
                            {allWords.length === 0 && <p className="text-center text-gray-400 mt-10">{t('empty')}</p>}
                        </div>
                        
                        <button onClick={() => {
                            if(confirm(t('resetConfirm'))) {
                                setTopics(prev => prev.map(tp => tp.language !== activeLanguage ? tp : { ...tp, words: tp.words.map(cw => ({...cw, stats: {attempts:0, correct:0, wrong:0}})) }));
                            }
                        }} className="w-full py-4 text-red-500 font-bold bg-red-50 dark:bg-red-900/20 rounded-2xl hover:bg-red-100 transition">{t('resetAllStats')}</button>
                    </div>
                )
            }

            if (step === 'app' && !activeTopic) {
                const currentTopics = topics.filter(t => t.language === activeLanguage);
                return (
                    <div className="min-h-screen p-5 flex flex-col bg-gray-50 dark:bg-gray-900">
                        <header className="flex justify-between items-center mb-6 pt-2">
                            <button onClick={() => setStep('dashboard')} className="text-teal-600 dark:text-teal-400 font-bold hover:underline">{t('back')}</button>
                            <h1 className="text-xl font-bold flex items-center gap-2">{getFlag(activeLanguage)} {activeLanguage}</h1>
                            <div className="w-10"></div>
                        </header>
                        
                        <div className="flex-1 space-y-4">
                            {currentTopics.map(topic => (
                                <div key={topic.id} className="bg-white dark:bg-gray-800 p-5 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col gap-2 transition hover:shadow-md">
                                    <div className="flex justify-between items-center w-full">
                                        <div onClick={() => setActiveTopic(topic)} className="flex-1 cursor-pointer">
                                            <h3 className="font-bold text-lg">{topic.name}</h3>
                                            <p className="text-xs text-gray-400">{topic.words.length} {t('cards')}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => {setActiveTopic(topic); setStep('edit_topic');}} className="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-gray-200 transition">{t('editTopic')}</button>
                                            <button onClick={() => setActiveTopic(topic)} className="bg-teal-50 dark:bg-teal-900/40 text-teal-600 dark:text-teal-400 px-4 py-1.5 rounded-lg font-bold text-lg hover:bg-teal-100 transition">▶</button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                            {currentTopics.length === 0 && <p className="text-center text-gray-400 mt-10">{t('empty')}</p>}
                            <button onClick={() => {setActiveTopic(null); setStep('edit_topic');}} className="w-full mt-4 py-4 text-teal-600 dark:text-teal-400 font-bold border-2 border-dashed border-teal-300 dark:border-teal-700 rounded-3xl hover:bg-teal-50 dark:hover:bg-teal-900/20 transition">+ {t('newTopic')}</button>
                        </div>
                    </div>
                );
            }

            if (step === 'edit_topic') {
                return (
                    <CreateTopicMode t={t} language={activeLanguage} initialTopic={activeTopic} onSave={(updatedTopic) => { 
                        if (activeTopic) setTopics(topics.map(tp => tp.id === updatedTopic.id ? updatedTopic : tp));
                        else setTopics([...topics, { id: Date.now(), language: activeLanguage, ...updatedTopic }]); 
                        setStep('app'); setActiveTopic(null);
                    }} onCancel={() => {setStep('app'); setActiveTopic(null);}} />
                );
            }

            if (activeTopic) {
                const latestTopicObj = topics.find(tp => tp.id === activeTopic.id) || activeTopic;
                return <FlashcardMode t={t} topic={latestTopicObj} onRecordAnswer={(tId, wId, corr) => {
                    setTopics(prev => prev.map(tp => tp.id !== tId ? tp : { ...tp, words: tp.words.map(w => {
                        if(w.id !== wId) return w;
                        const st = w.stats || {attempts:0, correct:0, wrong:0};
                        return { ...w, stats: { attempts: st.attempts+1, correct: st.correct+(corr?1:0), wrong: st.wrong+(corr?0:1) } };
                    })}));
                }} onBack={() => setActiveTopic(null)} />;
            }
        }

        function CreateTopicMode({ t, language, initialTopic, onSave, onCancel }) {
            const [topicName, setTopicName] = useState(initialTopic ? initialTopic.name : '');
            const [words, setWords] = useState(initialTopic && initialTopic.words.length ? initialTopic.words : [{id: Date.now()+'_0', q: '', a: '', createdAt: Date.now()}]);
            return (
                <div className="min-h-screen p-5 flex flex-col bg-gray-50 dark:bg-gray-900">
                    <header className="flex justify-between items-center mb-6 bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                        <button onClick={onCancel} className="text-red-500 font-bold hover:underline">{t('cancel')}</button>
                        <h2 className="font-bold">{initialTopic ? t('editTopic') : t('newTopic')}</h2>
                        <button onClick={() => onSave({id: initialTopic?.id, name: topicName || 'Без названия', words: words.filter(w=>w.q&&w.a)})} className="text-teal-600 dark:text-teal-400 font-bold hover:underline">{t('done')}</button>
                    </header>
                    <input type="text" value={topicName} onChange={e=>setTopicName(e.target.value)} placeholder={t('topicName')} className="w-full p-4 text-lg font-bold bg-white dark:bg-gray-800 dark:text-white rounded-2xl mb-4 shadow-sm outline-none border border-gray-100 dark:border-gray-700 focus:border-teal-300 transition" />
                    <div className="space-y-3 mb-4">
                        {words.map((w, idx) => (
                            <div key={w.id} className="flex bg-white dark:bg-gray-800 p-3 rounded-2xl gap-2 shadow-sm border border-gray-100 dark:border-gray-700">
                                <div className="flex-1 space-y-2">
                                    <input value={w.q} onChange={e=>{const nw=[...words]; nw[idx].q=e.target.value; setWords(nw);}} className="w-full p-2 bg-gray-50 dark:bg-gray-700 dark:text-white rounded-lg outline-none focus:bg-white dark:focus:bg-gray-600 transition" placeholder={t('word')}/>
                                    <input value={w.a} onChange={e=>{const nw=[...words]; nw[idx].a=e.target.value; setWords(nw);}} className="w-full p-2 bg-teal-50 dark:bg-teal-900/30 text-teal-700 dark:text-teal-200 rounded-lg outline-none focus:bg-teal-100 dark:focus:bg-teal-800 transition" placeholder={t('translation')}/>
                                </div>
                                <button onClick={() => setWords(words.filter(x => x.id !== w.id))} className="text-red-300 hover:text-red-500 font-bold px-2 text-xl transition">✕</button>
                            </div>
                        ))}
                    </div>
                    <button onClick={() => setWords([...words, {id: Date.now()+'_'+words.length, q:'', a:'', createdAt: Date.now()}])} className="w-full py-4 text-teal-600 dark:text-teal-400 font-bold border-2 border-dashed border-teal-300 dark:border-teal-700 rounded-2xl bg-teal-50/50 dark:bg-teal-900/20 hover:bg-teal-100 dark:hover:bg-teal-900/40 transition">{t('addCard')}</button>
                </div>
            );
        }

        function FlashcardMode({ t, topic, onRecordAnswer, onBack }) {
            const [idx, setIdx] = useState(0); const [flipped, setFlipped] = useState(false);
            const words = topic.words.sort(() => Math.random() - 0.5);
            if (!words[idx]) { onBack(); return null; }
            return (
                <div className="min-h-screen p-6 flex flex-col items-center justify-center bg-gray-50 dark:bg-gray-900">
                    <button onClick={onBack} className="absolute top-6 left-6 text-gray-500 font-bold bg-white dark:bg-gray-800 px-4 py-2 rounded-full shadow hover:bg-gray-100 transition">{t('exit')}</button>
                    <h2 className="text-xl font-bold mb-8 mt-10 text-center">{topic.name} <br/><span className="text-teal-500 text-sm">({idx + 1}/{words.length})</span></h2>
                    <div onClick={() => setFlipped(!flipped)} className="w-full max-w-sm aspect-[4/5] bg-white dark:bg-gray-800 rounded-[2.5rem] shadow-xl flex items-center justify-center p-8 border border-gray-100 dark:border-gray-700 cursor-pointer text-center relative hover:scale-[1.02] transition-transform" style={{ perspective: '1500px' }}>
                        <div className="w-full h-full flex flex-col justify-center items-center transition-transform duration-500" style={{ transform: flipped ? 'rotateY(180deg)' : 'rotateY(0)', transformStyle: 'preserve-3d' }}>
                            <p className="absolute top-8 text-teal-400 text-xs font-bold uppercase tracking-widest" style={{ transform: flipped ? 'rotateY(180deg)' : 'rotateY(0)' }}>{flipped ? t('translation') : t('word')}</p>
                            <h3 className="text-4xl font-extrabold break-words w-full" style={{ transform: flipped ? 'rotateY(180deg)' : 'rotateY(0)' }}>{flipped ? words[idx].a : words[idx].q}</h3>
                        </div>
                    </div>
                    <div className="flex gap-4 mt-12 w-full max-w-sm">
                        <button onClick={() => { onRecordAnswer(topic.id, words[idx].id, false); setFlipped(false); setTimeout(() => {if(idx+1>=words.length){alert(t('completed')); onBack();}else setIdx(i=>i+1);}, 150); }} className="flex-1 py-4 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-2xl font-bold shadow-sm hover:bg-red-200 transition">{t('dontRemember')}</button>
                        <button onClick={() => { onRecordAnswer(topic.id, words[idx].id, true); setFlipped(false); setTimeout(() => {if(idx+1>=words.length){alert(t('completed')); onBack();}else setIdx(i=>i+1);}, 150); }} className="flex-1 py-4 bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded-2xl font-bold shadow-sm hover:bg-green-200 transition">{t('remember')}</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
