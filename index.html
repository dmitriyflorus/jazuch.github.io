<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ЯзУч - Приложение</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { mint: '#98FF98' } } }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const tg = window.Telegram.WebApp;

        // Надежное хранилище
        const AppStorage = {
            save: (key, value) => {
                const strVal = typeof value === 'string' ? value : JSON.stringify(value);
                try {
                    if (tg.isVersionAtLeast('6.9') && tg.CloudStorage) tg.CloudStorage.setItem(key, strVal);
                    localStorage.setItem(key, strVal); 
                } catch (e) { console.error("Save error", e); }
            },
            loadAll: (callback) => {
                const keys = ['jazuch_userData', 'jazuch_myLanguages', 'jazuch_topics', 'jazuch_theme', 'jazuch_isRegistered', 'jazuch_goals'];
                const localFallback = () => {
                    const values = {};
                    keys.forEach(k => { values[k] = localStorage.getItem(k); });
                    callback(values);
                };

                try {
                    if (tg.isVersionAtLeast('6.9') && tg.CloudStorage) {
                        tg.CloudStorage.getItems(keys, (error, values) => {
                            if (error || !values) localFallback();
                            else {
                                keys.forEach(k => {
                                    if (!values[k] && localStorage.getItem(k)) {
                                        values[k] = localStorage.getItem(k);
                                        tg.CloudStorage.setItem(k, values[k]);
                                    }
                                });
                                callback(values);
                            }
                        });
                    } else localFallback();
                } catch(e) { localFallback(); }
            },
            clear: (callback) => {
                try {
                    localStorage.clear();
                    if (tg.isVersionAtLeast('6.9') && tg.CloudStorage) {
                        tg.CloudStorage.removeItems(['jazuch_userData', 'jazuch_myLanguages', 'jazuch_topics', 'jazuch_theme', 'jazuch_isRegistered', 'jazuch_goals'], callback);
                    } else callback();
                } catch(e) { callback(); }
            }
        };

        const translations = {
            ru: {
                welcome: "Добро пожаловать", yourName: "Ваше имя", whichLang: "Какой язык будем изучать?", login: "Войти в систему", welcomeBack: "С возвращением", goalCalendar: "Календарь целей", clickDay: "Нажми на день", myLangs: "Мои языки", noLangs: "У вас пока нет добавленных языков.", addLang: "Добавить язык", settings: "Настройки", toDashboard: "На рабочий стол", profileName: "Имя профиля", addNewLang: "Добавить новый язык", uiLang: "Язык интерфейса", resetData: "Сбросить данные приложения", resetConfirm: "Удалить все данные?", dashboard: "Рабочий стол", empty: "Здесь пока пусто.", createTopic: "Создать тему", newTopic: "Новая тема", topics: "тем", cards: "карточек", cancel: "Отмена", done: "Готово", topicName: "Название темы", example: "Например: Семья, Глаголы...", wordsInTopic: "Слова в теме", word: "Слово", translation: "Перевод", addCard: "+ Добавить карточку", exit: "← Выйти", dontRemember: "Не помню ❌", remember: "Помню ✅", completed: "Тема пройдена! Отличная работа.", selectLang: "Выберите язык...", confirmDeleteLang: "Вы уверены, что хотите удалить язык", alertNoLang: "Пожалуйста, выберите язык", alertNoTopic: "Введите название темы!", alertNoWords: "Добавьте хотя бы одну пару слов!", back: "← Рабочий стол", support: "Написать в поддержку", supportDesc: "Опишите вашу проблему, идею или предложение.", send: "Отправить", goalSet: "Поставить цель", goalText: "Ваша цель на день", goalTime: "Время напоминания", saveGoal: "Сохранить цель", syncBot: "Синхронизировать с ботом", adminPanel: "Панель Администратора", adminTickets: "Новые обращения", adminBroadcast: "Рассылка", reply: "Ответить", broadcastAll: "Всем пользователям", selectUser: "Выберите пользователя", faqBtn: "ЧаВо", faqTitle: "Как учить эффективно? 🧠", faq1Q: "Как работают карточки?", faq1A: "Это метод интервального повторения. Бот показывает слово, вы пытаетесь вспомнить перевод, а затем оцениваете себя (Помню/Не помню).", faq2Q: "Как правильно создавать темы?", faq2A: "Разбивайте слова на небольшие группы (по 10-20 слов). Например: «Еда», «Одежда», «В ресторане». Так мозг запоминает быстрее.", faq3Q: "Зачем нужны цели в календаре?", faq3A: "Регулярность — ключ к успеху! Ставьте цель выучить 15 слов каждый день, и бот напомнит вам об этом в нужное время."
            },
            // Заглушки для других языков (чтобы интерфейс не ломался, если выбран другой)
            en: { welcome: "Welcome", faqBtn: "FAQ", faqTitle: "How to learn effectively?", toDashboard: "To Dashboard", cancel: "Cancel" /* ... сокращено для примера */ }
        };

        const LANG_FLAGS = {
            "Кряшенский": "", "Татарский": "", "Латынь": "🏛️", 
            "Английский": "🇬🇧", "Испанский": "🇪🇸", "Французский": "🇫🇷", "Немецкий": "🇩🇪", 
            "Итальянский": "🇮🇹", "Португальский": "🇵🇹", "Нидерландский": "🇳🇱", "Греческий": "🇬🇷",
            "Польский": "🇵🇱", "Чешский": "🇨🇿", "Словацкий": "🇸🇰", "Румынский": "🇷🇴", 
            "Венгерский": "🇭🇺", "Болгарский": "🇧🇬", "Сербский": "🇷🇸", "Хорватский": "🇭🇷",
            "Шведский": "🇸🇪", "Норвежский": "🇳🇴", "Датский": "🇩🇰", "Финский": "🇫🇮",
            "Украинский": "🇺🇦", "Белорусский": "🇧🇾", "Русский": "🇷🇺",
            // Азиатские и другие языки
            "Китайский": "🇨🇳", "Японский": "🇯🇵", "Корейский": "🇰🇷", "Хинди": "🇮🇳",
            "Арабский": "🇸🇦", "Бенгальский": "🇧🇩", "Урду": "🇵🇰", "Индонезийский": "🇮🇩",
            "Вьетнамский": "🇻🇳", "Тайский": "🇹🇭", "Филиппинский": "🇵🇭", "Малайский": "🇲🇾",
            "Персидский": "🇮🇷", "Турецкий": "🇹🇷", "Иврит": "🇮🇱"
        };
        
        const ALL_LANGUAGES = Object.keys(LANG_FLAGS);
        const greetings = ["Здравствуйте!", "Hello!", "Исәнмесез!", "Hola!", "Bonjour!", "Salve!", "Ciao!", "Χαίρετε!", "你好!", "こんにちは!"];

        function App() {
            const [step, setStep] = useState('intro'); // intro, register, dashboard, app, settings, create_topic, faq
            const [isLoading, setIsLoading] = useState(true);
            const stateLoaded = useRef(false); // Защита от перезаписи при старте
            
            const [isRegistered, setIsRegistered] = useState(false);
            const [theme, setTheme] = useState('light');
            const [userData, setUserData] = useState({ name: '', goal: 'Свободное общение', uiLanguage: 'ru' });
            const [myLanguages, setMyLanguages] = useState([]);
            const [topics, setTopics] = useState([]);
            const [goals, setGoals] = useState({});
            
            const [activeLanguage, setActiveLanguage] = useState('');
            const [activeTopic, setActiveTopic] = useState(null);
            const [randomGreeting, setRandomGreeting] = useState('');
            
            // Состояния модальных окон
            const [selectedDate, setSelectedDate] = useState(null);
            const [goalText, setGoalText] = useState('');
            const [goalTime, setGoalTime] = useState('14:00');
            const [supportModal, setSupportModal] = useState(false);
            const [supportText, setSupportText] = useState('');
            
            // Админ панель
            const [isAdminUser, setIsAdminUser] = useState(false);
            const [adminData, setAdminData] = useState({ tickets: [], users: {} });
            const [adminModal, setAdminModal] = useState(false);
            const [broadcastText, setBroadcastText] = useState('');
            const [broadcastTarget, setBroadcastTarget] = useState('all');

            const t = (key) => {
                const lang = userData?.uiLanguage || 'ru';
                return translations[lang]?.[key] || translations['ru'][key] || key;
            };

            // Явное сохранение данных только ПОСЛЕ того, как они были загружены
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_userData', userData); }, [userData]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_myLanguages', myLanguages); }, [myLanguages]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_topics', topics); }, [topics]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_theme', theme); }, [theme]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_isRegistered', isRegistered); }, [isRegistered]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_goals', goals); }, [goals]);

            useEffect(() => {
                tg.expand();
                setRandomGreeting(greetings[Math.floor(Math.random() * greetings.length)]);

                const urlParams = new URLSearchParams(window.location.search);
                const dataParam = urlParams.get('data');
                let botGoals = null;

                if (dataParam) {
                    try {
                        const parsed = JSON.parse(decodeURIComponent(dataParam));
                        if (parsed.goals) botGoals = parsed.goals;
                        if (parsed.tickets) setAdminData(prev => ({ ...prev, tickets: parsed.tickets }));
                        if (parsed.all_users) setAdminData(prev => ({ ...prev, users: parsed.all_users }));
                        if (parsed.is_admin) setIsAdminUser(true); // Админка активируется через бота
                    } catch(e) { console.error("URL Parse error", e); }
                }

                AppStorage.loadAll((values) => {
                    const isReg = values.jazuch_isRegistered === 'true';
                    setIsRegistered(isReg);
                    
                    if (values.jazuch_theme) setTheme(values.jazuch_theme);
                    if (botGoals) setGoals(botGoals);
                    else if (values.jazuch_goals) setGoals(JSON.parse(values.jazuch_goals));
                    
                    if (values.jazuch_myLanguages) setMyLanguages(JSON.parse(values.jazuch_myLanguages));
                    if (values.jazuch_topics) setTopics(JSON.parse(values.jazuch_topics));
                    
                    if (values.jazuch_userData) {
                        const savedUser = JSON.parse(values.jazuch_userData);
                        setUserData({ ...savedUser, uiLanguage: savedUser.uiLanguage || 'ru' });
                    } else {
                        const tgName = tg.initDataUnsafe?.user?.first_name || '';
                        setUserData({ name: tgName, goal: 'Свободное общение', uiLanguage: 'ru' });
                    }
                    
                    // Разрешаем сохранение данных только после применения загруженных
                    setTimeout(() => {
                        stateLoaded.current = true;
                        setIsLoading(false);
                        if (isReg) setStep('dashboard');
                        else setStep('register');
                    }, 300);
                });
            }, []);

            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            const handleSaveGoal = () => {
                setGoals({ ...goals, [selectedDate]: { text: goalText, time: goalTime, notified: false } });
                setSelectedDate(null);
            };

            const Footer = () => (
                <div className="mt-8 text-center pb-6 opacity-70">
                    <p className="font-bold text-xs">«Телляргя сӧйӧӱ белян»</p>
                    <p className="text-xs italic">«С любовью к языкам»</p>
                </div>
            );

            if (step === 'intro') {
                return (
                    <div className="h-screen w-screen bg-mint flex flex-col items-center justify-center overflow-hidden">
                        <div className="text-center space-y-6 fade-in">
                            <h1 className="text-5xl font-extrabold text-teal-900 drop-shadow-xl tracking-wide">ЯзУч</h1>
                            <p className="text-3xl font-bold text-teal-800 opacity-90 animate-pulse shadow-sm">{randomGreeting}</p>
                        </div>
                    </div>
                );
            }

            if (step === 'register') {
                return (
                    <div className="min-h-screen p-6 flex flex-col items-center justify-center fade-in bg-gradient-to-br from-teal-50 to-mint dark:from-gray-900 dark:to-teal-900">
                        <div className="w-full max-w-md bg-white/80 dark:bg-gray-800/80 backdrop-blur-lg rounded-3xl shadow-2xl p-8 space-y-6 border border-white/20 dark:border-gray-700">
                            <h2 className="text-2xl font-bold text-center text-teal-600">{t('welcome')}</h2>
                            <div className="space-y-2">
                                <label className="block text-sm font-semibold">{t('yourName')}</label>
                                <input type="text" value={userData.name} onChange={(e) => setUserData({...userData, name: e.target.value})} className="w-full p-3 bg-white dark:bg-gray-700 rounded-xl outline-none" />
                            </div>
                            <div className="space-y-2">
                                <label className="block text-sm font-semibold">{t('whichLang')}</label>
                                <select value={activeLanguage} onChange={(e) => setActiveLanguage(e.target.value)} className="w-full p-3 bg-white dark:bg-gray-700 rounded-xl outline-none">
                                    <option value="">{t('selectLang')}</option>
                                    {ALL_LANGUAGES.map(l => <option key={l} value={l}>{LANG_FLAGS[l]} {l}</option>)}
                                </select>
                            </div>
                            <button onClick={() => {
                                if(activeLanguage) {
                                    setMyLanguages([activeLanguage]);
                                    setIsRegistered(true);
                                    setStep('dashboard');
                                } else alert(t('alertNoLang'));
                            }} className="w-full py-4 bg-teal-500 text-white rounded-xl font-bold">{t('login')}</button>
                        </div>
                    </div>
                );
            }

            if (step === 'faq') {
                return (
                    <div className="min-h-screen p-6 fade-in flex flex-col bg-gray-50 dark:bg-gray-900">
                        <button onClick={() => setStep('dashboard')} className="mb-6 text-teal-600 font-bold">← {t('toDashboard')}</button>
                        <h2 className="text-3xl font-extrabold mb-6">{t('faqTitle')}</h2>
                        <div className="space-y-4">
                            <div className="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm">
                                <h3 className="font-bold text-lg text-teal-600 mb-2">1. {t('faq1Q')}</h3>
                                <p className="text-sm text-gray-600 dark:text-gray-300">{t('faq1A')}</p>
                            </div>
                            <div className="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm">
                                <h3 className="font-bold text-lg text-teal-600 mb-2">2. {t('faq2Q')}</h3>
                                <p className="text-sm text-gray-600 dark:text-gray-300">{t('faq2A')}</p>
                            </div>
                            <div className="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm">
                                <h3 className="font-bold text-lg text-teal-600 mb-2">3. {t('faq3Q')}</h3>
                                <p className="text-sm text-gray-600 dark:text-gray-300">{t('faq3A')}</p>
                            </div>
                        </div>
                        <Footer />
                    </div>
                );
            }

            if (step === 'dashboard') {
                const today = new Date();
                const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
                const daysArray = Array.from({length: daysInMonth}, (_, i) => i + 1);

                return (
                    <div className="min-h-screen p-5 pb-20 fade-in bg-gray-50 dark:bg-gray-900 flex flex-col">
                        <header className="flex justify-between items-center mb-6 pt-2">
                            <div>
                                <h1 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-500 to-green-500">ЯзУч</h1>
                                <p className="text-gray-500 font-medium text-sm">{t('welcomeBack')}, {userData.name}!</p>
                            </div>
                            <div className="flex gap-2 items-center">
                                <button onClick={() => setStep('faq')} className="p-3 bg-white dark:bg-gray-800 rounded-full shadow-md text-xl">❓</button>
                                {isAdminUser ? (
                                    <button onClick={() => setAdminModal(true)} className="relative p-3 bg-white dark:bg-gray-800 rounded-full shadow-md text-xl">
                                        🔔
                                        {adminData.tickets.length > 0 && <span className="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white">{adminData.tickets.length}</span>}
                                    </button>
                                ) : (
                                    <button onClick={() => setSupportModal(true)} className="p-3 bg-white dark:bg-gray-800 rounded-full shadow-md text-xl">🎧</button>
                                )}
                                <button onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')} className="p-3 bg-white dark:bg-gray-800 rounded-full shadow-md text-xl">{theme === 'light' ? '🌙' : '☀️'}</button>
                                <button onClick={() => setStep('settings')} className="p-3 bg-white dark:bg-gray-800 rounded-full shadow-md text-xl">⚙️</button>
                            </div>
                        </header>

                        {/* Календарь */}
                        <div className="bg-white dark:bg-gray-800 p-5 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 mb-6">
                            <h2 className="font-bold text-lg mb-3 flex items-center gap-2">📅 {t('goalCalendar')} <span className="text-xs font-normal text-gray-400">({t('clickDay')})</span></h2>
                            <div className="grid grid-cols-7 gap-1">
                                {daysArray.map(day => {
                                    const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                    const isToday = day === today.getDate();
                                    return (
                                        <div key={day} onClick={() => { setSelectedDate(dateStr); setGoalText(goals[dateStr]?.text || ''); setGoalTime(goals[dateStr]?.time || '14:00'); }} 
                                             className={`relative aspect-square flex items-center justify-center rounded-lg text-sm font-semibold cursor-pointer ${isToday ? 'bg-teal-500 text-white shadow-md' : 'bg-gray-50 dark:bg-gray-700'}`}>
                                            {day}
                                            {goals[dateStr] && <div className="absolute bottom-1 w-1.5 h-1.5 bg-yellow-400 rounded-full"></div>}
                                        </div>
                                    )
                                })}
                            </div>
                            <button onClick={() => tg.sendData(JSON.stringify({action: 'sync_goals', goals: goals}))} className="w-full mt-4 py-2 bg-teal-50 dark:bg-teal-900/20 text-teal-600 font-bold rounded-xl text-sm">🔄 {t('syncBot')}</button>
                        </div>

                        {/* Мои языки */}
                        <div className="flex-1">
                            <h2 className="text-xl font-bold mb-4">{t('myLangs')}</h2>
                            <div className="grid grid-cols-2 gap-4">
                                {myLanguages.length === 0 && <p className="col-span-2 text-gray-500 text-sm">{t('noLangs')}</p>}
                                {myLanguages.map(lang => (
                                    <div key={lang} onClick={() => { setActiveLanguage(lang); setStep('app'); }} className="bg-white dark:bg-gray-800 p-5 rounded-3xl shadow-sm cursor-pointer border border-gray-100 dark:border-gray-700 relative">
                                        <button onClick={(e) => { e.stopPropagation(); if(confirm(`${t('confirmDeleteLang')} ${lang}?`)) setMyLanguages(myLanguages.filter(l => l !== lang)); }} className="absolute top-3 right-3 text-gray-300 hover:text-red-500 text-xl">🗑️</button>
                                        <div className="text-3xl mb-2">{LANG_FLAGS[lang] || '🌍'}</div>
                                        <h3 className="font-bold text-lg">{lang}</h3>
                                        <p className="text-xs text-gray-500">{topics.filter(t => t.language === lang).length} {t('topics')}</p>
                                    </div>
                                ))}
                                <div onClick={() => setStep('settings')} className="bg-teal-50/50 dark:bg-gray-800 p-5 rounded-3xl flex flex-col items-center justify-center border-2 border-dashed border-teal-300 cursor-pointer">
                                    <span className="text-2xl mb-1 text-teal-400">+</span>
                                    <span className="text-teal-600 font-bold text-xs text-center">{t('addLang')}</span>
                                </div>
                            </div>
                        </div>
                        <Footer />
                        
                        {/* Модальное окно Цели */}
                        {selectedDate && (
                            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 fade-in">
                                <div className="bg-white dark:bg-gray-800 rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
                                    <h3 className="text-xl font-bold">{t('goalSet')} <span className="text-teal-500 text-sm">({selectedDate})</span></h3>
                                    <input type="text" value={goalText} onChange={(e) => setGoalText(e.target.value)} placeholder="Цель..." className="w-full p-3 bg-gray-50 dark:bg-gray-700 rounded-xl outline-none" />
                                    <input type="time" value={goalTime} onChange={(e) => setGoalTime(e.target.value)} className="w-full p-3 bg-gray-50 dark:bg-gray-700 rounded-xl outline-none" />
                                    <div className="flex gap-2">
                                        <button onClick={() => setSelectedDate(null)} className="flex-1 py-3 bg-gray-100 dark:bg-gray-700 font-bold rounded-xl">{t('cancel')}</button>
                                        <button onClick={handleSaveGoal} className="flex-1 py-3 bg-teal-500 text-white font-bold rounded-xl">{t('saveGoal')}</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Модальное окно Поддержки */}
                        {supportModal && (
                            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 fade-in">
                                <div className="bg-white dark:bg-gray-800 rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
                                    <h3 className="text-xl font-bold">{t('support')}</h3>
                                    <textarea value={supportText} onChange={e => setSupportText(e.target.value)} placeholder="..." rows="4" className="w-full p-3 bg-gray-50 dark:bg-gray-700 rounded-xl outline-none resize-none"></textarea>
                                    <div className="flex gap-2">
                                        <button onClick={() => setSupportModal(false)} className="flex-1 py-3 bg-gray-100 dark:bg-gray-700 font-bold rounded-xl">{t('cancel')}</button>
                                        <button onClick={() => { if(supportText.trim()){ tg.sendData(JSON.stringify({action: 'support', text: supportText})); setSupportModal(false); } }} className="flex-1 py-3 bg-teal-500 text-white font-bold rounded-xl">{t('send')}</button>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {/* Админ Панель */}
                        {adminModal && (
                            <div className="fixed inset-0 bg-gray-50 dark:bg-gray-900 z-50 flex flex-col p-5 overflow-y-auto fade-in">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-bold text-teal-600">{t('adminPanel')} 🛡️</h2>
                                    <button onClick={() => setAdminModal(false)} className="text-red-500 font-bold text-xl">✕</button>
                                </div>
                                <div className="space-y-6">
                                    <div>
                                        <h3 className="font-bold text-lg mb-3">{t('adminTickets')}</h3>
                                        {adminData.tickets.length === 0 ? <p className="text-gray-500 text-sm">Пусто.</p> : (
                                            <div className="space-y-3">
                                                {adminData.tickets.map(ticket => (
                                                    <div key={ticket.id} className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-200">
                                                        <p className="font-bold text-sm text-teal-600">#{ticket.id} — {ticket.name} {ticket.username && <a href={`https://t.me/${ticket.username}`} className="text-blue-500 underline ml-1">@{ticket.username}</a>}</p>
                                                        <p className="text-sm mt-2 mb-3">{ticket.text}</p>
                                                        <div className="flex gap-2">
                                                            <input type="text" id={`reply-${ticket.id}`} placeholder="Текст..." className="flex-1 p-2 text-sm bg-gray-50 dark:bg-gray-700 rounded-lg outline-none"/>
                                                            <button onClick={() => { const text = document.getElementById(`reply-${ticket.id}`).value; if(text) tg.sendData(JSON.stringify({action: 'admin_reply', ticket_id: ticket.id, user_id: ticket.user_id, text: text})); }} className="bg-teal-500 text-white px-3 py-2 rounded-lg text-sm">{t('reply')}</button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    <div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-teal-100">
                                        <h3 className="font-bold text-lg mb-3">{t('adminBroadcast')}</h3>
                                        <select value={broadcastTarget} onChange={e => setBroadcastTarget(e.target.value)} className="w-full p-3 mb-2 bg-gray-50 dark:bg-gray-700 rounded-xl outline-none">
                                            <option value="all">{t('broadcastAll')}</option>
                                            {Object.entries(adminData.users).map(([uid, info]) => ( <option key={uid} value={uid}>{info.first_name} (@{info.username || 'No'})</option> ))}
                                        </select>
                                        <textarea value={broadcastText} onChange={e => setBroadcastText(e.target.value)} placeholder="..." rows="3" className="w-full p-3 mb-2 bg-gray-50 dark:bg-gray-700 rounded-xl outline-none"></textarea>
                                        <button onClick={() => { if(broadcastText) tg.sendData(JSON.stringify({action: 'admin_broadcast', user_id: broadcastTarget, text: broadcastText})); }} className="w-full bg-teal-500 text-white py-3 rounded-xl font-bold">{t('send')}</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // --- ЭКРАНЫ НАСТРОЕК, ТЕМ И КАРТОЧЕК ---
            // (Они остаются такими же функциональными, как раньше, только используют переводы t() )

            if (step === 'settings') {
                return (
                    <div className="min-h-screen p-6 fade-in flex flex-col bg-gray-50 dark:bg-gray-900">
                        <button onClick={() => setStep('dashboard')} className="mb-6 text-teal-600 font-bold">← {t('toDashboard')}</button>
                        <h2 className="text-3xl font-extrabold mb-8 text-gray-800 dark:text-white">⚙️ {t('settings')}</h2>
                        <div className="bg-white dark:bg-gray-800 p-6 rounded-3xl shadow-lg border border-gray-100 flex-1 space-y-6">
                            <div>
                                <label className="block text-sm font-semibold">{t('profileName')}</label>
                                <input type="text" value={userData.name} onChange={(e) => setUserData({...userData, name: e.target.value})} className="w-full p-3 bg-gray-100 dark:bg-gray-700 rounded-xl" />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold">{t('uiLang')}</label>
                                <select value={userData.uiLanguage || 'ru'} onChange={(e) => setUserData({...userData, uiLanguage: e.target.value})} className="w-full p-3 bg-gray-100 dark:bg-gray-700 rounded-xl">
                                    <option value="ru">Русский</option><option value="en">English</option><option value="tt">Татарча</option><option value="es">Español</option><option value="fr">Français</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-semibold">{t('addNewLang')}</label>
                                <select value={''} onChange={(e) => { const newLang = e.target.value; if (newLang && !myLanguages.includes(newLang)) setMyLanguages([...myLanguages, newLang]); setActiveLanguage(newLang); setStep('app'); }} className="w-full p-3 bg-teal-50 rounded-xl border-2 border-teal-200">
                                    <option value="">{t('selectLang')}</option>
                                    {ALL_LANGUAGES.map(l => <option key={l} value={l} disabled={myLanguages.includes(l)}>{LANG_FLAGS[l]} {l}</option>)}
                                </select>
                            </div>
                            <button onClick={() => { if(confirm(t('resetConfirm'))) AppStorage.clear(() => window.location.reload()); }} className="w-full py-3 bg-red-50 text-red-500 rounded-xl font-bold">{t('resetData')}</button>
                        </div>
                    </div>
                );
            }

            if (step === 'create_topic') {
                return <CreateTopicMode t={t} language={activeLanguage} onSave={(newTopic) => { setTopics([...topics, { ...newTopic, id: Date.now(), language: activeLanguage }]); setStep('app'); }} onCancel={() => setStep('app')} Footer={Footer}/>
            }

            if (step === 'app' && !activeTopic) {
                const currentTopics = topics.filter(t => t.language === activeLanguage);
                return (
                    <div className="min-h-screen p-5 pb-20 fade-in flex flex-col bg-gray-50 dark:bg-gray-900">
                        <header className="flex justify-between items-center mb-6 pt-2">
                            <button onClick={() => setStep('dashboard')} className="text-teal-600 font-bold">{t('back')}</button>
                            <h1 className="text-xl font-bold">{LANG_FLAGS[activeLanguage]} {activeLanguage}</h1>
                        </header>
                        <div className="flex-1">
                            {currentTopics.length === 0 ? (
                                <div className="text-center p-8 bg-white dark:bg-gray-800 rounded-3xl border border-teal-100 mt-4">
                                    <p className="text-gray-500 mb-6">{t('empty')}</p>
                                    <button onClick={() => setStep('create_topic')} className="px-6 py-3 bg-teal-500 text-white font-bold rounded-xl">{t('createTopic')}</button>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 gap-4 mt-4">
                                    {currentTopics.map(topic => (
                                        <div key={topic.id} onClick={() => setActiveTopic(topic)} className="bg-white dark:bg-gray-800 p-5 rounded-2xl cursor-pointer border border-gray-100 flex justify-between items-center">
                                            <div><h3 className="font-bold text-lg mb-1">{topic.name}</h3><p className="text-sm text-gray-400">{topic.words.length} {t('cards')}</p></div>
                                            <div className="text-teal-500 text-xl">▶</div>
                                        </div>
                                    ))}
                                    <button onClick={() => setStep('create_topic')} className="w-full py-4 bg-teal-50 text-teal-600 rounded-2xl font-bold border-2 border-dashed border-teal-300">+ {t('newTopic')}</button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            if (activeTopic) return <FlashcardMode t={t} topic={activeTopic} onBack={() => setActiveTopic(null)} Footer={Footer}/>
        }

        // --- Вспомогательные компоненты ---
        function CreateTopicMode({ t, language, onSave, onCancel, Footer }) {
            const [topicName, setTopicName] = useState('');
            const [words, setWords] = useState([{q: '', a: ''}]);
            const handleSave = () => {
                if (!topicName.trim()) return alert(t('alertNoTopic'));
                const validWords = words.filter(w => w.q.trim() && w.a.trim());
                if (validWords.length === 0) return alert(t('alertNoWords'));
                onSave({ name: topicName, words: validWords });
            };
            return (
                <div className="min-h-screen p-5 flex flex-col bg-gray-50 dark:bg-gray-900">
                    <header className="flex justify-between items-center mb-6 bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm">
                        <button onClick={onCancel} className="text-red-500 font-bold">{t('cancel')}</button>
                        <h2 className="font-bold">{t('newTopic')}</h2>
                        <button onClick={handleSave} className="text-teal-600 font-bold">{t('done')}</button>
                    </header>
                    <div className="space-y-5 flex-1">
                        <input type="text" placeholder={t('example')} value={topicName} onChange={(e) => setTopicName(e.target.value)} className="w-full p-4 text-lg font-bold bg-white dark:bg-gray-800 rounded-xl outline-none" />
                        <div className="space-y-3">
                            {words.map((word, idx) => (
                                <div key={idx} className="flex gap-2 bg-white dark:bg-gray-800 p-3 rounded-xl relative">
                                    <div className="flex-1 space-y-2">
                                        <input type="text" placeholder={t('word')} value={word.q} onChange={e => {const w = [...words]; w[idx].q = e.target.value; setWords(w);}} className="w-full p-2 bg-gray-50 dark:bg-gray-700 rounded-lg outline-none" />
                                        <input type="text" placeholder={t('translation')} value={word.a} onChange={e => {const w = [...words]; w[idx].a = e.target.value; setWords(w);}} className="w-full p-2 bg-teal-50 dark:bg-teal-900/20 rounded-lg outline-none text-teal-800" />
                                    </div>
                                    {words.length > 1 && <button onClick={() => setWords(words.filter((_, i) => i !== idx))} className="text-gray-300 hover:text-red-500">✕</button>}
                                </div>
                            ))}
                        </div>
                        <button onClick={() => setWords([...words, {q: '', a: ''}])} className="w-full py-4 bg-white dark:bg-gray-800 text-teal-600 rounded-2xl font-bold">+ {t('addCard')}</button>
                    </div>
                </div>
            );
        }

        function FlashcardMode({ t, topic, onBack, Footer }) {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [words, setWords] = useState(() => [...topic.words].sort(() => Math.random() - 0.5));
            const handleNext = () => {
                setIsFlipped(false);
                setTimeout(() => {
                    if (currentIndex + 1 >= words.length) { alert(t('completed')); onBack(); } 
                    else setCurrentIndex(prev => prev + 1);
                }, 150);
            };
            return (
                <div className="min-h-screen p-6 flex flex-col items-center justify-center bg-gray-50 dark:bg-gray-900">
                    <button onClick={onBack} className="absolute top-6 left-6 text-gray-500 font-bold bg-white/80 px-4 py-2 rounded-full shadow-sm">{t('exit')}</button>
                    <h2 className="text-xl font-bold mb-8 text-gray-700 mt-10">{topic.name} <span className="text-teal-500">({currentIndex + 1}/{words.length})</span></h2>
                    <div onClick={() => setIsFlipped(!isFlipped)} className="w-full max-w-sm aspect-[4/5] bg-white dark:bg-gray-800 rounded-[2.5rem] shadow-xl flex items-center justify-center p-8 relative" style={{ perspective: '1500px' }}>
                        <div className="text-center transition-all duration-500 w-full h-full flex flex-col items-center justify-center" style={{ transform: isFlipped ? 'rotateY(180deg)' : 'rotateY(0)', transformStyle: 'preserve-3d' }}>
                            <p className="text-teal-400 text-xs mb-4 font-bold uppercase absolute top-8" style={{ transform: isFlipped ? 'rotateY(180deg)' : 'rotateY(0)' }}>{isFlipped ? t('translation') : t('word')}</p>
                            <h3 className="text-4xl font-extrabold text-gray-800 dark:text-white" style={{ transform: isFlipped ? 'rotateY(180deg)' : 'rotateY(0)' }}>{isFlipped ? words[currentIndex].a : words[currentIndex].q}</h3>
                        </div>
                    </div>
                    <div className="flex gap-4 mt-8 w-full max-w-sm">
                        <button onClick={handleNext} className="flex-1 py-4 bg-red-50 text-red-500 rounded-2xl font-bold shadow-sm">{t('dontRemember')}</button>
                        <button onClick={handleNext} className="flex-1 py-4 bg-green-50 text-green-600 rounded-2xl font-bold shadow-sm">{t('remember')}</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
