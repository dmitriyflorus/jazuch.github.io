            const getFlag = (lang) => customFlags[lang] !== undefined ? customFlags[lang] : (DEFAULT_LANG_FLAGS[lang] !== undefined ? DEFAULT_LANG_FLAGS[lang] : '🌍');

            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_userData', userData); }, [userData]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_myLanguages', myLanguages); }, [myLanguages]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_customFlags', customFlags); }, [customFlags]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_topics', topics); }, [topics]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_theme', theme); }, [theme]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_isRegistered', isRegistered); }, [isRegistered]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_goals', goals); }, [goals]);

            useEffect(() => {
                tg.expand();
                const tgUserId = tg.initDataUnsafe?.user?.id;
                if (Number(tgUserId) === ADMIN_ID) setIsAdminUser(true);

                const urlParams = new URLSearchParams(window.location.search);
                const dataParam = urlParams.get('data');
                let botGoals = null;

                if (dataParam) {
                    try {
                        const parsed = JSON.parse(decodeURIComponent(dataParam));
                        if (parsed.goals) botGoals = parsed.goals;
                        if (parsed.tickets) setAdminData(prev => ({ ...prev, tickets: parsed.tickets }));
                        if (parsed.all_users) setAdminData(prev => ({ ...prev, users: parsed.all_users }));
                        if (parsed.is_admin && (!tgUserId || Number(tgUserId) === ADMIN_ID)) setIsAdminUser(true);
                    } catch(e) {}
                }

                AppStorage.loadAll((values) => {
                    const isReg = values.jazuch_isRegistered === 'true';
                    setIsRegistered(isReg);
                    if (values.jazuch_theme) setTheme(values.jazuch_theme);
                    
                    let loadedGoals = botGoals || {};
                    if (!botGoals && values.jazuch_goals) { try { loadedGoals = JSON.parse(values.jazuch_goals); } catch(e){} }
                    
                    let migratedGoals = {};
                    for (let date in loadedGoals) {
                        if (!Array.isArray(loadedGoals[date])) {
                            migratedGoals[date] = [ { id: Date.now() + Math.random(), ...loadedGoals[date] } ];
                        } else migratedGoals[date] = loadedGoals[date];
                    }
                    setGoals(migratedGoals);
                    
                    if (values.jazuch_myLanguages) { try { setMyLanguages(JSON.parse(values.jazuch_myLanguages)); } catch(e){} }
                    if (values.jazuch_customFlags) { try { setCustomFlags(JSON.parse(values.jazuch_customFlags)); } catch(e){} }
                    if (values.jazuch_topics) { try { setTopics(JSON.parse(values.jazuch_topics)); } catch(e){} }
                    
                    if (values.jazuch_userData) {
                        try {
                            const savedUser = JSON.parse(values.jazuch_userData);
                            setUserData({ ...savedUser, uiLanguage: savedUser.uiLanguage || 'ru' });
                        } catch(e){}
                    } else {
                        setUserData({ name: tg.initDataUnsafe?.user?.first_name || '', goal: 'Свободное общение', uiLanguage: 'ru' });
                    }
                    
                    setTimeout(() => {
                        stateLoaded.current = true;
                        setIsLoading(false);
                        if (isReg) setStep('dashboard');
                        else setStep('register');
                    }, 500);
                });
            }, []);

            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            const syncAllData = () => {
                const hardWords = topics.flatMap(t => t.words).filter(w => w.stats && w.stats.attempts > 0 && (w.stats.correct / w.stats.attempts) < 0.7).map(w => ({q: w.q, a: w.a}));
                sendToBot({ action: 'sync_all', goals: goals, uiLanguage: userData.uiLanguage, hard_words: hardWords.slice(0, 15) }, t);
            };

            const handleSaveGoal = () => {
                if (!goalText.trim()) return;
                const newGoal = { id: Date.now(), text: goalText.trim(), time: goalTime, notified: false };
                setGoals({ ...goals, [selectedDate]: [...(goals[selectedDate] || []), newGoal] });
                setGoalText('');
            };

            const handleShareApp = () => {
                const shareUrl = "https://t.me/jazuchbot";
                const triggerToast = () => { setShareToast(true); setTimeout(() => setShareToast(false), 3000); };
                if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(shareUrl).then(triggerToast).catch(() => triggerToast());
            };

            const Footer = () => (
                <div className="mt-8 text-center pb-6 opacity-70">
                    <p className="font-bold text-xs">«Телляргя сӧйӧӱ белян»</p>
                    <p className="text-xs italic">«С любовью к языкам»</p>
                    <button onClick={() => setStep('credits')} className="mt-3 text-sm text-teal-600 font-bold underline">Благодарности</button>
                </div>
            );

            if (step === 'intro') {
                return (
                    <div className="h-screen w-screen bg-mint flex flex-col items-center justify-center">
                        <div className="text-center space-y-6 fade-in">
                            <h1 className="text-5xl font-extrabold text-teal-900 drop-shadow-xl tracking-wide">ЯзУч</h1>
                        </div>
                    </div>
                );
            }

            if (step === 'register') {
                return (
                    <div className="min-h-screen p-6 flex flex-col items-center justify-center fade-in bg-gradient-to-br from-teal-50 to-mint dark:from-gray-900 dark:to-teal-900">
                        <div className="w-full max-w-md bg-white/80 dark:bg-gray-800/80 backdrop-blur-lg rounded-3xl p-8 space-y-6">
                            <h2 className="text-2xl font-bold text-center text-teal-600">{t('welcome')}</h2>
                            <div className="space-y-2">
                                <label className="block text-sm font-semibold">{t('uiLang')}</label>
                                <select value={userData.uiLanguage} onChange={(e) => setUserData({...userData, uiLanguage: e.target.value})} className="w-full p-3 bg-white dark:bg-gray-700 rounded-xl outline-none font-semibold">
                                    <option value="ru">🇷🇺 Русский</option>
                                    <option value="en">🇬🇧 English</option>
                                    <option value="tt">Татарча</option>
                                    <option value="es">🇪🇸 Español</option>
                                    <option value="fr">🇫🇷 Français</option>
                                </select>
                            </div>
                            <button onClick={() => { setMyLanguages(['Английский']); setIsRegistered(true); setStep('dashboard'); }} className="w-full py-4 bg-teal-500 text-white rounded-xl font-bold shadow-lg">{t('login')}</button>
                        </div>
                    </div>
                );
            }

            if (step === 'credits') {
                return (
                    <div className="min-h-screen p-6 fade-in flex flex-col bg-gray-50 dark:bg-gray-900">
                        <button onClick={() => setStep('dashboard')} className="mb-6 text-teal-600 font-bold text-left">{t('back')}</button>
                        <h2 className="text-3xl font-extrabold mb-6 text-gray-800 dark:text-white">{t('creditsTitle')}</h2>
                        <div className="space-y-4 flex-1">
                            <div className="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-teal-100 dark:border-teal-900/50">
                                <a href="https://t.me/jazykoved" target="_blank" className="font-bold text-lg text-blue-600 hover:underline">Канал «Замѣтки языковѣда»</a>
                            </div>
                        </div>
                        <div className="mt-6 mb-4">
                            <button onClick={() => { setSupportModalType('collab'); setSupportModal(true); }} className="w-full py-4 bg-teal-50 dark:bg-teal-900/30 text-teal-700 rounded-xl font-bold border border-teal-200">
                                {t('collabBtn')}
                            </button>
                        </div>
                        <Footer />
                    </div>
                );
            }

            if (step === 'dashboard') {
                const today = new Date();
                const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
                const unreadTicketsCount = adminData.tickets.filter(tk => tk.status === 'open').length;

                return (
                    <div className="min-h-screen p-5 pb-20 fade-in bg-gray-50 dark:bg-gray-900 flex flex-col">
                        <header className="flex justify-between items-center mb-6 pt-2">
                            <div>
                                <h1 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-500 to-green-500">ЯзУч</h1>
                            </div>
                            <div className="flex gap-2 items-center flex-wrap justify-end">
                                <button onClick={() => setStep('faq')} className="w-10 h-10 flex items-center justify-center bg-white dark:bg-gray-800 rounded-full shadow-md text-lg">❓</button>
                                {isAdminUser ? (
                                    <>
                                        <button onClick={() => { setAdminTab('broadcast'); setAdminModal(true); }} className="w-10 h-10 flex items-center justify-center bg-teal-500 text-white rounded-full shadow-md text-lg">📢</button>
                                        <button onClick={() => { setAdminTab('tickets'); setAdminModal(true); }} className="relative w-10 h-10 flex items-center justify-center bg-white dark:bg-gray-800 rounded-full shadow-md text-lg">
                                            🔔{unreadTicketsCount > 0 && <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full">{unreadTicketsCount}</span>}
                                        </button>
                                    </>
                                ) : (
                                    <button onClick={() => { setSupportModalType('support'); setSupportModal(true); }} className="w-10 h-10 flex items-center justify-center bg-white dark:bg-gray-800 rounded-full shadow-md text-lg">🎧</button>
                                )}
                                <button onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')} className="w-10 h-10 flex items-center justify-center bg-white dark:bg-gray-800 rounded-full shadow-md text-lg">{theme === 'light' ? '🌙' : '☀️'}</button>
                                <button onClick={() => setStep('settings')} className="w-10 h-10 flex items-center justify-center bg-white dark:bg-gray-800 rounded-full shadow-md text-lg">⚙️</button>
                            </div>
                        </header>

                        <div className="bg-white dark:bg-gray-800 p-5 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 mb-6">
                            <h2 className="font-bold text-lg mb-1">📅 {t('goalCalendar')}</h2>
                            <p className="text-xs text-gray-400 mb-3">{t('clickDay')}</p>
                            <div className="grid grid-cols-7 gap-1">
                                {Array.from({length: daysInMonth}, (_, i) => i + 1).map(day => {
                                    const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                    const isToday = day === today.getDate();
                                    const hasGoal = goals[dateStr] && goals[dateStr].length > 0;
                                    return (
                                        <div key={day} onClick={() => { setSelectedDate(dateStr); setGoalText(''); }} 
                                             className={`relative aspect-square flex flex-col items-center justify-center rounded-lg text-sm font-semibold cursor-pointer ${isToday ? 'bg-teal-500 text-white shadow-md' : hasGoal ? 'bg-teal-50 text-teal-700 border border-teal-200 dark:bg-teal-900/40' : 'bg-gray-50 dark:bg-gray-700'}`}>
                                            <span>{day}</span>
                                            {hasGoal && <span className="absolute bottom-1 w-1.5 h-1.5 rounded-full bg-teal-600 dark:bg-teal-300"></span>}
                                        </div>
                                    )
                                })}
                            </div>
                            <button onClick={syncAllData} className="w-full mt-4 py-3 bg-teal-50 dark:bg-teal-900/30 text-teal-600 font-bold rounded-xl text-sm border border-teal-200">
                                {t('syncBot')}
                            </button>
                        </div>

                        <div className="flex-1">
                            <h2 className="text-xl font-bold mb-4">{t('myLangs')}</h2>
                            <div className="grid grid-cols-2 gap-4">
                                {myLanguages.map(lang => (
                                    <div key={lang} onClick={() => { setActiveLanguage(lang); setStep('app'); }} className="bg-white dark:bg-gray-800 p-5 rounded-3xl cursor-pointer border border-gray-100">
                                        <div className="text-3xl mb-2">{getFlag(lang)}</div>
                                        <h3 className="font-bold text-lg truncate">{lang}</h3>
                                    </div>
                                ))}
                                <div onClick={() => setAddLangModal(true)} className="bg-teal-50/50 dark:bg-gray-800 p-5 rounded-3xl flex flex-col items-center justify-center border-2 border-dashed border-teal-300">
                                    <span className="text-2xl text-teal-500">+</span>
                                </div>
                            </div>
                        </div>
                        
                        {/* Модальное окно календаря */}
                        {selectedDate && (
                            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 fade-in">
                                <div className="bg-white dark:bg-gray-800 rounded-3xl p-6 w-full max-w-sm">
                                    <h3 className="text-lg font-bold mb-4 text-teal-600">{selectedDate}</h3>
                                    {goals[selectedDate] && goals[selectedDate].length > 0 && (
                                        <div className="space-y-2 mb-4">
                                            {goals[selectedDate].map(g => (
                                                <div key={g.id} className="flex justify-between items-center bg-gray-50 dark:bg-gray-700 p-3 rounded-xl border border-gray-100 dark:border-gray-600">
                                                    <span className="text-sm font-semibold"><b>{g.time}</b> — {g.text}</span>
                                                    <button onClick={() => setGoals({...goals, [selectedDate]: goals[selectedDate].filter(x => x.id !== g.id)})} className="text-red-500 font-bold px-2">✕</button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    <div className="space-y-2 mb-4 bg-teal-50 dark:bg-teal-900/20 p-3 rounded-xl">
                                        <input type="text" value={goalText} onChange={e => setGoalText(e.target.value)} placeholder={t('goalText')} className="w-full p-2 bg-white dark:bg-gray-800 rounded-lg outline-none text-sm" />
                                        <div className="flex gap-2">
                                            <input type="time" value={goalTime} onChange={e => setGoalTime(e.target.value)} className="w-1/2 p-2 bg-white dark:bg-gray-800 rounded-lg outline-none font-bold text-sm" />
                                            <button onClick={handleSaveGoal} className="w-1/2 bg-teal-500 text-white font-bold rounded-lg text-sm">{t('goalSet')}</button>
                                        </div>
                                    </div>
                                    <button onClick={() => setSelectedDate(null)} className="w-full py-3 bg-gray-100 dark:bg-gray-700 font-bold rounded-xl">{t('done')}</button>
                                </div>
                            </div>
                        )}

                        {/* Поддержка / Сотрудничество */}
                        {supportModal && (
                            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 fade-in">
                                <div className="bg-white dark:bg-gray-800 rounded-3xl p-6 w-full max-w-sm space-y-4">
                                    <h3 className="text-xl font-bold">{supportModalType === 'collab' ? 'Сотрудничество' : t('support')}</h3>
                                    <textarea value={supportText} onChange={e => setSupportText(e.target.value)} rows="4" className="w-full p-3 bg-gray-50 dark:bg-gray-700 rounded-xl outline-none resize-none"></textarea>
                                    <button onClick={() => {
                                        const username = tg.initDataUnsafe?.user?.username;
                                        const userId = tg.initDataUnsafe?.user?.id;
                                        if(username) {
                                            setSupportText(prev => prev + (prev ? '\n' : '') + '@' + username);
                                        } else if (userId) {
                                            setSupportText(prev => prev + (prev ? '\n' : '') + 'Мой ID: ' + userId);
                                            alert("У вас не установлен @username, поэтому мы прикрепили ваш скрытый ID, чтобы поддержка смогла вам ответить!");
                                        } else {
                                            alert(t('contactError'));
                                        }
                                    }} className="w-full py-2 bg-blue-50 text-blue-600 rounded-xl text-xs font-bold border border-blue-100">{t('shareContact')}</button>
                                    <div className="flex gap-2">
                                        <button onClick={() => setSupportModal(false)} className="flex-1 py-3 bg-gray-100 font-bold rounded-xl">{t('cancel')}</button>
                                        <button onClick={() => { if(supportText.trim()) sendToBot({action: supportModalType, text: supportText}, t); }} className="flex-1 py-3 bg-teal-500 text-white font-bold rounded-xl">{t('sendClose')}</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Панель Админа */}
                        {adminModal && isAdminUser && (
                            <div className="fixed inset-0 bg-gray-50 dark:bg-gray-900 z-50 flex flex-col p-5 overflow-y-auto fade-in">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-2xl font-extrabold text-teal-600">{t('adminPanel')} 🛡️</h2>
                                    <button onClick={() => setAdminModal(false)} className="text-red-500 font-bold px-2 text-xl">✕</button>
                                </div>
                                <div className="flex gap-2 mb-4 bg-gray-200 dark:bg-gray-800 p-1 rounded-2xl">
                                    <button onClick={() => {setAdminTab('tickets'); setSelectedTicket(null);}} className={`flex-1 py-2 font-bold text-sm rounded-xl ${adminTab === 'tickets' ? 'bg-white text-teal-600 shadow' : 'text-gray-500'}`}>📬 {t('adminTickets')}</button>
                                    <button onClick={() => setAdminTab('broadcast')} className={`flex-1 py-2 font-bold text-sm rounded-xl ${adminTab === 'broadcast' ? 'bg-white text-teal-600 shadow' : 'text-gray-500'}`}>📢 {t('adminBroadcast')}</button>
                                </div>

                                {adminTab === 'tickets' && !selectedTicket && (
                                    <div className="space-y-3">
                                        {adminData.tickets.map(ticket => (
                                            <div key={ticket.id} onClick={() => setSelectedTicket(ticket)} className="bg-white p-4 rounded-2xl shadow-sm border cursor-pointer border-teal-200">
                                                <span className="font-bold text-sm text-teal-600">#{ticket.id} от {ticket.name}</span>
                                                <p className="text-sm line-clamp-2 mt-1">{ticket.text}</p>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                {adminTab === 'tickets' && selectedTicket && (
                                    <div className="bg-white p-5 rounded-3xl shadow-md space-y-4">
                                        <button onClick={() => setSelectedTicket(null)} className="text-teal-600 text-sm font-bold">← Назад</button>
                                        <div>
                                            <h3 className="text-lg font-bold">Тикет #{selectedTicket.id}</h3>
                                        </div>
                                        <div className="bg-gray-50 p-3 rounded-xl text-sm border">{selectedTicket.text}</div>
                                        <textarea value={ticketReplyText} onChange={e => setTicketReplyText(e.target.value)} placeholder="Ответ..." rows="3" className="w-full p-3 bg-gray-50 rounded-xl text-sm border"></textarea>
                                        <div className="flex gap-2">
                                            <button onClick={() => sendToBot({action: 'admin_mark_read', ticket_id: selectedTicket.id}, t)} className="flex-1 py-3 bg-gray-200 font-bold rounded-xl text-sm">{t('markRead')}</button>
                                            <button onClick={() => { if(ticketReplyText) sendToBot({action: 'admin_reply', ticket_id: selectedTicket.id, user_id: selectedTicket.user_id, text: ticketReplyText}, t); }} className="flex-1 py-3 bg-teal-500 text-white font-bold rounded-xl text-sm">{t('reply')}</button>
                                        </div>
                                    </div>
                                )}
                                {adminTab === 'broadcast' && (
                                    <div className="bg-white p-5 rounded-3xl space-y-4 shadow-sm">
                                        <textarea value={broadcastText} onChange={e => setBroadcastText(e.target.value)} rows="4" className="w-full p-3 bg-gray-50 rounded-xl text-sm border"></textarea>
                                        <button onClick={() => { if(broadcastText) sendToBot({action: 'admin_broadcast', user_id: 'all', text: broadcastText}, t); }} className="w-full py-3 bg-teal-500 text-white font-bold rounded-xl">{t('sendClose')}</button>
                                    </div>
                                )}
                            </div>
                        )}
                        <Footer />
                    </div>
                );
            }
            
            if (step === 'settings') {
                return (
                    <div className="min-h-screen p-6 flex flex-col bg-gray-50 dark:bg-gray-900">
                        <button onClick={() => setStep('dashboard')} className="mb-6 text-teal-600 font-bold">{t('back')}</button>
                        <h2 className="text-3xl font-extrabold mb-6">⚙️ {t('settings')}</h2>
                        <div className="bg-white dark:bg-gray-800 p-6 rounded-3xl shadow-sm space-y-4">
                            <label className="block text-sm font-semibold">{t('uiLang')}</label>
                            <select value={userData.uiLanguage} onChange={(e) => setUserData({...userData, uiLanguage: e.target.value})} className="w-full p-3 bg-gray-100 rounded-xl font-bold">
                                <option value="ru">🇷🇺 Русский</option><option value="en">🇬🇧 English</option><option value="tt">Татарча</option><option value="es">🇪🇸 Español</option><option value="fr">🇫🇷 Français</option>
                            </select>
                            <button onClick={() => { if(confirm(t('resetConfirm'))) AppStorage.clear(() => window.location.reload()); }} className="w-full py-3 text-red-500 font-bold bg-red-50 rounded-xl mt-4">{t('resetData')}</button>
                        </div>
                    </div>
                );
            }

            if (step === 'app' && !activeTopic) {
                const currentTopics = topics.filter(t => t.language === activeLanguage);
                return (
                    <div className="min-h-screen p-5 flex flex-col bg-gray-50 dark:bg-gray-900">
                        <header className="flex justify-between items-center mb-6 pt-2">
                            <button onClick={() => setStep('dashboard')} className="text-teal-600 font-bold">{t('back')}</button>
                            <h1 className="text-xl font-bold">{getFlag(activeLanguage)} {activeLanguage}</h1>
                        </header>
                        <div className="flex-1 space-y-4">
                            {currentTopics.map(topic => (
                                <div key={topic.id} className="bg-white p-5 rounded-2xl border border-gray-100 flex flex-col gap-2">
                                    <div className="flex justify-between items-center w-full">
                                        <div onClick={() => setActiveTopic(topic)} className="flex-1 cursor-pointer">
                                            <h3 className="font-bold text-lg">{topic.name}</h3>
                                            <p className="text-xs text-gray-400">{topic.words.length} {t('cards')}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => {setActiveTopic(topic); setStep('edit_topic');}} className="bg-gray-100 text-gray-600 px-3 py-1.5 rounded-lg text-xs font-bold">{t('editTopic')}</button>
                                            <button onClick={() => setActiveTopic(topic)} className="bg-teal-50 text-teal-600 px-4 py-1.5 rounded-lg font-bold text-lg">▶</button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                            <button onClick={() => {setActiveTopic(null); setStep('edit_topic');}} className="w-full py-4 text-teal-600 font-bold border-2 border-dashed border-teal-300 rounded-2xl">+ {t('newTopic')}</button>
                        </div>
                    </div>
                );
            }

            if (step === 'edit_topic') {
                return (
                    <CreateTopicMode t={t} language={activeLanguage} initialTopic={activeTopic} onSave={(updatedTopic) => { 
                        if (activeTopic) setTopics(topics.map(tp => tp.id === updatedTopic.id ? updatedTopic : tp));
                        else setTopics([...topics, { id: Date.now(), createdAt: new Date().toLocaleDateString('ru-RU'), language: activeLanguage, ...updatedTopic }]); 
                        setStep('app'); setActiveTopic(null);
                    }} onCancel={() => {setStep('app'); setActiveTopic(null);}} />
                );
            }

            if (activeTopic) {
                const latestObj = topics.find(tp => tp.id === activeTopic.id) || activeTopic;
                return <FlashcardMode t={t} topic={latestObj} onRecordAnswer={(tId, wId, corr) => {
                    setTopics(prev => prev.map(tp => tp.id !== tId ? tp : { ...tp, words: tp.words.map(w => w.id !== wId ? w : { ...w, stats: { attempts: (w.stats?.attempts||0)+1, correct: (w.stats?.correct||0)+(corr?1:0), wrong: (w.stats?.wrong||0)+(corr?0:1) } }) }));
                }} onBack={() => setActiveTopic(null)} />;
            }
        }

        function CreateTopicMode({ t, language, initialTopic, onSave, onCancel }) {
            const [topicName, setTopicName] = useState(initialTopic ? initialTopic.name : '');
            const [words, setWords] = useState(initialTopic && initialTopic.words.length ? initialTopic.words : [{id: Date.now()+'_0', q: '', a: '', stats: {attempts:0, correct:0, wrong:0}}]);
            return (
                <div className="min-h-screen p-5 flex flex-col bg-gray-50">
                    <header className="flex justify-between mb-6 bg-white p-4 rounded-xl shadow-sm"><button onClick={onCancel} className="text-red-500 font-bold">{t('cancel')}</button><h2 className="font-bold">{initialTopic ? t('editTopic') : t('newTopic')}</h2><button onClick={() => onSave({id: initialTopic?.id, name: topicName, words: words.filter(w=>w.q&&w.a)})} className="text-teal-600 font-bold">{t('done')}</button></header>
                    <input type="text" value={topicName} onChange={e=>setTopicName(e.target.value)} placeholder={t('topicName')} className="w-full p-4 text-lg font-bold bg-white rounded-xl mb-4 shadow-sm" />
                    <div className="space-y-3 mb-4">
                        {words.map((w, idx) => (
                            <div key={w.id} className="flex bg-white p-3 rounded-xl gap-2 shadow-sm border border-gray-100">
                                <div className="flex-1 space-y-2">
                                    <input value={w.q} onChange={e=>{const nw=[...words]; nw[idx].q=e.target.value; setWords(nw);}} className="w-full p-2 bg-gray-50 rounded outline-none" placeholder={t('word')}/>
                                    <input value={w.a} onChange={e=>{const nw=[...words]; nw[idx].a=e.target.value; setWords(nw);}} className="w-full p-2 bg-teal-50 text-teal-700 rounded outline-none" placeholder={t('translation')}/>
                                </div>
                                <button onClick={() => setWords(words.filter(x => x.id !== w.id))} className="text-red-300 hover:text-red-500 font-bold px-2 text-xl">✕</button>
                            </div>
                        ))}
                    </div>
                    <button onClick={() => setWords([...words, {id: Date.now()+'_'+words.length, q:'', a:'', stats:{attempts:0, correct:0, wrong:0}}])} className="w-full py-4 text-teal-600 font-bold border border-teal-300 rounded-xl bg-white">{t('addCard')}</button>
                </div>
            );
        }

        function FlashcardMode({ t, topic, onRecordAnswer, onBack }) {
            const [idx, setIdx] = useState(0); const [flipped, setFlipped] = useState(false);
            const words = topic.words.sort(() => Math.random() - 0.5);
            if (!words[idx]) { onBack(); return null; }
            return (
                <div className="min-h-screen p-6 flex flex-col items-center justify-center bg-gray-50">
                    <button onClick={onBack} className="absolute top-6 left-6 text-gray-500 font-bold bg-white px-4 py-2 rounded-full shadow">{t('exit')}</button>
                    <h2 className="text-xl font-bold mb-8 mt-10">{topic.name} <span className="text-teal-500">({idx + 1}/{words.length})</span></h2>
                    <div onClick={() => setFlipped(!flipped)} className="w-full max-w-sm aspect-[4/5] bg-white rounded-3xl shadow-lg flex items-center justify-center p-8 border border-gray-100 cursor-pointer text-center relative">
                        <p className="absolute top-6 text-teal-400 text-xs font-bold uppercase">{flipped ? t('translation') : t('word')}</p>
                        <h3 className="text-4xl font-extrabold break-words w-full">{flipped ? words[idx].a : words[idx].q}</h3>
                    </div>
                    <div className="flex gap-4 mt-8 w-full max-w-sm">
                        <button onClick={() => { onRecordAnswer(topic.id, words[idx].id, false); setFlipped(false); setTimeout(() => {if(idx+1>=words.length){alert(t('completed')); onBack();}else setIdx(i=>i+1);}, 150); }} className="flex-1 py-4 bg-red-50 text-red-500 rounded-2xl font-bold">{t('dontRemember')}</button>
                        <button onClick={() => { onRecordAnswer(topic.id, words[idx].id, true); setFlipped(false); setTimeout(() => {if(idx+1>=words.length){alert(t('completed')); onBack();}else setIdx(i=>i+1);}, 150); }} className="flex-1 py-4 bg-green-50 text-green-600 rounded-2xl font-bold">{t('remember')}</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
