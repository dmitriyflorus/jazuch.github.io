                                }} className="w-full py-3.5 text-rose-500 font-semibold bg-rose-500/10 border border-rose-500/20 rounded-2xl text-xs active:scale-95 transition">
                                    {t('resetData')}
                                </button>
                            </div>
                        </div>

                        {broadcastModal && isAdminUser && (
                            <div className="fixed inset-0 bg-black/40 backdrop-blur-md z-50 flex items-center justify-center p-4 fade-in">
                                <div className={`${GLASS_PANEL} rounded-3xl p-6 w-full max-w-md space-y-4`}>
                                    <div className="flex justify-between items-center">
                                        <h3 className="text-base font-bold tracking-tight">{t('adminBroadcastTitle')}</h3>
                                        <button onClick={() => { Haptics.impact('light'); setBroadcastModal(false); }} className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400">
                                            <Icon name="close" className="w-4 h-4" />
                                        </button>
                                    </div>
                                    <textarea 
                                        value={broadcastText} 
                                        onChange={e => setBroadcastText(e.target.value)} 
                                        rows="5" 
                                        placeholder={t('adminBroadcastPlaceholder')}
                                        className={`w-full p-3.5 rounded-2xl text-xs resize-none ${GLASS_INPUT}`}
                                    ></textarea>
                                    <div className="flex gap-2.5">
                                        <button onClick={() => { Haptics.impact('light'); setBroadcastModal(false); }} className={`flex-1 py-3 font-semibold rounded-2xl text-xs ${GLASS_BTN}`}>{t('cancel')}</button>
                                        <button onClick={() => {
                                            if (broadcastText.trim()) {
                                                askConfirm(t('adminBroadcastConfirm'), () => {
                                                    Haptics.notify('success');
                                                    sendToBot({ action: 'admin_broadcast', text: broadcastText.trim() });
                                                });
                                            }
                                        }} className={`flex-1 py-3 font-semibold rounded-2xl text-xs ${ACCENT_BTN}`}>
                                            {t('adminBroadcastSend')}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (step === 'lang_stats') {
                const currentTopics = topics.filter(tp => tp.language === activeLanguage && !tp.deletedAt);
                const allWords = currentTopics.flatMap(tp => tp.words.map(w => ({...w, topicId: tp.id, topicName: tp.name})));
                const totalAttempts = allWords.reduce((sum, w) => sum + (w.stats?.attempts || 0), 0);
                const totalCorrect = allWords.reduce((sum, w) => sum + (w.stats?.correct || 0), 0);
                const accuracy = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0;

                const langTimeObj = studyTime[activeLanguage] || {};
                const timeEntries = Object.entries(langTimeObj).sort((a, b) => b[0].localeCompare(a[0]));
                const totalSecondsLearned = timeEntries.reduce((acc, [_, val]) => acc + parseDayTimeEntry(val).total, 0);

                const criticalWords = [];
                const reviewWords = [];
                const masteredWords = [];
                const newWords = [];

                allWords.forEach(w => {
                    const att = w.stats?.attempts || 0;
                    const corr = w.stats?.correct || 0;
                    const wrg = w.stats?.wrong || 0;
                    const acc = att > 0 ? Math.round((corr / att) * 100) : null;
                    const item = { ...w, acc, att, corr, wrg };

                    if (att === 0) {
                        newWords.push(item);
                    } else if (acc < 60 || wrg >= 2) {
                        criticalWords.push(item);
                    } else if (acc < 85 || att < 3) {
                        reviewWords.push(item);
                    } else {
                        masteredWords.push(item);
                    }
                });

                criticalWords.sort((a, b) => (a.acc ?? 0) - (b.acc ?? 0));

                return (
                    <div className="min-h-screen p-5 flex flex-col max-w-lg mx-auto w-full fade-in">
                        <GlobalOverlays />
                        <header className="flex justify-between items-center mb-5 pt-1">
                            <button onClick={() => { Haptics.impact('light'); setStep('dashboard'); }} className={`px-4 py-2 rounded-full text-xs font-semibold ${GLASS_BTN}`}>← {t('back')}</button>
                            <h2 className="text-base font-bold flex items-center gap-2 tracking-tight">{getFlag(activeLanguage)} {t('statsBtn')}</h2>
                            <div className="w-14"></div>
                        </header>

                        <div className="grid grid-cols-3 gap-2.5 mb-4">
                            <div className={`${GLASS_PANEL} p-3.5 rounded-2xl text-center`}>
                                <p className="text-lg font-bold text-indigo-600 dark:text-indigo-400">{accuracy}%</p>
                                <p className="text-[10px] font-semibold text-slate-400 dark:text-zinc-500 mt-0.5 uppercase tracking-wider">{t('accuracy')}</p>
                            </div>
                            <div className={`${GLASS_PANEL} p-3.5 rounded-2xl text-center`}>
                                <p className="text-lg font-bold text-slate-800 dark:text-zinc-100">{totalAttempts}</p>
                                <p className="text-[10px] font-semibold text-slate-400 dark:text-zinc-500 mt-0.5 uppercase tracking-wider">{t('attempts')}</p>
                            </div>
                            <div className={`${GLASS_PANEL} p-3.5 rounded-2xl text-center`}>
                                <p className="text-sm font-bold text-emerald-600 dark:text-emerald-400 mt-1">{formatDuration(totalSecondsLearned)}</p>
                                <p className="text-[10px] font-semibold text-slate-400 dark:text-zinc-500 mt-1 uppercase tracking-wider">{t('totalTime')}</p>
                            </div>
                        </div>

                        <div className={`flex gap-1.5 mb-4 p-1.5 rounded-2xl ${GLASS_PANEL}`}>
                            <button onClick={() => { Haptics.selection(); setStatsTab('recs'); }} className={`flex-1 py-2 px-1 rounded-xl font-semibold text-xs transition ${statsTab === 'recs' ? 'bg-indigo-600 text-white shadow' : 'text-slate-500 dark:text-zinc-400'}`}>{t('recsTab')}</button>
                            <button onClick={() => { Haptics.selection(); setStatsTab('words'); }} className={`flex-1 py-2 px-1 rounded-xl font-semibold text-xs transition ${statsTab === 'words' ? 'bg-indigo-600 text-white shadow' : 'text-slate-500 dark:text-zinc-400'}`}>{t('wordsTab')}</button>
                            <button onClick={() => { Haptics.selection(); setStatsTab('time'); }} className={`flex-1 py-2 px-1 rounded-xl font-semibold text-xs transition ${statsTab === 'time' ? 'bg-indigo-600 text-white shadow' : 'text-slate-500 dark:text-zinc-400'}`}>{t('timeTab')}</button>
                        </div>

                        {statsTab === 'recs' && (
                            <div className="flex-1 overflow-y-auto space-y-3.5 mb-6">
                                <div className={`${GLASS_PANEL} p-4 rounded-2xl`}>
                                    <h3 className="font-semibold text-sm text-slate-900 dark:text-white mb-1">{t('recsTitle')}</h3>
                                    <p className="text-xs text-slate-500 dark:text-zinc-400 leading-relaxed mb-3.5">{t('recsSubtitle')}</p>
                                    
                                    <div className="grid grid-cols-2 gap-2 text-xs font-semibold">
                                        <div className="p-2.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-600 dark:text-rose-400 flex justify-between">
                                            <span>{t('priorityHigh')}</span><span>{criticalWords.length}</span>
                                        </div>
                                        <div className="p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-600 dark:text-amber-400 flex justify-between">
                                            <span>{t('priorityMed')}</span><span>{reviewWords.length}</span>
                                        </div>
                                        <div className="p-2.5 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 flex justify-between">
                                            <span>{t('priorityLow')}</span><span>{masteredWords.length}</span>
                                        </div>
                                        <div className="p-2.5 rounded-xl bg-white/50 dark:bg-zinc-800/50 border border-white/40 dark:border-white/5 text-slate-600 dark:text-zinc-300 flex justify-between">
                                            <span>Новые</span><span>{newWords.length}</span>
                                        </div>
                                    </div>
                                </div>

                                {allWords.length === 0 ? (
                                    <p className="text-center text-slate-400 text-xs py-8">{t('recsEmpty')}</p>
                                ) : (
                                    <div className="space-y-3">
                                        {criticalWords.length > 0 && (
                                            <div className={`${GLASS_PANEL} p-4 rounded-2xl space-y-2`}>
                                                <h4 className="font-semibold text-[11px] text-rose-500 uppercase tracking-wider">{t('statusCritical')}</h4>
                                                <div className="divide-y divide-white/30 dark:divide-white/5">
                                                    {criticalWords.map((w, i) => (
                                                        <div key={i} className="py-2 flex justify-between items-center text-xs">
                                                            <div>
                                                                <span className="font-semibold">{w.q}</span> — <span className="text-indigo-600 dark:text-indigo-400 font-medium">{w.a}</span>
                                                                <p className="text-[10px] text-slate-400">{w.topicName} • Ошибок: {w.wrg}</p>
                                                            </div>
                                                            <span className="px-2 py-0.5 rounded-lg bg-rose-500/15 text-rose-600 dark:text-rose-300 font-semibold">{w.acc}%</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {reviewWords.length > 0 && (
                                            <div className={`${GLASS_PANEL} p-4 rounded-2xl space-y-2`}>
                                                <h4 className="font-semibold text-[11px] text-amber-500 uppercase tracking-wider">{t('statusReview')}</h4>
                                                <div className="divide-y divide-white/30 dark:divide-white/5">
                                                    {reviewWords.map((w, i) => (
                                                        <div key={i} className="py-2 flex justify-between items-center text-xs">
                                                            <div>
                                                                <span className="font-semibold">{w.q}</span> — <span className="text-indigo-600 dark:text-indigo-400 font-medium">{w.a}</span>
                                                                <p className="text-[10px] text-slate-400">{w.topicName}</p>
                                                            </div>
                                                            <span className="px-2 py-0.5 rounded-lg bg-amber-500/15 text-amber-600 dark:text-amber-300 font-semibold">{w.acc}%</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {masteredWords.length > 0 && (
                                            <div className={`${GLASS_PANEL} p-4 rounded-2xl space-y-2`}>
                                                <h4 className="font-semibold text-[11px] text-emerald-500 uppercase tracking-wider">{t('statusMastered')} ({masteredWords.length})</h4>
                                                <div className="flex flex-wrap gap-1.5 pt-1">
                                                    {masteredWords.map((w, i) => (
                                                        <span key={i} className="px-2.5 py-1 bg-emerald-500/10 border border-emerald-500/20 text-emerald-700 dark:text-emerald-300 rounded-xl text-xs font-medium">
                                                            {w.q} ({w.acc}%)
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {statsTab === 'words' && (
                            <div className="flex-1 overflow-y-auto space-y-2.5 mb-6">
                                {allWords.map((w, idx) => {
                                    const acc = w.stats?.attempts ? Math.round((w.stats.correct / w.stats.attempts) * 100) : 0;
                                    const createdDate = new Date(w.createdAt || Date.now()).toLocaleDateString();
                                    return (
                                        <div key={idx} className={`${GLASS_PANEL} p-4 rounded-2xl flex justify-between items-center`}>
                                            <div>
                                                <p className="font-semibold text-sm">{w.q} — <span className="text-indigo-600 dark:text-indigo-400">{w.a}</span></p>
                                                <p className="text-[11px] text-slate-400 mt-0.5">{w.topicName} • {createdDate} • {t('attempts')}: {w.stats?.attempts || 0}</p>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <span className={`font-bold text-xs ${acc >= 75 ? 'text-emerald-500' : acc > 0 ? 'text-amber-500' : 'text-slate-400'}`}>{w.stats?.attempts ? acc+'%' : '—'}</span>
                                                <button onClick={() => {
                                                    Haptics.notify('error');
                                                    setTopics(prev => prev.map(tp => tp.id !== w.topicId ? tp : { ...tp, words: tp.words.map(cw => cw.id !== w.id ? cw : { ...cw, stats: {attempts:0, correct:0, wrong:0} }) }))
                                                }} className="text-rose-500 text-xs font-medium hover:underline">{t('resetStats')}</button>
                                            </div>
                                        </div>
                                    );
                                })}
                                {allWords.length === 0 && <p className="text-center text-xs text-slate-400 mt-10">{t('empty')}</p>}
                            </div>
                        )}

                        {statsTab === 'time' && (
                            <div className="flex-1 overflow-y-auto space-y-2.5 mb-6">
                                <h3 className="text-[11px] font-semibold uppercase tracking-wider text-slate-400 px-1">{t('studyTimeStats')}</h3>
                                {timeEntries.map(([dateKey, rawVal]) => {
                                    const parsed = parseDayTimeEntry(rawVal);
                                    return (
                                        <div key={dateKey} className={`${GLASS_PANEL} p-4 rounded-2xl space-y-2`}>
                                            <div className="flex justify-between items-center border-b border-white/40 dark:border-white/5 pb-2">
                                                <span className="font-semibold text-xs">{dateKey}</span>
                                                <span className="font-semibold text-indigo-600 dark:text-indigo-400 text-xs">{t('totalDayTime')}: {formatDuration(parsed.total)}</span>
                                            </div>
                                            <div className="flex justify-between text-xs text-slate-500 dark:text-zinc-400 pt-0.5">
                                                <span>{t('studyListTime')}: <b className="text-slate-700 dark:text-zinc-200">{formatDuration(parsed.study)}</b></span>
                                                <span>{t('flashcardsTime')}: <b className="text-slate-700 dark:text-zinc-200">{formatDuration(parsed.cards)}</b></span>
                                            </div>
                                        </div>
                                    );
                                })}
                                {timeEntries.length === 0 && <p className="text-center text-xs text-slate-400 mt-10">{t('empty')}</p>}
                            </div>
                        )}
                        
                        <button onClick={() => {
                            askConfirm(t('resetConfirm'), () => {
                                Haptics.notify('error');
                                setTopics(prev => prev.map(tp => tp.language !== activeLanguage ? tp : { ...tp, words: tp.words.map(cw => ({...cw, stats: {attempts:0, correct:0, wrong:0}})) }));
                                setStudyTime(prev => ({ ...prev, [activeLanguage]: {} }));
                            });
                        }} className="w-full py-3.5 text-rose-500 font-semibold bg-rose-500/10 border border-rose-500/20 rounded-2xl text-xs active:scale-95 transition">{t('resetAllStats')}</button>
                    </div>
                );
            }

            if (step === 'trash') {
                const deletedTopics = topics.filter(tp => tp.language === activeLanguage && tp.deletedAt);
                return (
                    <div className="min-h-screen p-5 flex flex-col max-w-lg mx-auto w-full fade-in">
                        <GlobalOverlays />
                        <header className="flex justify-between items-center mb-3 pt-1">
                            <button onClick={() => { Haptics.impact('light'); setStep('app'); }} className={`px-4 py-2 rounded-full text-xs font-semibold ${GLASS_BTN}`}>← {t('back')}</button>
                            <h1 className="text-base font-bold tracking-tight">{t('trashBin')}</h1>
                            <div className="w-14"></div>
                        </header>
                        <p className="text-[11px] text-center text-slate-400 mb-6">{t('trashInfo')}</p>
                        <div className="flex-1 space-y-3">
                            {deletedTopics.map(topic => {
                                const daysPassed = Math.floor((Date.now() - topic.deletedAt) / (1000 * 60 * 60 * 24));
                                const daysLeft = Math.max(1, 30 - daysPassed);
                                return (
                                    <div key={topic.id} className={`${GLASS_PANEL} p-4 rounded-3xl flex justify-between items-center`}>
                                        <div>
                                            <h3 className="font-semibold text-sm text-slate-800 dark:text-zinc-200">{topic.name}</h3>
                                            <p className="text-[11px] text-slate-400 mt-0.5">{topic.words.length} {t('cards')} • {daysLeft} {t('daysLeft')}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => {
                                                Haptics.notify('success');
                                                setTopics(prev => prev.map(tp => tp.id === topic.id ? { ...tp, deletedAt: null } : tp));
                                            }} className="bg-indigo-500/15 text-indigo-600 dark:text-indigo-300 px-3 py-2 rounded-xl text-xs font-semibold active:scale-95 transition">
                                                {t('restore')}
                                            </button>
                                            <button onClick={() => {
                                                Haptics.notify('error');
                                                setTopics(prev => prev.filter(tp => tp.id !== topic.id));
                                            }} className="bg-rose-500/15 text-rose-500 px-2.5 py-2 rounded-xl text-xs font-semibold active:scale-95 transition">
                                                <Icon name="close" className="w-3.5 h-3.5" />
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                            {deletedTopics.length === 0 && <p className="text-center text-xs text-slate-400 mt-10">{t('trashEmpty')}</p>}
                        </div>
                    </div>
                );
            }

            if (step === 'study_mode' && activeTopic) {
                const latestTopicObj = topics.find(tp => tp.id === activeTopic.id) || activeTopic;
                return (
                    <div className="relative w-full h-full">
                        <DynamicBackground bgTheme={userData.bgTheme} uiTheme={theme} />
                        <StudyListMode 
                            t={t} 
                            topic={latestTopicObj} 
                            onExit={(elapsedSecs) => {
                                Haptics.impact('light');
                                recordStudySeconds(activeLanguage, elapsedSecs, 'study');
                                const nowTimeStr = getTimeStr();
                                setTopics(prev => prev.map(tp => tp.id !== activeTopic.id ? tp : {
                                    ...tp,
                                    words: (tp.words || []).map(w => ({ ...w, studyTimeStr: nowTimeStr }))
                                }));
                                setHasUnsavedGoals(true);
                                setActiveTopic(null);
                                setStep('app');
                            }} 
                        />
                    </div>
                );
            }

            if (step === 'app' && !activeTopic) {
                const currentTopics = topics.filter(tp => tp.language === activeLanguage && !tp.deletedAt);
                const trashCount = topics.filter(tp => tp.language === activeLanguage && tp.deletedAt).length;

                const swapTopicsOrder = (draggedId, targetId) => {
                    if (!draggedId || !targetId || draggedId === targetId) return;
                    setTopics(prev => {
                        const fromIdx = prev.findIndex(tp => tp.id === draggedId);
                        const toIdx = prev.findIndex(tp => tp.id === targetId);
                        if (fromIdx === -1 || toIdx === -1) return prev;
                        const next = [...prev];
                        const [moved] = next.splice(fromIdx, 1);
                        next.splice(toIdx, 0, moved);
                        return next;
                    });
                };

                const handleTouchMoveTopic = (e) => {
                    if (!draggingTopicId) return;
                    const touch = e.touches[0];
                    const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                    const card = elem?.closest('[data-topic-id]');
                    if (card) {
                        const targetId = Number(card.getAttribute('data-topic-id'));
                        if (targetId && targetId !== draggingTopicId) {
                            Haptics.selection();
                            swapTopicsOrder(draggingTopicId, targetId);
                        }
                    }
                };

                return (
                    <div 
                        className="min-h-screen p-5 flex flex-col max-w-lg mx-auto w-full fade-in"
                        onTouchMove={handleTouchMoveTopic}
                        onTouchEnd={() => { if(draggingTopicId) Haptics.impact('light'); setDraggingTopicId(null); }}
                        onMouseUp={() => { if(draggingTopicId) Haptics.impact('light'); setDraggingTopicId(null); }}
                    >
                        <GlobalOverlays />
                        <header className="flex justify-between items-center mb-4 pt-1">
                            <button onClick={() => { Haptics.impact('light'); setStep('dashboard'); }} className={`px-4 py-2 rounded-full text-xs font-semibold ${GLASS_BTN}`}>← {t('back')}</button>
                            <h1 className="text-base font-bold flex items-center gap-2 tracking-tight">{getFlag(activeLanguage)} {getLangLabel(activeLanguage)}</h1>
                            <button onClick={() => { Haptics.impact('light'); setStep('trash'); }} className={`relative px-3 py-2 rounded-full text-xs font-semibold flex items-center gap-1 ${GLASS_BTN}`}>
                                <Icon name="trash" className="w-3.5 h-3.5" />
                                {trashCount > 0 && <span className="text-[11px] text-indigo-600 dark:text-indigo-400 font-bold">{trashCount}</span>}
                            </button>
                        </header>

                        {currentTopics.length > 1 && (
                            <p className="text-[11px] text-center text-slate-400 dark:text-zinc-500 mb-3.5">{t('dragHint')}</p>
                        )}
                        
                        <div className="flex-1 space-y-3.5">
                            {currentTopics.map(topic => (
                                <div 
                                    key={topic.id} 
                                    data-topic-id={topic.id}
                                    draggable={true}
                                    onDragStart={() => { Haptics.impact('medium'); setDraggingTopicId(topic.id); }}
                                    onDragOver={(e) => { e.preventDefault(); swapTopicsOrder(draggingTopicId, topic.id); }}
                                    onDragEnd={() => { Haptics.impact('light'); setDraggingTopicId(null); }}
                                    className={`${GLASS_PANEL} p-4 rounded-3xl flex flex-col gap-3 transition ${draggingTopicId === topic.id ? 'dragging-topic ring-2 ring-indigo-500/60 z-20' : ''}`}
                                >
                                    <div className="flex justify-between items-center w-full gap-2">
                                        <div 
                                            onTouchStart={(e) => { e.stopPropagation(); Haptics.impact('medium'); setDraggingTopicId(topic.id); }}
                                            onMouseDown={(e) => { e.stopPropagation(); Haptics.impact('medium'); setDraggingTopicId(topic.id); }}
                                            className="text-slate-300 dark:text-zinc-600 hover:text-indigo-500 cursor-grab active:cursor-grabbing p-1.5 select-none touch-none"
                                        >
                                            <Icon name="grip" className="w-4 h-4" />
                                        </div>
                                        <div onClick={() => { Haptics.impact('light'); setActiveTopic(topic); }} className="flex-1 cursor-pointer">
                                            <h3 className="font-semibold text-base leading-snug tracking-tight">{topic.name}</h3>
                                            <p className="text-[11px] text-slate-400 dark:text-zinc-500 mt-0.5">{topic.words.length} {t('cards')}</p>
                                        </div>
                                        <button onClick={() => {
                                            askConfirm(t('deleteTopicConfirm'), () => {
                                                Haptics.notify('error');
                                                setTopics(prev => prev.map(tp => tp.id === topic.id ? { ...tp, deletedAt: Date.now() } : tp));
                                                setHasUnsavedGoals(true);
                                            });
                                        }} className="text-slate-300 dark:text-zinc-600 hover:text-rose-500 transition p-1.5">
                                            <Icon name="trash" className="w-4 h-4" />
                                        </button>
                                    </div>
                                    <div className="flex gap-2 justify-end pt-2 border-t border-white/40 dark:border-white/5">
                                        <button onClick={() => { Haptics.impact('light'); setActiveTopic(topic); setStep('edit_topic');}} className="bg-white/50 dark:bg-zinc-800/60 border border-white/40 dark:border-white/5 text-slate-600 dark:text-zinc-300 px-3.5 py-2 rounded-xl text-xs font-semibold active:scale-95 transition">
                                            {t('editTopic')}
                                        </button>
                                        <button onClick={() => { Haptics.impact('light'); setActiveTopic(topic); setStep('study_mode');}} className="bg-indigo-500/10 dark:bg-indigo-500/15 border border-indigo-500/20 text-indigo-600 dark:text-indigo-300 px-3.5 py-2 rounded-xl text-xs font-semibold active:scale-95 transition">
                                            {t('learnWords')}
                                        </button>
                                        <button onClick={() => { Haptics.impact('medium'); setActiveTopic(topic); }} className={`px-4 py-2 rounded-xl font-semibold text-xs flex items-center justify-center ${ACCENT_BTN}`}>
                                            <Icon name="play" className="w-3.5 h-3.5" />
                                        </button>
                                    </div>
                                </div>
                            ))}
                            {currentTopics.length === 0 && <p className="text-center text-xs text-slate-400 mt-10">{t('empty')}</p>}
                            <button onClick={() => { Haptics.impact('medium'); setActiveTopic(null); setStep('edit_topic');}} className={`w-full mt-3 py-4 text-xs font-semibold rounded-3xl border-dashed border-slate-300 dark:border-zinc-700 text-indigo-600 dark:text-indigo-400 ${GLASS_BTN}`}>
                                + {t('newTopic')}
                            </button>
                            {currentTopics.length > 0 && (
                                <button onClick={() => syncAllData()} className={`w-full mt-2 py-3.5 font-semibold rounded-2xl text-xs transition ${hasUnsavedGoals ? ACCENT_BTN : GLASS_BTN}`}>
                                    {t('syncBot')}
                                </button>
                            )}
                        </div>
                    </div>
                );
            }

            if (step === 'edit_topic') {
                return (
                    <div className="relative w-full h-full">
                        <DynamicBackground bgTheme={userData.bgTheme} uiTheme={theme} />
                        <CreateTopicMode 
                            t={t} 
                            language={activeLanguage} 
                            initialTopic={activeTopic} 
                            onSave={(updatedTopic) => { 
                                Haptics.notify('success');
                                const now = Date.now();
                                const nowTimeStr = getTimeStr();
                                if (activeTopic && updatedTopic.id) {
                                    setTopics(prev => prev.map(tp => tp.id === updatedTopic.id ? { ...tp, ...updatedTopic, language: activeLanguage } : tp));
                                } else {
                                    const wordsWithTime = (updatedTopic.words || []).map(w => ({ ...w, studyTimeStr: w.studyTimeStr || nowTimeStr }));
                                    setTopics(prev => [...prev, { ...updatedTopic, words: wordsWithTime, id: now, createdAt: now, language: activeLanguage }]); 
                                }
                                setHasUnsavedGoals(true);
                                setStep('app'); setActiveTopic(null);
                            }} 
                            onCancel={() => { Haptics.impact('light'); setStep('app'); setActiveTopic(null);}} 
                        />
                    </div>
                );
            }

            if (activeTopic) {
                const latestTopicObj = topics.find(tp => tp.id === activeTopic.id) || activeTopic;
                return (
                    <div className="relative w-full h-full">
                        <DynamicBackground bgTheme={userData.bgTheme} uiTheme={theme} />
                        <FlashcardMode 
                            t={t} 
                            topic={latestTopicObj} 
                            onRecordAnswer={(tId, wId, corr) => {
                                Haptics.impact(corr ? 'light' : 'medium');
                                markActivityToday();
                                setHasUnsavedGoals(true);
                                const nowTs = Date.now();
                                const nowTimeStr = getTimeStr();
                                setTopics(prev => prev.map(tp => tp.id !== tId ? tp : { 
                                    ...tp, 
                                    lastReviewedAt: nowTs,
                                    lastReviewTimeStr: nowTimeStr,
                                    words: tp.words.map(w => {
                                        if(w.id !== wId) return w;
                                        const st = w.stats || {attempts:0, correct:0, wrong:0};
                                        return { 
                                            ...w, 
                                            lastReviewedAt: nowTs,
                                            lastReviewTimeStr: nowTimeStr,
                                            stats: { attempts: st.attempts+1, correct: st.correct+(corr?1:0), wrong: st.wrong+(corr?0:1) } 
                                        };
                                    })
                                }));
                            }} 
                            onBack={(elapsedCardSecs, finishedTopic) => {
                                recordStudySeconds(activeLanguage, elapsedCardSecs, 'cards');
                                setActiveTopic(null);
                                if (finishedTopic) {
                                    Haptics.notify('success');
                                    showToast(t('completed'), 3000);
                                } else {
                                    Haptics.impact('light');
                                }
                            }} 
                        />
                    </div>
                );
            }
        }

        function StudyListMode({ t, topic, onExit }) {
            const [seconds, setSeconds] = useState(0);
            useEffect(() => {
                const interval = setInterval(() => {
                    setSeconds(s => s + 1);
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');

            return (
                <div className="min-h-screen p-5 flex flex-col max-w-lg mx-auto w-full fade-in">
                    <header className={`flex justify-between items-center mb-6 p-4 rounded-2xl sticky top-2 z-20 ${GLASS_PANEL}`}>
                        <button onClick={() => onExit(seconds)} className="text-xs font-semibold text-indigo-600 dark:text-indigo-400 active:scale-95 transition">← {t('exit')}</button>
                        <div className="text-center">
                            <h2 className="font-bold text-sm tracking-tight">{topic.name}</h2>
                            <p className="text-[10px] text-slate-400 uppercase tracking-wider">{t('studyModeTitle')}</p>
                        </div>
                        <div className="bg-indigo-500/10 border border-indigo-500/20 text-indigo-600 dark:text-indigo-300 px-3 py-1 rounded-xl font-semibold text-xs flex items-center gap-1.5 tabular-nums">
                            <Icon name="clock" className="w-3.5 h-3.5" />
                            <span>{mins}:{secs}</span>
                        </div>
                    </header>

                    <div className="flex-1 space-y-2.5 pb-10">
                        {(topic.words || []).map((w, i) => (
                            <div key={w.id || i} className={`${GLASS_PANEL} p-4 rounded-2xl flex justify-between items-center gap-4`}>
                                <div className="flex items-center gap-3 flex-1">
                                    <span className="w-6 h-6 rounded-full bg-white/60 dark:bg-zinc-800 text-slate-400 text-[11px] font-semibold flex items-center justify-center shrink-0 border border-white/40 dark:border-white/5">{i + 1}</span>
                                    <span className="font-semibold text-sm break-words">{w.q}</span>
                                </div>
                                <div className="text-right font-medium text-indigo-600 dark:text-indigo-400 text-sm break-words flex-1">
                                    {w.a}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function CreateTopicMode({ t, language, initialTopic, onSave, onCancel }) {
            const [topicName, setTopicName] = useState(initialTopic ? initialTopic.name : '');
            const [words, setWords] = useState(initialTopic && initialTopic.words.length ? initialTopic.words : [{id: Date.now()+'_0', q: '', a: '', createdAt: Date.now()}]);
            const inputRefs = useRef({});

            const focusInput = (idx, field) => {
                setTimeout(() => {
                    const el = inputRefs.current[`${idx}_${field}`];
                    if (el) {
                        el.focus();
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 40);
            };

            const handleInputKeyDown = (e, idx, field) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (field === 'q') {
                        focusInput(idx, 'a');
                    } else if (field === 'a') {
                        if (idx < words.length - 1) {
                            focusInput(idx + 1, 'q');
                        } else {
                            Haptics.impact('light');
                            const newCard = {
                                id: Date.now() + '_' + words.length + '_' + Math.random().toString(36).slice(2, 6),
                                q: '',
                                a: '',
                                createdAt: Date.now()
                            };
                            const nextIdx = words.length;
                            setWords(prev => [...prev, newCard]);
                            focusInput(nextIdx, 'q');
                        }
                    }
                }
            };

            return (
                <div className="min-h-screen p-5 flex flex-col max-w-lg mx-auto w-full fade-in">
                    <header className={`flex justify-between items-center mb-4 p-4 rounded-2xl ${GLASS_PANEL}`}>
                        <button onClick={onCancel} className="text-rose-500 text-xs font-semibold active:scale-95 transition">{t('cancel')}</button>
                        <h2 className="font-bold text-sm tracking-tight">{initialTopic ? t('editTopic') : t('newTopic')}</h2>
                        <button onClick={() => onSave({id: initialTopic?.id, createdAt: initialTopic?.createdAt, name: topicName || 'Без названия', words: words.filter(w=>w.q.trim()&&w.a.trim())})} className="text-indigo-600 dark:text-indigo-400 text-xs font-semibold active:scale-95 transition">{t('done')}</button>
                    </header>
                    <input 
                        type="text" 
                        value={topicName} 
                        onChange={e=>setTopicName(e.target.value)} 
                        onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); focusInput(0, 'q'); } }}
                        placeholder={t('topicName')} 
                        className={`w-full p-4 text-base font-semibold rounded-2xl mb-2 ${GLASS_INPUT}`} 
                    />
                    <p className="text-[11px] text-slate-400 dark:text-zinc-500 mb-3.5 px-1">{t('enterKeyHint')}</p>
                    <div className="space-y-3 mb-4">
                        {words.map((w, idx) => (
                            <div key={w.id} className={`flex p-3 rounded-2xl gap-2 items-center ${GLASS_PANEL}`}>
                                <div className="flex-1 space-y-2">
                                    <input 
                                        ref={el => inputRefs.current[`${idx}_q`] = el}
                                        value={w.q} 
                                        onChange={e=>{const nw=words.map((item, i) => i === idx ? {...item, q: e.target.value} : item); setWords(nw);}} 
                                        onKeyDown={(e) => handleInputKeyDown(e, idx, 'q')}
                                        enterKeyHint="next"
                                        className={`w-full p-2.5 rounded-xl text-sm ${GLASS_INPUT}`} 
                                        placeholder={t('word')}
                                    />
                                    <input 
                                        ref={el => inputRefs.current[`${idx}_a`] = el}
                                        value={w.a} 
                                        onChange={e=>{const nw=words.map((item, i) => i === idx ? {...item, a: e.target.value} : item); setWords(nw);}} 
                                        onKeyDown={(e) => handleInputKeyDown(e, idx, 'a')}
                                        enterKeyHint="next"
                                        className="w-full p-2.5 bg-indigo-500/10 dark:bg-indigo-500/15 border border-indigo-500/20 text-indigo-700 dark:text-indigo-200 placeholder-indigo-400/60 rounded-xl text-sm outline-none transition" 
                                        placeholder={t('translation')}
                                    />
                                </div>
                                <button onClick={() => { Haptics.notify('error'); setWords(words.filter(x => x.id !== w.id)); }} className="text-slate-300 dark:text-zinc-600 hover:text-rose-500 p-2 transition">
                                    <Icon name="close" className="w-4 h-4" />
                                </button>
                            </div>
                        ))}
                    </div>
                    <button onClick={() => {
                        Haptics.impact('light');
                        const nextIdx = words.length;
                        setWords([...words, {id: Date.now()+'_'+words.length+'_'+Math.random().toString(36).slice(2,6), q:'', a:'', createdAt: Date.now()}]);
                        focusInput(nextIdx, 'q');
                    }} className={`w-full py-4 text-xs font-semibold rounded-2xl border-dashed border-slate-300 dark:border-zinc-700 text-indigo-600 dark:text-indigo-400 ${GLASS_BTN}`}>
                        + {t('addCard')}
                    </button>
                </div>
            );
        }

        function FlashcardMode({ t, topic, onRecordAnswer, onBack }) {
            const [idx, setIdx] = useState(0); 
            const [flipped, setFlipped] = useState(false);
            const [seconds, setSeconds] = useState(0);
            const secondsRef = useRef(0);
            const [words] = useState(() => [...topic.words].sort(() => Math.random() - 0.5));

            useEffect(() => {
                const timer = setInterval(() => {
                    setSeconds(s => {
                        secondsRef.current = s + 1;
                        return s + 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            if (!words[idx]) { onBack(secondsRef.current, false); return null; }

            const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');

            return (
                <div className="min-h-screen p-6 flex flex-col items-center justify-between max-w-md mx-auto w-full fade-in">
                    <div className="w-full flex justify-between items-center pt-1">
                        <button onClick={() => onBack(secondsRef.current, false)} className={`px-4 py-2 rounded-full text-xs font-semibold ${GLASS_BTN}`}>
                            ← {t('exit')}
                        </button>
                        <div className={`${GLASS_PANEL} px-3.5 py-1.5 rounded-full font-semibold text-xs flex items-center gap-1.5 tabular-nums text-indigo-600 dark:text-indigo-300`}>
                            <Icon name="clock" className="w-3.5 h-3.5" />
                            <span>{mins}:{secs}</span>
                        </div>
                    </div>

                    <div className="text-center my-2">
                        <h2 className="text-base font-bold tracking-tight">{topic.name}</h2>
                        <span className="text-xs font-semibold text-slate-400 dark:text-zinc-500">{idx + 1} / {words.length}</span>
                    </div>

                    <div
                        onClick={() => { Haptics.impact('light'); setFlipped(!flipped); }}
                        className="w-full aspect-[4/5] perspective-container cursor-pointer select-none my-2"
                    >
                        <div className={`w-full h-full relative preserve-3d ${flipped ? 'rotate-y-180' : ''}`}>
                            {/* Front Side */}
                            <div className={`absolute inset-0 backface-hidden rounded-[2.5rem] ${GLASS_PANEL} shadow-glass-lg shadow-glass-inset p-8 flex flex-col items-center justify-center text-center overflow-hidden`}>
                                <div className="absolute -top-24 -left-24 w-56 h-56 bg-white/30 dark:bg-white/5 rounded-full blur-2xl pointer-events-none"></div>
                                <span className="absolute top-8 text-[10px] font-semibold uppercase tracking-widest text-slate-400 dark:text-zinc-500">
                                    {t('word')}
                                </span>
                                <h3 className="text-3xl font-bold tracking-tight break-words w-full text-slate-900 dark:text-white">
                                    {words[idx].q}
                                </h3>
                            </div>

                            {/* Back Side */}
                            <div className={`absolute inset-0 backface-hidden rotate-y-180 rounded-[2.5rem] ${GLASS_PANEL} shadow-glass-lg shadow-glass-inset p-8 flex flex-col items-center justify-center text-center overflow-hidden border-indigo-400/30`}>
                                <div className="absolute -bottom-24 -right-24 w-56 h-56 bg-indigo-500/15 rounded-full blur-2xl pointer-events-none"></div>
                                <span className="absolute top-8 text-[10px] font-semibold uppercase tracking-widest text-indigo-500 dark:text-indigo-400">
                                    {t('translation')}
                                </span>
                                <h3 className="text-3xl font-bold tracking-tight break-words w-full text-indigo-600 dark:text-indigo-300">
                                    {words[idx].a}
                                </h3>
                            </div>
                        </div>
                    </div>

                    <div className="flex gap-3.5 w-full pb-2 pt-4">
                        <button
                            onClick={() => {
                                onRecordAnswer(topic.id, words[idx].id, false);
                                setFlipped(false);
                                setTimeout(() => {
                                    if (idx + 1 >= words.length) {
                                        onBack(secondsRef.current, true);
                                    } else {
                                        setIdx(i => i + 1);
                                    }
                                }, 160);
                            }}
                            className="flex-1 py-4 liquid-glass bg-rose-500/15 dark:bg-rose-500/20 border border-rose-500/30 text-rose-600 dark:text-rose-300 rounded-2xl font-semibold text-xs shadow-glass active:scale-95 transition-all"
                        >
                            {t('dontRemember')}
                        </button>
                        <button
                            onClick={() => {
                                onRecordAnswer(topic.id, words[idx].id, true);
                                setFlipped(false);
                                setTimeout(() => {
                                    if (idx + 1 >= words.length) {
                                        onBack(secondsRef.current, true);
                                    } else {
                                        setIdx(i => i + 1);
                                    }
                                }, 160);
                            }}
                            className="flex-1 py-4 liquid-glass bg-emerald-500/15 dark:bg-emerald-500/20 border border-emerald-500/30 text-emerald-700 dark:text-emerald-300 rounded-2xl font-semibold text-xs shadow-glass active:scale-95 transition-all"
                        >
                            {t('remember')}
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
