<body class="bg-[#eef2f6] text-slate-900 dark:bg-[#090b10] dark:text-zinc-100 transition-colors duration-500 select-none">

    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const tg = window.Telegram.WebApp;
        const ADMIN_ID = 1311119781;

        // Haptic Feedback Wrapper
        const Haptics = {
            impact: (style = 'light') => { try { if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred(style); } catch(e){} },
            notify: (type = 'success') => { try { if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(type); } catch(e){} },
            selection: () => { try { if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); } catch(e){} }
        };

        const getDateStr = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const getTimeStr = (d = new Date()) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

        // 60-144FPS Dynamic Background Canvas Component with Delta Time
        const DynamicBackground = ({ bgTheme, uiTheme }) => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d', { alpha: true });
                let w = canvas.width = window.innerWidth;
                let h = canvas.height = window.innerHeight;
                let animationFrameId;
                let particles = [];
                let time = 0;
                let lastTime = performance.now();

                const initParticles = () => {
                    particles = [];
                    w = canvas.width = window.innerWidth;
                    h = canvas.height = window.innerHeight;
                    if (bgTheme === 'space') {
                        for(let i=0; i<80; i++) particles.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.5, phase: Math.random()*Math.PI*2 });
                        for(let i=0; i<2; i++) particles.push({ type: 'meteor', x: Math.random()*w, y: Math.random()*h, l: Math.random()*60+20, s: Math.random()*10+5, ang: Math.PI/4 });
                    } else if (bgTheme === 'lawn') {
                        for(let i=0; i<100; i++) particles.push({ x: Math.random()*w, h: Math.random()*h*0.25 + 20, phase: Math.random()*Math.PI*2, thick: Math.random()*2+1 });
                    } else if (bgTheme === 'winter') {
                        for(let i=0; i<120; i++) particles.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*2+1, sy: Math.random()*1.5+0.5, sx: Math.random()*1-0.5 });
                    } else if (bgTheme === 'autumn') {
                        for(let i=0; i<50; i++) particles.push({ 
                            x: Math.random()*w, y: Math.random()*h, 
                            s: Math.random()*8+4, sy: Math.random()*2+1, sx: Math.random()*2-1, 
                            ang: Math.random()*Math.PI*2, rotS: (Math.random()-0.5)*0.1,
                            col: Math.random() > 0.5 ? '#d97706' : '#b45309' 
                        });
                    }
                };

                const render = () => {
                    const now = performance.now();
                    let dt = (now - lastTime) / (1000 / 60); // Baseline is 60fps (16.66ms) -> dt = 1.0
                    if (dt > 3) dt = 3; // Cap dt to prevent massive jumps when switching tabs
                    lastTime = now;

                    time += 0.02 * dt;
                    ctx.clearRect(0, 0, w, h);
                    const isDark = uiTheme === 'dark';

                    if (bgTheme === 'space') {
                        ctx.fillStyle = isDark ? 'rgba(255,255,255,0.8)' : 'rgba(0,0,0,0.3)';
                        particles.forEach(p => {
                            if (p.type === 'meteor') {
                                ctx.beginPath();
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(p.x - Math.cos(p.ang)*p.l, p.y - Math.sin(p.ang)*p.l);
                                ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.2)';
                                ctx.lineWidth = 1.5; ctx.stroke();
                                p.x += Math.cos(p.ang)*p.s * dt; 
                                p.y += Math.sin(p.ang)*p.s * dt;
                                if (p.x > w + 100 || p.y > h + 100) { p.x = Math.random()*w - 100; p.y = -100; }
                            } else {
                                ctx.globalAlpha = Math.abs(Math.sin(time*2 + p.phase)) * 0.8 + 0.2;
                                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
                            }
                        });
                        ctx.globalAlpha = 1;
                    } else if (bgTheme === 'lawn') {
                        ctx.strokeStyle = isDark ? 'rgba(16, 185, 129, 0.4)' : 'rgba(34, 197, 94, 0.4)';
                        particles.forEach(p => {
                            ctx.beginPath();
                            ctx.moveTo(p.x, h);
                            let sway = Math.sin(time*1.5 + p.phase) * 20;
                            ctx.quadraticCurveTo(p.x + sway/2, h - p.h/2, p.x + sway, h - p.h);
                            ctx.lineWidth = p.thick; ctx.stroke();
                        });
                    } else if (bgTheme === 'winter') {
                        ctx.fillStyle = isDark ? 'rgba(255,255,255,0.7)' : 'rgba(148, 163, 184, 0.6)';
                        particles.forEach(p => {
                            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
                            p.x += (p.sx + Math.sin(time + p.y*0.01)*0.5) * dt; 
                            p.y += p.sy * dt;
                            if (p.y > h) { p.y = -10; p.x = Math.random()*w; }
                        });
                    } else if (bgTheme === 'autumn') {
                        particles.forEach(p => {
                            ctx.save();
                            ctx.translate(p.x, p.y);
                            ctx.rotate(p.ang);
                            ctx.fillStyle = isDark ? p.col : 'rgba(180, 83, 9, 0.6)';
                            ctx.globalAlpha = isDark ? 0.7 : 1;
                            ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s);
                            ctx.restore();
                            p.x += (p.sx + Math.sin(time + p.s)*0.5) * dt; 
                            p.y += p.sy * dt; 
                            p.ang += p.rotS * dt;
                            if (p.y > h) { p.y = -10; p.x = Math.random()*w; }
                        });
                    }

                    animationFrameId = requestAnimationFrame(render);
                };

                window.addEventListener('resize', initParticles);
                initParticles();
                lastTime = performance.now();
                render();

                return () => {
                    window.removeEventListener('resize', initParticles);
                    cancelAnimationFrame(animationFrameId);
                };
            }, [bgTheme, uiTheme]);

            return <canvas ref={canvasRef} className="fixed inset-0 z-[-1] pointer-events-none" />;
        };

        // Минималистичные системные SVG-иконки
        const Icon = ({ name, className = "w-5 h-5" }) => {

                bell: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
                help: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
                support: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>,
                moon: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>,
                sun: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>,
                settings: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
                chart: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>,
                close: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
                trash: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
                grip: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="20" y2="16"/></svg>,
                play: <svg className={className} viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>,
                plus: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
                calendar: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
                clock: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            };
            return icons[name] || null;
        };

        // Умное хранилище (СТРОГО БЕЗ ИЗМЕНЕНИЙ)
        const AppStorage = {
            save: (key, value) => {
                const strVal = typeof value === 'string' ? value : JSON.stringify(value);
                try { localStorage.setItem(key, strVal); } catch (e) {}
                try {
                    if (tg.isVersionAtLeast('6.9') && tg.CloudStorage) {
                        if (key === 'jazuch_topics') {
                            const chunkSize = 2500;
                            const chunks = Math.ceil(strVal.length / chunkSize);
                            tg.CloudStorage.setItem('jazuch_topics_chunks', String(chunks));
                            for (let i = 0; i < chunks; i++) {
                                tg.CloudStorage.setItem(`jazuch_topics_${i}`, strVal.slice(i * chunkSize, (i + 1) * chunkSize));
                            }
                            if (strVal.length < 3500) tg.CloudStorage.setItem(key, strVal);
                        } else {
                            tg.CloudStorage.setItem(key, strVal);
                        }
                    }
                } catch (e) {}
            },
            loadAll: (callback) => {
                const baseKeys = ['jazuch_userData', 'jazuch_myLanguages', 'jazuch_customFlags', 'jazuch_topics', 'jazuch_theme', 'jazuch_isRegistered', 'jazuch_goals', 'jazuch_studyTime', 'jazuch_streakData', 'jazuch_notifications', 'jazuch_topics_chunks'];
                const chunkKeys = Array.from({length: 15}, (_, i) => `jazuch_topics_${i}`);
                const allKeys = [...baseKeys, ...chunkKeys];
                
                const localFallback = () => {
                    const values = {};
                    baseKeys.forEach(k => { values[k] = localStorage.getItem(k); });
                    callback(values);
                };
                try {
                    if (tg.isVersionAtLeast('6.9') && tg.CloudStorage) {
                        tg.CloudStorage.getItems(allKeys, (error, values) => {
                            if (error || !values) localFallback();
                            else {
                                const numChunks = parseInt(values['jazuch_topics_chunks'] || '0', 10);
                                if (numChunks > 0) {
                                    let fullTopics = '';
                                    for (let i = 0; i < numChunks; i++) {
                                        fullTopics += (values[`jazuch_topics_${i}`] || '');
                                    }
                                    if (fullTopics) {
                                        try {
                                            JSON.parse(fullTopics);
                                            values['jazuch_topics'] = fullTopics;
                                        } catch (e) {}
                                    }
                                }
                                baseKeys.forEach(k => {
                                    const localVal = localStorage.getItem(k);
                                    if (k === 'jazuch_topics' && localVal) {
                                        if (!values[k] || localVal.length > values[k].length) {
                                            try { JSON.parse(localVal); values[k] = localVal; } catch(e){}
                                        }
                                    } else if (!values[k] && localVal) {
                                        values[k] = localVal;
                                        tg.CloudStorage.setItem(k, values[k]);
                                    }
                                });
                                callback(values);
                            }
                        });
                    } else localFallback();
                } catch(e) { localFallback(); }
            },
            clear: (callback) => {
                try {
                    localStorage.clear();
                    if (tg.isVersionAtLeast('6.9') && tg.CloudStorage) {
                        const baseKeys = ['jazuch_userData', 'jazuch_myLanguages', 'jazuch_customFlags', 'jazuch_topics', 'jazuch_theme', 'jazuch_isRegistered', 'jazuch_goals', 'jazuch_studyTime', 'jazuch_streakData', 'jazuch_notifications', 'jazuch_topics_chunks'];
                        const chunkKeys = Array.from({length: 15}, (_, i) => `jazuch_topics_${i}`);
                        tg.CloudStorage.removeItems([...baseKeys, ...chunkKeys], callback);
                    } else callback();
                } catch(e) { callback(); }
            }
        };

        const translations = {
            ru: {
                welcome: "Добро пожаловать", yourName: "Ваше имя", login: "Продолжить", goalCalendar: "Календарь целей", clickDay: "Выберите день для планирования цели", myLangs: "Мои языки", addLang: "Добавить язык", settings: "Настройки", uiLang: "Язык интерфейса", resetData: "Сбросить данные приложения", resetConfirm: "Удалить все данные? Вам придётся заново ввести /start в боте.", empty: "Список пуст", createTopic: "Создать тему", editTopic: "Изменить", newTopic: "Новая тема", cards: "карточек", cancel: "Отмена", done: "Готово", topicName: "Название темы", word: "Термин или слово", translation: "Перевод", addCard: "Добавить карточку", exit: "Закрыть", dontRemember: "Не помню", remember: "Помню", completed: "Тема пройдена. Отличный результат.", back: "Назад", support: "Поддержка", sendClose: "Отправить", goalSet: "Добавить", goalText: "Описание цели", saveGoal: "Сохранить", syncBot: "Синхронизировать с ботом", adminPanel: "Панель администратора", adminTickets: "Обращения пользователей", reply: "Ответить", markRead: "Прочитано", faqBtn: "Руководство и метод",
                sendDataError: "Для синхронизации с ботом откройте ЯЗУЧ через основную кнопку в нижней панели чата Telegram.",
                faqText: "Добро пожаловать в ЯЗУЧ — пространство для системного изучения языков.\n\nМетод интервального повторения (Кривая Эббингауза)\nАлгоритм анализирует ваши ответы и время занятий, вычисляя оптимальный момент для повторения слов до того, как они сотрутся из памяти.\n\nОсновные принципы работы:\n\n1. Два режима изучения: сначала ознакомьтесь с лексикой в режиме «Список», затем закрепите знания в режиме 3D-карточек. Таймер учитывает время автоматически.\n2. Точная самооценка: нажимайте «Помню» только при мгновенном ответе. Если возникла пауза — выберите «Не помню», чтобы алгоритм скорректировал частоту напоминаний.\n3. Синхронизация расписания: после добавления новых тем, слов или целей нажимайте «Синхронизировать с ботом» на главном экране — бот обновит план уведомлений.\n4. Серия активности и Заморозка: занимайтесь ежедневно, чтобы поддерживать серию. При необходимости активируйте «Заморозку» (доступно 3 в месяц).\n5. Персонализация: создавайте собственные языки, используйте клавишу Enter для быстрого ввода карточек и меняйте порядок тем перетаскиванием. Удалённые темы хранятся в корзине 30 дней.",

        const GLASS_PANEL = "liquid-glass bg-white/60 dark:bg-zinc-900/50 border border-white/50 dark:border-white/10 shadow-glass";
        const GLASS_CARD_INTERACTIVE = "liquid-glass bg-white/60 dark:bg-zinc-900/50 border border-white/50 dark:border-white/10 shadow-glass hover:bg-white/75 dark:hover:bg-zinc-800/60 transition-all duration-200";
        const GLASS_INPUT = "liquid-glass bg-white/50 dark:bg-zinc-800/50 border border-white/60 dark:border-white/10 text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 focus:border-indigo-500/60 dark:focus:border-indigo-400/60 outline-none transition-all";

        const parseDayTimeEntry = (val) => {
            if (typeof val === 'number') return { study: val, cards: 0, total: val };
            if (val && typeof val === 'object') {
                const st = Number(val.study) || 0;
                const cd = Number(val.cards) || 0;
                return { study: st, cards: cd, total: st + cd };
            }
            return { study: 0, cards: 0, total: 0 };
        };

        function App() {
            const [step, setStep] = useState('intro');
            const [isLoading, setIsLoading] = useState(true);
            const stateLoaded = useRef(false);
            
            const [isRegistered, setIsRegistered] = useState(false);
            const [theme, setTheme] = useState('light');
            const [userData, setUserData] = useState({ name: '', uiLanguage: 'ru', botReminders: true, regDate: getDateStr(), preferredStudyTime: '18:00', lastReviewTime: '', bgTheme: 'space' });
            const [myLanguages, setMyLanguages] = useState([]);
            const [customFlags, setCustomFlags] = useState({});
            const [topics, setTopics] = useState([]);
            const [goals, setGoals] = useState({});
            const [studyTime, setStudyTime] = useState({});
            const [streakData, setStreakData] = useState({ activeDays: [], frozenDays: [], freezesUsedMonth: '', freezesCount: 0 });
            const [notifications, setNotifications] = useState([]);
            
            const [activeLanguage, setActiveLanguage] = useState('');
            const [activeTopic, setActiveTopic] = useState(null);
            
            const [calMonth, setCalMonth] = useState(() => new Date().getMonth());
            const [calYear, setCalYear] = useState(() => new Date().getFullYear());
            const [selectedDate, setSelectedDate] = useState(null);
            const [goalText, setGoalText] = useState('');
            const [goalTime, setGoalTime] = useState('14:00');
            const [hasUnsavedGoals, setHasUnsavedGoals] = useState(false);
            
            const [supportModal, setSupportModal] = useState(false);
            const [supportText, setSupportText] = useState('');
            const [addLangModal, setAddLangModal] = useState(false);
            const [isCreatingCustomLang, setIsCreatingCustomLang] = useState(false);
            const [customLangName, setCustomLangName] = useState('');
            const [customLangIcon, setCustomLangIcon] = useState('🌍');

            const [streakModal, setStreakModal] = useState(false);
            const [notifModal, setNotifModal] = useState(false);
            const [notifTab, setNotifTab] = useState('inbox');
            const [broadcastModal, setBroadcastModal] = useState(false);
            const [broadcastText, setBroadcastText] = useState('');

            const [toastMsg, setToastMsg] = useState('');
            const [statsTab, setStatsTab] = useState('recs');

            const [dialogConfig, setDialogConfig] = useState(null);

            const [isAdminUser, setIsAdminUser] = useState(false);
            const [adminData, setAdminData] = useState({ tickets: [] });
            const [selectedTicket, setSelectedTicket] = useState(null);
            const [ticketReplyText, setTicketReplyText] = useState('');

            const [draggingTopicId, setDraggingTopicId] = useState(null);

            const t = (key) => translations[userData?.uiLanguage || 'ru']?.[key] || translations['ru'][key] || key;
            const getFlag = (lang) => customFlags[lang] || DEFAULT_LANG_FLAGS[lang] || '🌍';
            const getLangLabel = (lang) => {
                if (userData?.uiLanguage === 'en' && LANG_NAMES_EN[lang]) return LANG_NAMES_EN[lang];
                return lang;
            };

            const showToast = (msg, duration = 3200) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), duration);
            };

            const askConfirm = (message, onConfirm) => {
                Haptics.impact('medium');
                setDialogConfig({ message, onConfirm });
            };

            const sendToBot = (dataObj) => {
                try { 
                    if (tg && tg.sendData) {
                        tg.sendData(JSON.stringify(dataObj));
                    } else {
                        showToast(t('sendDataError'), 4000);
                    }
                } catch (e) { 
                    showToast(t('sendDataError'), 4000); 
                }
            };

            // NEW: Watch for background theme and enforce dark mode if 'space' is selected
            useEffect(() => {
                if (userData?.bgTheme === 'space') {
                    setTheme('dark');
                }
            }, [userData?.bgTheme]);

            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_userData', userData); }, [userData]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_myLanguages', myLanguages); }, [myLanguages]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_customFlags', customFlags); }, [customFlags]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_topics', topics); }, [topics]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_theme', theme); }, [theme]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_isRegistered', isRegistered); }, [isRegistered]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_goals', goals); }, [goals]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_studyTime', studyTime); }, [studyTime]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_streakData', streakData); }, [streakData]);
            useEffect(() => { if (stateLoaded.current) AppStorage.save('jazuch_notifications', notifications); }, [notifications]);

            useEffect(() => {
                tg.expand();
                const tgUserId = tg.initDataUnsafe?.user?.id;
                if (Number(tgUserId) === ADMIN_ID) {
                    setIsAdminUser(true);
                    setNotifTab('tickets');
                }

                const urlParams = new URLSearchParams(window.location.search);
                const dataParam = urlParams.get('data');
                let botGoals = null;
                let botRegDate = null;
                let botNotifications = [];

                if (dataParam) {
                    try {
                        const parsed = JSON.parse(decodeURIComponent(dataParam));
                        if (parsed.goals) botGoals = parsed.goals;
                        if (parsed.reg_date) botRegDate = parsed.reg_date;
                        if (parsed.notifications && Array.isArray(parsed.notifications)) botNotifications = parsed.notifications;
                        if (parsed.tickets) setAdminData({ tickets: parsed.tickets });
                        if (parsed.is_admin && (!tgUserId || Number(tgUserId) === ADMIN_ID)) {
                            setIsAdminUser(true);
                            setNotifTab('tickets');
                        }
                    } catch(e) {}
                }

                AppStorage.loadAll((values) => {
                    const isReg = values.jazuch_isRegistered === 'true';
                    setIsRegistered(isReg);
                    if (values.jazuch_theme) setTheme(values.jazuch_theme);
                    
                    let localGoals = {};
                    if (values.jazuch_goals) { try { localGoals = JSON.parse(values.jazuch_goals); } catch(e){} }
                    let loadedGoals = (botGoals && Object.keys(botGoals).length > 0) ? { ...botGoals, ...localGoals } : localGoals;
                    setGoals(loadedGoals);
                    
                    if (values.jazuch_myLanguages) { try { setMyLanguages(JSON.parse(values.jazuch_myLanguages)); } catch(e){} }
                    if (values.jazuch_customFlags) { try { setCustomFlags(JSON.parse(values.jazuch_customFlags)); } catch(e){} }
                    
                    let loadedTopics = [];
                    if (values.jazuch_topics) { 
                        try { 
                            const parsedTopics = JSON.parse(values.jazuch_topics); 
                            const now = Date.now();
                            loadedTopics = parsedTopics.filter(tp => !tp.deletedAt || (now - tp.deletedAt) < 30 * 24 * 60 * 60 * 1000);
                            setTopics(loadedTopics);
                        } catch(e){} 
                    }

                    if (values.jazuch_studyTime) { try { setStudyTime(JSON.parse(values.jazuch_studyTime)); } catch(e){} }
                    if (values.jazuch_streakData) { try { setStreakData(JSON.parse(values.jazuch_streakData)); } catch(e){} }
                    
                    let localNotifs = [];
                    if (values.jazuch_notifications) { try { localNotifs = JSON.parse(values.jazuch_notifications); } catch(e){} }
                    const notifMap = new Map();
                    localNotifs.forEach(n => notifMap.set(String(n.id), n));
                    botNotifications.forEach(n => {
                        if (!notifMap.has(String(n.id))) {
                            notifMap.set(String(n.id), { ...n, read: false });
                        }
                    });
                    const mergedNotifs = Array.from(notifMap.values()).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)).slice(0, 50);
                    setNotifications(mergedNotifs);

                    let earliestTs = Date.now();
                    loadedTopics.forEach(tp => {
                        if (tp.id && tp.id > 1600000000000 && tp.id < earliestTs) earliestTs = tp.id;
                        (tp.words || []).forEach(w => {
                            if (w.createdAt && w.createdAt > 1600000000000 && w.createdAt < earliestTs) earliestTs = w.createdAt;
                        });
                    });
                    const fallbackRegDate = botRegDate || getDateStr(new Date(earliestTs));

                    if (values.jazuch_userData) {
                        try {
                            const savedUser = JSON.parse(values.jazuch_userData);
                            setUserData({ 
                                ...savedUser, 
                                uiLanguage: savedUser.uiLanguage || 'ru',
                                botReminders: savedUser.botReminders !== false,
                                regDate: savedUser.regDate || fallbackRegDate,
                                preferredStudyTime: savedUser.preferredStudyTime || '18:00',
                                lastReviewTime: savedUser.lastReviewTime || '',
                                bgTheme: savedUser.bgTheme || 'space'
                            });
                        } catch(e){}
                    } else {
                        setUserData({ name: tg.initDataUnsafe?.user?.first_name || '', uiLanguage: 'ru', botReminders: true, regDate: fallbackRegDate, preferredStudyTime: '18:00', lastReviewTime: '', bgTheme: 'space' });
                    }
                    
                    setTimeout(() => {
                        stateLoaded.current = true;
                        setIsLoading(false);
                        if (isReg) setStep('dashboard');
                        else setStep('register');
                    }, 450);
                });
            }, []);

            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            const markActivityToday = () => {
                const todayStr = getDateStr();
                const nowTimeStr = getTimeStr();
                setUserData(prev => ({ ...prev, preferredStudyTime: prev.preferredStudyTime || nowTimeStr, lastReviewTime: nowTimeStr }));
                setStreakData(prev => {
                    if ((prev.activeDays || []).includes(todayStr)) return prev;
                    return { ...prev, activeDays: [...(prev.activeDays || []), todayStr] };
                });
            };

            const recordStudySeconds = (lang, secs, mode = 'study') => {
                if (!secs || secs <= 0) return;
                const todayStr = getDateStr();
                setStudyTime(prev => {
                    const langData = prev[lang] || {};
                    const currentEntry = parseDayTimeEntry(langData[todayStr]);
                    const updatedEntry = {
                        study: currentEntry.study + (mode === 'study' ? secs : 0),
                        cards: currentEntry.cards + (mode === 'cards' ? secs : 0)
                    };
                    return { ...prev, [lang]: { ...langData, [todayStr]: updatedEntry } };
                });
                markActivityToday();
            };

            const calculateStreak = () => {
                const activeSet = new Set(streakData.activeDays || []);
                const frozenSet = new Set(streakData.frozenDays || []);
                let count = 0;
                let d = new Date();
                const todayStr = getDateStr(d);
                
                if (!activeSet.has(todayStr) && !frozenSet.has(todayStr)) {
                    d.setDate(d.getDate() - 1);
                }
                while (true) {
                    const s = getDateStr(d);
                    if (activeSet.has(s) || frozenSet.has(s)) {
                        count++;
                        d.setDate(d.getDate() - 1);
                    } else {
                        break;
                    }
                }
                return count;
            };

            const handleShare = () => {
                Haptics.impact('light');
                const text = t('shareText');
                const copyFallback = () => {
                    const notifyCopied = () => showToast(t('shareCopied'), 3000);
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    notifyCopied();
                };

                try {
                    if (tg && tg.openTelegramLink && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        const shareUrl = "https://t.me/share/url?url=" + encodeURIComponent("https://t.me/jazuchbot") + "&text=" + encodeURIComponent("Привет! Мне тут одно приложение понравилось, с помощью которого языки можно учить. Вот ссылка, тоже попробуй");
                        tg.openTelegramLink(shareUrl);
                    } else {
                        copyFallback();
                    }
                } catch (e) {
                    copyFallback();
                }
            };

            // Синхронизация (Строго сохранена)
